<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Worldwidebro · Agent Command Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-500-normal.css">
<style>
  :root {
    --bg-0:#05070b; --bg-1:#0a0e17; --bg-2:#111827; --bg-3:#1a2234;
    --border:#1c2333; --border-hi:#2d3748;
    --text-0:#f8fafc; --text-1:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
    --cyan:#22d3ee; --green:#10b981; --amber:#f59e0b; --purple:#a78bfa;
    --red:#ef4444; --blue:#3b82f6; --pink:#ec4899;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text-0);
    font-family:'Inter',system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',monospace}
  .bg-grid{
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,211,238,0.06), transparent),
      linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
    background-size: 100% 100%, 32px 32px, 32px 32px;
  }
  .card{background:linear-gradient(180deg,rgba(17,24,39,0.85),rgba(10,14,23,0.85));
    border:1px solid var(--border);border-radius:10px;backdrop-filter:blur(8px)}
  .card-hi{background:linear-gradient(180deg,rgba(26,34,52,0.85),rgba(17,24,39,0.85));
    border:1px solid var(--border-hi);border-radius:10px}
  .pulse-dot{position:relative}
  .pulse-dot::after{content:'';position:absolute;inset:-3px;border-radius:999px;
    background:currentColor;opacity:.4;animation:pulse 2s infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.4}70%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:0}}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;
    color:var(--text-2);cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;
    border:1px solid transparent;user-select:none}
  .nav-item:hover{background:rgba(255,255,255,.03);color:var(--text-0)}
  .nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.1),rgba(34,211,238,.01));
    color:var(--cyan);border-color:rgba(34,211,238,.18)}
  .status-dot{width:7px;height:7px;border-radius:999px;display:inline-block}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
    font-size:10.5px;font-weight:600;border:1px solid;letter-spacing:.03em;font-family:'JetBrains Mono',monospace}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;
    font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid;
    font-family:inherit;white-space:nowrap}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,#22d3ee,#0891b2);color:#042f36;border-color:#22d3ee}
  .btn-primary:hover:not(:disabled){filter:brightness(1.1);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
  .btn-ghost{background:transparent;color:var(--text-1);border-color:var(--border-hi)}
  .btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.04);color:var(--text-0)}
  .btn-danger{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  .btn-danger:hover:not(:disabled){background:rgba(239,68,68,.18)}
  .btn-success{background:rgba(16,185,129,.1);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
  .btn-success:hover:not(:disabled){background:rgba(16,185,129,.18)}
  .tab{padding:8px 14px;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;
    border-bottom:2px solid transparent;transition:all .15s;user-select:none}
  .tab:hover{color:var(--text-0)}
  .tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
  .progress-bar{height:4px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden}
  .progress-fill{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .view{animation:fadeIn .22s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .agent-card{transition:all .2s;cursor:pointer}
  .agent-card:hover{border-color:var(--cyan);transform:translateY(-2px);
    box-shadow:0 8px 24px -12px rgba(34,211,238,.3)}
  .chat-bubble{background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
    z-index:50;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s}
  .tag{display:inline-block;padding:2px 8px;background:rgba(255,255,255,.04);
    border:1px solid var(--border);border-radius:4px;font-size:10.5px;color:var(--text-1);
    font-family:'JetBrains Mono',monospace}
  .sparkline{display:flex;align-items:flex-end;gap:2px;height:28px}
  .sparkline-bar{flex:1;background:linear-gradient(180deg,var(--cyan),rgba(34,211,238,.25));
    border-radius:1px;min-height:2px}
  .kbd{padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid var(--border-hi);
    border-radius:3px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-2)}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border-hi),transparent)}
  .bg-active{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.3)}
  .bg-waiting{background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.3)}
  .bg-learning{background:rgba(59,130,246,.12);color:#93c5fd;border-color:rgba(59,130,246,.3)}
  .bg-review{background:rgba(167,139,250,.12);color:#c4b5fd;border-color:rgba(167,139,250,.3)}
  .bg-failed{background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  .bg-offline{background:rgba(107,114,128,.12);color:#9ca3af;border-color:rgba(107,114,128,.3)}
  .live-indicator{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;
    color:var(--green);font-family:'JetBrains Mono',monospace;font-weight:500;letter-spacing:.05em}
  .live-indicator::before{content:'';width:6px;height:6px;border-radius:999px;
    background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .chip{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:500;
    background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text-2);
    cursor:pointer;transition:all .15s;user-select:none}
  .chip:hover{color:var(--text-0);border-color:var(--border-hi)}
  .chip.active{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.4);color:var(--cyan)}
  *::-webkit-scrollbar{width:8px;height:8px}
  *::-webkit-scrollbar-track{background:transparent}
  *::-webkit-scrollbar-thumb{background:#1c2333;border-radius:4px}
  *::-webkit-scrollbar-thumb:hover{background:#2d3748}
  .hover-row:hover{background:rgba(255,255,255,.02)}
  .metric-value{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;
    letter-spacing:-.02em;line-height:1}
  .corner-brackets{position:relative}
  .corner-brackets::before,.corner-brackets::after{content:'';position:absolute;width:8px;height:8px;
    border-color:var(--cyan);opacity:.5;pointer-events:none}
  .corner-brackets::before{top:-1px;left:-1px;border-top:1px solid;border-left:1px solid}
  .corner-brackets::after{bottom:-1px;right:-1px;border-bottom:1px solid;border-right:1px solid}
  .section-title{font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:.12em;
    text-transform:uppercase;font-family:'JetBrains Mono',monospace}
  /* Command Palette */
  .command-palette{width:600px;max-width:calc(100vw - 32px);background:var(--bg-1);
    border:1px solid var(--border-hi);border-radius:12px;z-index:100;
    box-shadow:0 24px 64px -16px rgba(0,0,0,.8),0 0 0 1px rgba(34,211,238,.1);
    overflow:hidden;animation:cmdIn .15s ease}
  @keyframes cmdIn{from{opacity:0;transform:translate(-50%,-8px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .command-palette input{width:100%;background:transparent;border:none;outline:none;
    padding:16px 20px 14px;font-size:14px;color:var(--text-0);border-bottom:1px solid var(--border);
    font-family:inherit}
  .command-palette input::placeholder{color:var(--text-3)}
  .cmd-results{max-height:420px;overflow-y:auto;padding:6px}
  .cmd-group-label{padding:8px 12px 4px;font-size:10px;font-weight:600;color:var(--text-3);
    letter-spacing:.1em;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
  .cmd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;
    cursor:pointer;font-size:13px;color:var(--text-1)}
  .cmd-item:hover,.cmd-item.selected{background:rgba(34,211,238,.08);color:var(--text-0)}
  .cmd-item .cmd-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;
    justify-content:center;font-size:11px;flex-shrink:0;font-weight:600;
    font-family:'JetBrains Mono',monospace}
  .cmd-item .cmd-meta{margin-left:auto;font-size:10px;color:var(--text-3);
    font-family:'JetBrains Mono',monospace}
  .cmd-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:16px;
    font-size:11px;color:var(--text-3);align-items:center}
  .cmd-footer span{display:inline-flex;align-items:center;gap:4px}
  /* Toasts */
  .toast-container{position:fixed;bottom:20px;right:20px;z-index:200;
    display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
  .toast{background:var(--bg-2);border:1px solid var(--border-hi);border-radius:10px;
    padding:12px 14px;min-width:300px;max-width:400px;
    box-shadow:0 12px 32px -8px rgba(0,0,0,.6);display:flex;align-items:flex-start;gap:10px;
    pointer-events:auto;animation:toastIn .25s ease}
  .toast.removing{animation:toastOut .2s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
  .toast-icon{width:20px;height:20px;border-radius:999px;display:flex;align-items:center;
    justify-content:center;flex-shrink:0;font-size:11px;font-weight:bold}
  .toast.success .toast-icon{background:rgba(16,185,129,.2);color:#6ee7b7}
  .toast.success{border-left:2px solid rgba(16,185,129,.5)}
  .toast.error .toast-icon{background:rgba(239,68,68,.2);color:#fca5a5}
  .toast.error{border-left:2px solid rgba(239,68,68,.5)}
  .toast.info .toast-icon{background:rgba(34,211,238,.2);color:#67e8f9}
  .toast.info{border-left:2px solid rgba(34,211,238,.5)}
  .toast.warning .toast-icon{background:rgba(245,158,11,.2);color:#fcd34d}
  .toast.warning{border-left:2px solid rgba(245,158,11,.5)}
  .toast-body{flex:1;min-width:0}
  .toast-title{font-size:12.5px;font-weight:600;color:var(--text-0);margin-bottom:2px}
  .toast-desc{font-size:11.5px;color:var(--text-2);line-height:1.4}
  .toast-close{background:none;border:none;color:var(--text-3);cursor:pointer;padding:0;
    font-size:16px;line-height:1}
  .toast-close:hover{color:var(--text-0)}
  /* Wizard */
  .wizard-step{display:none}
  .wizard-step.active{display:block;animation:fadeIn .2s}
  .wizard-progress{display:flex;gap:4px;margin-bottom:24px}
  .wizard-progress-bar{flex:1;height:3px;background:var(--border);border-radius:999px;transition:background .3s}
  .wizard-progress-bar.done{background:var(--cyan)}
  .wizard-progress-bar.current{background:linear-gradient(90deg,var(--cyan),rgba(34,211,238,.3))}
  .form-field{margin-bottom:14px}
  .form-field label{display:block;font-size:11px;font-weight:600;color:var(--text-2);
    margin-bottom:6px;letter-spacing:.03em}
  .form-field input,.form-field textarea,.form-field select{width:100%;background:var(--bg-2);
    border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-size:13px;
    color:var(--text-0);outline:none;transition:border-color .15s;font-family:inherit}
  .form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(34,211,238,.1)}
  .form-field textarea{resize:vertical;min-height:60px}
  .form-field .hint{font-size:10.5px;color:var(--text-3);margin-top:4px}
  .form-field .error{font-size:10.5px;color:var(--red);margin-top:4px}
  .tag-input{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-2);border:1px solid var(--border);
    border-radius:7px;padding:6px;min-height:40px;cursor:text;transition:border-color .15s}
  .tag-input:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
  .tag-input .tag{display:inline-flex;align-items:center;gap:4px}
  .tag-input .tag button{background:none;border:none;color:var(--text-3);cursor:pointer;
    padding:0;font-size:13px;line-height:1}
  .tag-input .tag button:hover{color:var(--red)}
  .tag-input input{flex:1;min-width:80px;background:transparent;border:none;outline:none;
    color:var(--text-0);font-size:12px;padding:3px 4px;font-family:inherit}
  /* Org Graph */
  .org-graph-container{position:relative;width:100%;height:640px;overflow:hidden;
    background:radial-gradient(ellipse at center,rgba(34,211,238,.04),transparent 70%)}
  .org-graph-container svg{width:100%;height:100%;cursor:grab}
  .org-graph-container svg:active{cursor:grabbing}
  .org-graph-node{cursor:pointer}
  .org-graph-node rect{transition:all .15s}
  .org-graph-node:hover rect{filter:drop-shadow(0 0 10px rgba(34,211,238,.5))}
  .org-graph-link{fill:none;stroke:var(--border-hi);stroke-width:1.5}
  .org-graph-controls{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;
    background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:4px}
  .org-graph-controls button{width:30px;height:30px;border-radius:5px;background:transparent;
    border:none;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .org-graph-controls button:hover{background:rgba(255,255,255,.05);color:var(--text-0)}
  .org-graph-controls .divider-v{height:1px;background:var(--border);margin:2px 4px}
  /* Notifications */
  .notif-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:380px;background:var(--bg-1);
    border:1px solid var(--border-hi);border-radius:10px;
    box-shadow:0 16px 40px -8px rgba(0,0,0,.6);z-index:40;overflow:hidden;animation:cmdIn .15s ease}
  .notif-item{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;
    cursor:pointer;transition:background .15s}
  .notif-item:hover{background:rgba(255,255,255,.03)}
  .notif-item:last-child{border-bottom:none}
  .notif-item.unread{background:rgba(34,211,238,.03)}
  /* Workspace dropdown */
  .ws-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg-1);
    border:1px solid var(--border-hi);border-radius:8px;box-shadow:0 12px 32px -8px rgba(0,0,0,.6);
    z-index:40;overflow:hidden;animation:cmdIn .15s ease;padding:4px}
  .ws-item{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;
    font-size:12px;transition:background .15s}
  .ws-item:hover{background:rgba(255,255,255,.04)}
  .ws-item.active{background:rgba(34,211,238,.08)}
  /* Skeleton */
  .skeleton{background:linear-gradient(90deg,var(--bg-2) 0%,var(--bg-3) 50%,var(--bg-2) 100%);
    background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
  @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Dropdown base */
  .dropdown{position:absolute;background:var(--bg-1);border:1px solid var(--border-hi);
    border-radius:8px;box-shadow:0 12px 32px -8px rgba(0,0,0,.6);z-index:40;
    overflow:hidden;animation:cmdIn .15s ease;padding:4px;min-width:160px}
  .dropdown-item{padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12px;
    color:var(--text-1);display:flex;align-items:center;gap:8px;transition:background .15s}
  .dropdown-item:hover{background:rgba(255,255,255,.04);color:var(--text-0)}
  .dropdown-item.danger{color:#fca5a5}
  .dropdown-item.danger:hover{background:rgba(239,68,68,.1)}
  .dropdown-divider{height:1px;background:var(--border);margin:4px 2px}
  /* Toggle */
  .toggle{position:relative;width:34px;height:18px;border-radius:999px;cursor:pointer;
    transition:background .2s;flex-shrink:0}
  .toggle.on{background:var(--cyan)}
  .toggle.off{background:var(--border-hi)}
  .toggle .knob{position:absolute;top:2px;width:14px;height:14px;border-radius:999px;
    background:white;transition:left .2s}
  .toggle.on .knob{left:18px}
  .toggle.off .knob{left:2px}
  /* Simulation banner */
  .sim-banner{background:linear-gradient(90deg,rgba(167,139,250,.12),rgba(236,72,153,.08));
    border-bottom:1px solid rgba(167,139,250,.25);padding:6px 20px;font-size:11.5px;
    display:flex;align-items:center;gap:10px;color:#e9d5ff}
  .sim-banner .mono{color:#f5d0fe}
  /* Reasoning trace */
  .trace-step{position:relative;padding-left:24px;padding-bottom:16px}
  .trace-step::before{content:'';position:absolute;left:7px;top:14px;bottom:0;width:1px;
    background:linear-gradient(180deg,var(--border-hi),transparent)}
  .trace-step:last-child::before{display:none}
  .trace-step .dot{position:absolute;left:0;top:4px;width:16px;height:16px;border-radius:999px;
    display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;
    font-family:'JetBrains Mono',monospace}
  /* Empty state */
  .empty-state{padding:48px 20px;text-align:center;color:var(--text-3)}
  .empty-state .icon{font-size:40px;margin-bottom:12px;opacity:.5}
  /* Focus ring */
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body class="bg-grid">

<div id="app-root" class="flex h-screen overflow-hidden"></div>

<div id="agent-modal"></div>
<div id="wizard-modal"></div>
<div id="command-palette"></div>
<div id="shortcuts-modal"></div>
<div id="trace-modal"></div>
<div id="toast-container" class="toast-container"></div>

<script>
/* ============================================================
   WORLDWIDEBRO COMMAND CENTER — v2.0 (production-grade)
   Senior-engineer build: hash router, state store, toast system,
   command palette, live event bus, agent wizard, D3 org graph,
   drill-downs, audit log, working approvals, simulation mode,
   dependency graph, cost tracking, decision reasoning traces.
   ============================================================ */

// ============ UTILITIES ============
const $  = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const fmtNum = n => n.toLocaleString();
const nowTime = () => new Date().toTimeString().split(' ')[0];
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// ============ STATE STORE (DYNAMICALLY FETCHED) ============
let Store = {
  workspaces: [],
  currentWorkspace: '',
  OPCOS: [],
  TEAMS: [],
  STATUSES: [],
  AGENTS: [],
  DEPENDENCIES: {},
  TASKS: [],
  DECISIONS: [],
  APPROVALS: [],
  EVENTS: [],
  AUDIT_LOG: [],
  NOTIFICATIONS: [],
  CHANNELS: [],
  activeChannel: '',
  MESSAGES: {},
  MEMORY: [],
  WORKFLOWS: [],
  // UI state

// ============ API FETCH LAYER ============
async function syncStore() {
  try {
    const res = await fetch('/api/dashboard/store');
    if (!res.ok) throw new Error('API server unreachable');
    const remote = await res.json();
    
    // Merge remote store data, preserving local UI states
    const localRoute = Store.route;
    const localFilter = Store.agentFilter;
    const localTab = Store.selectedAgentTab;
    const localSim = Store.simulation;
    const localPrefs = Store.preferences;
    
    Store = { 
      ...remote, 
      route: localRoute, 
      agentFilter: localFilter, 
      selectedAgentTab: localTab, 
      simulation: localSim, 
      preferences: localPrefs 
    };
  } catch (err) {
    console.warn('Backend API connection failed, using offline fallback storage.', err);
    // Initialize offline mock data if store is empty
    if (Store.AGENTS.length === 0) {
      initializeOfflineMock();
    }
  }
}

function sparkline(seed, count = 16) {
  let bars = '';
  for (let i = 0; i < count; i++) {
    const h = 20 + ((seed * (i + 3) * 9301 + 49297) % 233280) / 233280 * 80;
    bars += `<div class="sparkline-bar" style="height:${h}%"></div>`;
  }
  return `<div class="sparkline">${bars}</div>`;
}

// ============ TOAST SYSTEM ============
const Toast = {
  show({ type='info', title, desc, duration=4000, action }) {
    const container = $('#toast-container');
    const icons = { success:'✓', error:'✕', info:'i', warning:'!' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
      <div class="toast-icon">${icons[type]}</div>
      <div class="toast-body">
        <div class="toast-title">${escapeHtml(title)}</div>
        ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
        ${action ? `<button class="text-[11px] font-semibold mt-1" style="color:var(--cyan)">${escapeHtml(action.label)}</button>` : ''}
      </div>
      <button class="toast-close" aria-label="Close">×</button>
    `;
    el.querySelector('.toast-close').onclick = () => this.dismiss(el);
    if (action) {
      el.querySelector('.toast-body button').onclick = () => {
        action.onClick();
        this.dismiss(el);
      };
    }
    container.appendChild(el);
    if (duration > 0) setTimeout(() => this.dismiss(el), duration);
    return el;
  },
  dismiss(el) {
    if (!el || el.classList.contains('removing')) return;
    el.classList.add('removing');
    setTimeout(() => el.remove(), 200);
  },
  success(t, d, a) { this.show({ type:'success', title:t, desc:d, action:a }); },
  error(t, d, a)   { this.show({ type:'error', title:t, desc:d, action:a }); },
  info(t, d, a)    { this.show({ type:'info', title:t, desc:d, action:a }); },
  warning(t, d, a) { this.show({ type:'warning', title:t, desc:d, action:a }); },
};

// ============ ROUTER ============
const Router = {
  parseHash() {
    const hash = location.hash.replace(/^#/, '') || '/dashboard';
    const parts = hash.split('/').filter(Boolean);
    return { view: parts[0] || 'dashboard', param1: parts[1], param2: parts[2] };
  },
  navigate(route) { location.hash = '#' + route; },
  async init() {
    window.addEventListener('hashchange', () => this.render());
    await syncStore();
    this.render();
  },
  async render() {
    await syncStore();
    const { view, param1, param2 } = this.parseHash();
    Store.route = { view, param1, param2 };

    $$('.nav-item').forEach(el => {
      const r = el.dataset.route;
      const active = r === view || (view === 'opco' && r === 'opcos') || (view === 'team' && r === 'teams');
      el.classList.toggle('active', active);
    });

    this.renderBreadcrumbs(view, param1);

    const container = $('#view-container');
    if (!container) return;
    container.innerHTML = '';
    const renderer = Views[view];
    if (renderer) {
      container.innerHTML = Views[view](param1, param2);
      container.scrollTop = 0;
      if (view === 'analytics') setTimeout(initCharts, 50);
      if (view === 'organization') setTimeout(initOrgGraph, 50);
      if (view === 'dependencies') setTimeout(initDepGraph, 50);
    } else {
      container.innerHTML = Views.notFound();
    }

    this.updateCounters();
  },
  renderBreadcrumbs(view, param1) {
    const el = $('#breadcrumbs');
    if (!el) return;
    const crumbs = [{ label:'IZA OS', route:'/dashboard' }];
    const labels = {
      dashboard:'Dashboard', organization:'Organization', opcos:'OPCOs', teams:'Teams',
      agents:'Agents', tasks:'Tasks', decisions:'Decisions', approvals:'Approvals',
      memory:'Memory', workflows:'Workflows', analytics:'Analytics', comms:'Communications',
      audit:'Audit Log', settings:'Settings', dependencies:'Dependencies', bottlenecks:'Bottlenecks',
    };
    if (view === 'opco' && param1) {
      crumbs.push({ label:'OPCOs', route:'/opcos' });
      const opco = getOpco(param1);
      crumbs.push({ label: opco ? opco.name : param1 });
    } else if (view === 'team' && param1) {
      crumbs.push({ label:'Teams', route:'/teams' });
      const team = getTeam(param1);
      crumbs.push({ label: team ? team.name : param1 });
    } else if (labels[view]) {
      crumbs.push({ label: labels[view] });
    }
    el.innerHTML = crumbs.map((c, i) => {
      const isLast = i === crumbs.length - 1;
      const sep = i > 0 ? '<span class="text-[var(--text-3)] mx-1">/</span>' : '';
      if (isLast || !c.route) {
        return `${sep}<span class="${isLast ? 'text-[var(--text-0)] font-medium' : 'text-[var(--text-2)]'}">${escapeHtml(c.label)}</span>`;
      }
      return `${sep}<a href="#${c.route}" class="text-[var(--text-2)] hover:text-[var(--text-0)] transition-colors">${escapeHtml(c.label)}</a>`;
    }).join('');
  },
  updateCounters() {
    const ac = $('#nav-agent-count');
    const tc = $('#nav-task-count');
    const apc = $('#nav-approval-count');
    if (ac) ac.textContent = Store.AGENTS.length;
    if (tc) tc.textContent = fmtNum(Store.TASKS.length);
    if (apc) apc.textContent = Store.APPROVALS.filter(a => Object.values(a.reviews).some(v => v === 'pending')).length;
  }
};

// ============ COMMAND PALETTE ============
const CommandPalette = {
  open: false, query: '', selectedIndex: 0, results: [],
  openPalette() {
    this.open = true; this.query = ''; this.selectedIndex = 0;
    $('#command-palette').innerHTML = this.renderShell();
    $('#command-palette').classList.remove('hidden');
    setTimeout(() => $('#cmd-input')?.focus(), 50);
    this.computeAndRender();
  },
  closePalette() { this.open = false; $('#command-palette').classList.add('hidden'); $('#command-palette').innerHTML = ''; },
  fuzzyMatch(q, text) {
    if (!q) return { match:true, score:0 };
    const ql = q.toLowerCase(), tl = text.toLowerCase();
    if (tl.includes(ql)) return { match:true, score:100 - tl.indexOf(ql) };
    let qi = 0;
    for (let i = 0; i < tl.length && qi < ql.length; i++) if (tl[i] === ql[qi]) qi++;
    if (qi === ql.length) return { match:true, score:50 };
    return { match:false, score:0 };
  },
  computeAndRender() {
    const q = this.query.trim();
    const results = [];
    const navItems = [
      { label:'Go to Dashboard', route:'/dashboard', icon:'⌂', color:'cyan', category:'Navigation' },
      { label:'Go to Organization', route:'/organization', icon:'◉', color:'purple', category:'Navigation' },
      { label:'Go to Agents', route:'/agents', icon:'▣', color:'cyan', category:'Navigation' },
      { label:'Go to Tasks', route:'/tasks', icon:'✓', color:'cyan', category:'Navigation' },
      { label:'Go to Decisions', route:'/decisions', icon:'⚖', color:'amber', category:'Navigation' },
      { label:'Go to Approvals', route:'/approvals', icon:'✎', color:'amber', category:'Navigation' },
      { label:'Go to Analytics', route:'/analytics', icon:'◰', color:'green', category:'Navigation' },
      { label:'Go to Dependencies', route:'/dependencies', icon:'⬡', color:'pink', category:'Navigation' },
      { label:'Create New Agent', action:'create-agent', icon:'+', color:'cyan', category:'Actions' },
      { label:'Toggle Simulation Mode', action:'toggle-sim', icon:'▶', color:'purple', category:'Actions' },
      { label:'Show Keyboard Shortcuts', action:'show-shortcuts', icon:'⌨', color:'amber', category:'Actions' },
    ];
    navItems.forEach(item => {
      const m = this.fuzzyMatch(q, item.label);
      if (m.match) results.push({ ...item, score:m.score, kind:'nav' });
    });
    Store.AGENTS.forEach(a => {
      const m = this.fuzzyMatch(q, a.name);
      if (m.match) results.push({ label:a.name, sub:`${a.role} · ${getOpco(a.opco)?.name || 'OPCO'}`, icon:a.name.substring(0,2).toUpperCase(), color:getOpco(a.opco)?.color || '#999', category:'Agents', action:'open-agent', agentId:a.id, score:m.score+10, kind:'agent' });
    });
    if (q.length >= 1) {
      Store.TASKS.forEach(t => {
        const m = this.fuzzyMatch(q, t.title);
        if (m.match) results.push({ label:t.title, sub:`${t.id} · ${getAgent(t.agent)?.name || ''}`, icon:'T', color:'#22d3ee', category:'Tasks', action:'open-agent', agentId:t.agent, score:m.score, kind:'task' });
      });
      Store.DECISIONS.forEach(d => {
        const m = this.fuzzyMatch(q, d.question);
        if (m.match) results.push({ label:d.question, sub:d.id, icon:'D', color:'#a78bfa', category:'Decisions', route:'/decisions', score:m.score, kind:'decision' });
      });
    }
    Store.OPCOS.forEach(o => {
      const m = this.fuzzyMatch(q, o.name);
      if (m.match) results.push({ label:o.name+' OPCO', sub:`${Store.AGENTS.filter(a=>a.opco===o.id).length} agents`, icon:o.icon, color:o.color, category:'OPCOs', route:`/opco/${o.id}`, score:m.score+5, kind:'opco' });
    });
    Store.TEAMS.forEach(t => {
      const m = this.fuzzyMatch(q, t.name);
      if (m.match) results.push({ label:t.name+' Team', sub:getOpco(t.opco)?.name || '', icon:'T', color:getOpco(t.opco)?.color || '#999', category:'Teams', route:`/team/${t.id}`, score:m.score+5, kind:'team' });
    });
    results.sort((a,b) => b.score - a.score);
    this.results = results.slice(0, 20);
    this.renderResults();
  },
  renderShell() {
    return `
      <div class="modal-backdrop" style="background:rgba(0,0,0,.5)" onclick="if(event.target===this)CommandPalette.closePalette()">
        <div class="command-palette" onclick="event.stopPropagation()">
          <input id="cmd-input" type="text" placeholder="Type a command or search…" autocomplete="off"/>
          <div class="cmd-results" id="cmd-results"></div>
          <div class="cmd-footer">
            <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
            <span><span class="kbd">↵</span> select</span>
            <span><span class="kbd">esc</span> close</span>
            <span style="margin-left:auto" class="mono text-[10px]">worldwidebro v2.0</span>
          </div>
        </div>
      </div>
    `;
  },
  renderResults() {
    const container = $('#cmd-results');
    if (!container) return;
    const grouped = {};
    this.results.forEach((r, i) => {
      if (!grouped[r.category]) grouped[r.category] = [];
      grouped[r.category].push({ ...r, idx:i });
    });
    if (this.results.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="icon">∅</div><div>No results for "${escapeHtml(this.query)}"</div></div>`;
      return;
    }
    container.innerHTML = Object.entries(grouped).map(([cat, items]) => `
      <div class="cmd-group-label">${cat}</div>
      ${items.map(item => `
        <div class="cmd-item ${item.idx === this.selectedIndex ? 'selected' : ''}" data-idx="${item.idx}">
          <div class="cmd-icon" style="background:${item.color}20;color:${item.color};border:1px solid ${item.color}40">${escapeHtml(item.icon)}</div>
          <div class="flex-1 min-w-0">
            <div class="truncate">${escapeHtml(item.label)}</div>
            ${item.sub ? `<div class="text-[10px] text-[var(--text-3)] truncate">${escapeHtml(item.sub)}</div>` : ''}
          </div>
          ${item.route ? '<span class="cmd-meta">↵</span>' : ''}
        </div>
      `).join('')}
    `).join('');
    $$('.cmd-item', container).forEach(el => {
      el.onclick = () => { this.selectedIndex = parseInt(el.dataset.idx); this.execute(); };
      el.onmouseenter = () => {
        this.selectedIndex = parseInt(el.dataset.idx);
        $$('.cmd-item', container).forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
      };
    });
  },
  execute() {
    const item = this.results[this.selectedIndex];
    if (!item) return;
    this.closePalette();
    if (item.action === 'create-agent') Wizard.open();
    else if (item.action === 'open-agent') { Router.navigate(item.route || '/agents'); setTimeout(() => AgentModal.open(item.agentId), 100); }
    else if (item.action === 'toggle-sim') Simulation.toggle();
    else if (item.action === 'show-shortcuts') ShortcutsModal.open();
    else if (item.route) Router.navigate(item.route);
  },
  handleKey(e) {
    if (!this.open) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); this.selectedIndex = Math.min(this.selectedIndex+1, this.results.length-1); this.renderResults(); this.scrollSelected(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.selectedIndex = Math.max(this.selectedIndex-1, 0); this.renderResults(); this.scrollSelected(); }
    else if (e.key === 'Enter') { e.preventDefault(); this.execute(); }
    else if (e.key === 'Escape') { e.preventDefault(); this.closePalette(); }
  },
  scrollSelected() {
    const sel = $('.cmd-item.selected');
    sel?.scrollIntoView({ block:'nearest' });
  }
};

  close() { $('#agent-modal').classList.add('hidden'); $('#agent-modal').innerHTML = ''; },
  async toggleStatus(id) {
    const a = getAgent(id); if (!a) return;
    try {
      const res = await fetch(`/api/dashboard/agents/${id}/status`, { method: 'POST' });
      if (!res.ok) throw new Error('Failed to update status on server');
      const updated = await res.json();
      Toast.success(`${updated.name} updated`, `Status is now ${updated.status}`);
    } catch (err) {
      // Local fallback
      a.status = a.status === 'active' ? 'offline' : 'active';
      Toast.warning(`${a.name} updated (offline fallback)`, 'Status toggled locally');
    }
    this.close();
    Router.render();
  },
  async retire(id) {
    const a = getAgent(id); if (!a) return;
    if (!confirm(`Retire ${a.name}? This will deactivate the agent and archive its tasks.`)) return;
    
    try {
      const res = await fetch(`/api/dashboard/agents/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to retire agent on server');
      Toast.warning(`${a.name} retired`, 'Agent has been deactivated');
    } catch (err) {
      Store.AGENTS = Store.AGENTS.filter(x => x.id !== id);
      Toast.warning(`${a.name} retired (offline fallback)`, 'Agent deactivated locally');
    }
    this.close();
    Router.render();
  }
};

// ============ AGENT WIZARD ============
const Wizard = {
  step:1, totalSteps:4,
  data:{ name:'', role:'', mission:'', opco:'', team:'', reportsTo:'', capabilities:[], can:[], cannot:[] },
  errors:{},
  open() {
    this.step = 1;
    this.data = { name:'', role:'', mission:'', opco:'', team:'', reportsTo:'', capabilities:[], can:[], cannot:[] };
    this.errors = {};
    this.render();
    $('#wizard-modal').classList.remove('hidden');
  },
  close() { $('#wizard-modal').classList.add('hidden'); $('#wizard-modal').innerHTML = ''; },
  validate() {
    this.errors = {};
    if (this.step === 1) {
      if (!this.data.name.trim()) this.errors.name = 'Name is required';
      else if (Store.AGENTS.some(a => a.name.toLowerCase() === this.data.name.trim().toLowerCase())) this.errors.name = 'Name already exists';
      if (!this.data.role.trim()) this.errors.role = 'Role is required';
      if (!this.data.mission.trim()) this.errors.mission = 'Mission is required';
    } else if (this.step === 2) {
      if (!this.data.opco) this.errors.opco = 'OPCO is required';
      if (!this.data.team) this.errors.team = 'Team is required';
      if (!this.data.reportsTo.trim()) this.errors.reportsTo = 'Manager is required';
    } else if (this.step === 3) {
      if (this.data.capabilities.length === 0) this.errors.capabilities = 'Add at least one capability';
    }
    return Object.keys(this.errors).length === 0;
  },
  next() {
    if (!this.validate()) { this.render(); return; }
    if (this.step < this.totalSteps) { this.step++; this.render(); }
    else this.submit();
  },
  back() { if (this.step > 1) { this.step--; this.render(); } },
  async submit() {
    try {
      const res = await fetch('/api/dashboard/agents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(this.data),
      });
      if (!res.ok) throw new Error('API server rejected request');
      const created = await res.json();
      
      this.close();
      Toast.success('Agent created', `${created.name} is ready for activation`, {
        label:'View →', onClick:() => AgentModal.open(created.id)
      });
    } catch (err) {
      // Local fallback
      const id = this.data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString(36).slice(-4);
      const newAgent = {
        id, name:this.data.name, role:this.data.role, team:this.data.team, opco:this.data.opco,
        status:'offline', mission:this.data.mission, reportsTo:this.data.reportsTo,
        capabilities:[...this.data.capabilities], cpu:0, mem:0, confidence:0,
        task:'Awaiting activation', progress:0, docs:0, decisions:0,
        can:[...this.data.can], cannot:[...this.data.cannot],
        createdAt:new Date().toISOString().split('T')[0], tokens:0, cost:0,
      };
      Store.AGENTS.push(newAgent);
      this.close();
      Toast.warning('Agent created (offline fallback)', `${newAgent.name} created locally`, {
        label:'View →', onClick:() => AgentModal.open(id)
      });
    }
    Router.render();
  },
  render() {
    const modal = $('#wizard-modal');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)Wizard.close()">
        <div class="card w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
          <div class="p-6">
            <div class="flex items-start justify-between mb-4">
              <div>
                <h2 class="text-lg font-bold">Create New Agent</h2>
                <p class="text-xs text-[var(--text-3)] mt-1">Step ${this.step} of ${this.totalSteps}</p>
              </div>
              <button onclick="Wizard.close()" class="w-8 h-8 rounded-lg bg-[var(--bg-2)] border border-[var(--border)] hover:border-[var(--border-hi)] flex items-center justify-center" aria-label="Close">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="wizard-progress">
              ${Array.from({length:this.totalSteps}).map((_,i) => {
                const n = i+1;
                const cls = n < this.step ? 'done' : n === this.step ? 'current' : '';
                return `<div class="wizard-progress-bar ${cls}"></div>`;
              }).join('')}
            </div>
            <div class="wizard-step ${this.step === 1 ? 'active' : ''}">
              <div class="section-title mb-4">Basic Information</div>
              <div class="form-field">
                <label>Agent Name *</label>
                <input type="text" id="wiz-name" value="${escapeHtml(this.data.name)}" placeholder="e.g. Pricing Agent"/>

              </div>

                <label>Role *</label>

                <div class="tag-input" id="wiz-cap-input">

                <div class="space-y-2 text-xs">
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Name</span><span>${escapeHtml(this.data.name || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Role</span><span>${escapeHtml(this.data.role || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">OPCO</span><span>${getOpco(this.data.opco)?.name || '—'}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Team</span><span>${getTeam(this.data.team)?.name || '—'}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Reports To</span><span>${escapeHtml(this.data.reportsTo || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Capabilities</span><span>${this.data.capabilities.length}</span></div>
                </div>
              </div>
            </div>
            <div class="flex items-center justify-between pt-4 mt-4 border-t border-[var(--border)]">
              <button class="btn btn-ghost text-xs" onclick="Wizard.back()" ${this.step===1?'disabled':''}>← Back</button>
              <button class="btn btn-primary text-xs" onclick="Wizard.next()">${this.step===this.totalSteps?'Create Agent':'Continue →'}</button>
            </div>
          </div>
        </div>
      </div>
    `;
    const bind = (id, field) => {
      const el = $('#'+id);
      if (el) el.addEventListener('input', e => { this.data[field] = e.target.value; });
    };
    bind('wiz-name','name'); bind('wiz-role','role'); bind('wiz-mission','mission'); bind('wiz-reports','reportsTo');
    const opcoSel = $('#wiz-opco');
    if (opcoSel) opcoSel.addEventListener('change', e => { this.data.opco = e.target.value; this.data.team = ''; this.render(); });
    const teamSel = $('#wiz-team');
    if (teamSel) teamSel.addEventListener('change', e => { this.data.team = e.target.value; });
    this.bindTagInput('wiz-cap-entry','capabilities');
    this.bindTagInput('wiz-can-entry','can');
    this.bindTagInput('wiz-cannot-entry','cannot');
    $$('[data-suggest]').forEach(btn => {
      btn.onclick = () => {
        const field = btn.dataset.field; const val = btn.dataset.suggest;
        if (!this.data[field].includes(val)) this.data[field].push(val);
        this.render();
      };
    });
    $$('[data-field][data-idx]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const field = btn.dataset.field; const idx = parseInt(btn.dataset.idx);
        this.data[field].splice(idx, 1); this.render();
      };
    });
  },
  bindTagInput(inputId, field) {
    const input = $('#'+inputId);
    if (!input) return;
    input.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
        e.preventDefault();
        const val = input.value.replace(/,/g,'').trim();
        if (val && !this.data[field].includes(val)) { this.data[field].push(val); this.render(); }
      } else if (e.key === 'Backspace' && !input.value && this.data[field].length) {
        this.data[field].pop(); this.render();
      }
    });
  }
};

// ============ EVENT BUS ============
const EventBus = {
  intervalId: null,
  templates: [
    { type:'task.completed', text:'Completed task {task}', color:'green' },
    { type:'agent.started', text:'Started working on {task}', color:'cyan' },
    { type:'memory.updated', text:'Indexed {n} new documents', color:'blue' },
    { type:'decision.created', text:'Opened new decision thread', color:'purple' },
    { type:'metric.updated', text:'Confidence updated to {n}%', color:'cyan' },
  ],
  start() { this.intervalId = setInterval(() => this.tick(), 7000); },
  stop() { if (this.intervalId) clearInterval(this.intervalId); },
  accelerate() { this.stop(); this.intervalId = setInterval(() => this.tick(), 1800); },
  decelerate() { this.stop(); this.intervalId = setInterval(() => this.tick(), 7000); },
  tick() {
    const activeAgents = Store.AGENTS.filter(a => a.status === 'active');
    if (activeAgents.length === 0) return;
    const agent = activeAgents[Math.floor(Math.random() * activeAgents.length)];
    const tmpl = this.templates[Math.floor(Math.random() * this.templates.length)];
    const n = 3 + Math.floor(Math.random() * 40);
    const text = tmpl.text.replace('{task}', agent.task || 'ongoing process').replace('{n}', String(n));
    Store.EVENTS.unshift({ time:'now', type:tmpl.type, agent:agent.name, agentId:agent.id, text, color:tmpl.color });
    if (Store.EVENTS.length > 30) Store.EVENTS.pop();
    Store.EVENTS.forEach((e, i) => { if (i > 0 && e.time === 'now') e.time = 'just now'; });
    agent.cpu = clamp(agent.cpu + (Math.random() * 10 - 5), 5, 95);
    agent.confidence = clamp(agent.confidence + (Math.random() * 4 - 2), 60, 99);
    agent.tokens += Math.floor(Math.random() * 800 + 200);
    agent.cost += (Math.random() * 0.02 + 0.005);
    if (Store.route.view === 'dashboard') {
      const stream = $('#event-stream');
      if (stream) stream.innerHTML = this.renderEvents();
      const kpi = $('#kpi-agents');
      if (kpi) kpi.textContent = Store.AGENTS.filter(a => a.status === 'active').length;
    }
  },
  renderEvents() {
    return Store.EVENTS.slice(0, 10).map(e => `
      <div class="flex gap-3 py-2 hover-row rounded px-1 -mx-1">
        <div class="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style="background:var(--${e.color})"></div>
        <div class="flex-1 min-w-0">
          <div class="text-xs text-[var(--text-0)] truncate">${escapeHtml(e.text)}</div>
          <div class="flex items-center gap-2 mt-0.5">
            <button class="text-[10px] mono text-[var(--text-3)] hover:text-cyan-400 transition-colors" onclick="AgentModal.open('${e.agentId}')">${escapeHtml(e.agent)}</button>
            <span class="text-[10px] text-[var(--text-3)]">·</span>
            <span class="text-[10px] mono text-[var(--text-3)]">${e.time}</span>
          </div>
        </div>
      </div>
    `).join('');
  }
};

const Exporter = {
  download(filename, content, mime = 'text/csv') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  dashboard() {
    const rows = [['Metric','Value']];
    rows.push(['Active Agents', Store.AGENTS.filter(a => a.status === 'active').length]);
    rows.push(['Total Agents', Store.AGENTS.length]);
    rows.push(['Running Tasks', Store.TASKS.filter(t => t.status === 'in_progress').length]);
    rows.push(['Pending Decisions', Store.DECISIONS.filter(d => d.status === 'pending').length]);
    rows.push(['Total Cost (30d)', '$' + Store.AGENTS.reduce((s,a) => s + a.cost, 0).toFixed(2)]);
    this.download('worldwidebro-dashboard.csv', rows.map(r => r.join(',')).join('\n'));
    Toast.success('Exported', 'Dashboard data downloaded as CSV');
  },
  decisions() {
    const rows = [['ID','Question','Framework','Confidence','Status','Recommendation']];
    Store.DECISIONS.forEach(d => rows.push([d.id, d.question, d.framework, d.confidence, d.status, d.recommendation]));
    this.download('worldwidebro-decisions.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'));
    Toast.success('Exported', 'Decisions downloaded as CSV');
  },
  analytics() {
    const rows = [['Agent','Tokens (30d)','Cost (30d)','Confidence','Status']];
    Store.AGENTS.forEach(a => rows.push([a.name, a.tokens, a.cost.toFixed(2), a.confidence, a.status]));
    this.download('worldwidebro-analytics.csv', rows.map(r => r.join(',')).join('\n'));
    Toast.success('Exported', 'Analytics downloaded as CSV');
  },
  audit() {
    const rows = [['Time','Actor','Action','Target','Type']];
    Store.AUDIT_LOG.forEach(l => rows.push([l.time, l.actor, l.action, l.target, l.type]));
    this.download('worldwidebro-audit.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'));

// ============ APPROVAL ACTIONS ============
const Approvals = {
  async act(id, action) {
    const a = Store.APPROVALS.find(x => x.id === id);
    if (!a) return;
    
    try {
      const res = await fetch(`/api/dashboard/approvals/${id}/act`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action }),
      });
      if (!res.ok) throw new Error('API server rejected request');
      const updated = await res.json();
      Toast.success('Action successful', `${action} successfully submitted`);
    } catch (err) {
      // Local fallback
      if (action === 'approve') {
        Object.keys(a.reviews).forEach(k => a.reviews[k] = 'approved');
        Toast.warning('Approved (offline fallback)', `${a.agent} approved locally`);
      } else if (action === 'reject') {
        Object.keys(a.reviews).forEach(k => a.reviews[k] = 'rejected');
        Toast.warning('Rejected (offline fallback)', `${a.agent} rejected locally`);
      }
    }
    Router.render();
  }
};

      const click = type === 'opco' ? `onclick="Router.navigate('/opco/${node.id}')"` :

      return `

  bottlenecks() {
    // Compute bottleneck score
    const scores = Store.AGENTS.map(a => {
      const dependents = Object.entries(Store.DEPENDENCIES).filter(([_, deps]) => deps.includes(a.id)).length;
      const queue = Store.TASKS.filter(t => t.agent === a.id).length;
      const score = (dependents * 10) + (a.cpu * 0.3) + (queue * 5) + (100 - a.progress) * 0.2;
      return { agent: a, score, dependents, queue };
    }).sort((a,b) => b.score - a.score);

    return `
    <div class="view p-6 space-y-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight mb-1">Bottleneck Analysis</h1>
        <p class="text-sm text-[var(--text-2)]">Agents ranked by constraint impact · higher score = more critical bottleneck</p>

          ${scores.map((s, i) => {
            const a = s.agent;
            const op = getOpco(a.opco) || { color: '#22d3ee' };
            const severity = s.score > 80 ? 'red' : s.score > 40 ? 'amber' : 'green';
            return `

                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">

                      ${statusBadge(a.status)}

                    <div class="text-[11px] text-[var(--text-3)]">${escapeHtml(a.task)}</div>

                  <div class="flex items-center gap-6">
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">CPU</div>
                      <div class="text-xs mono">${Math.round(a.cpu)}%</div>
                    </div>
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">QUEUE</div>
                      <div class="text-xs mono">${s.queue}</div>
                    </div>
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">DEPENDENTS</div>

    Store.activeChannel = id;

  async sendMessage(text) {
    if (!text || !text.trim()) return;
    const channel = Store.activeChannel;
    
    try {
      const res = await fetch('/api/dashboard/comms/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channelId: channel, message: text.trim() })
      });
      if (!res.ok) throw new Error();
    } catch (err) {
      if (!Store.MESSAGES[channel]) Store.MESSAGES[channel] = [];
      Store.MESSAGES[channel].push({ agent:'frontend', msg:text.trim(), time:new Date().toTimeString().slice(0,5), type:'update' });
    }
    Router.render();
  },

// ============ CHART.JS INIT ============
let charts = {};
function initCharts() {
  const destroy = (id) => { if (charts[id]) { charts[id].destroy(); delete charts[id]; } };
  
  const activityEl = document.getElementById('chart-activity');
  if (activityEl) {
    destroy('activity');
    charts.activity = new Chart(activityEl, {
      type: 'bar',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{ label: 'Tasks Completed', data: [42, 58, 62, 71, 68, 24, 38], backgroundColor: '#22d3ee' }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
    });
  }

  const statusEl = document.getElementById('chart-status');
  if (statusEl) {
    destroy('status');
    const active = Store.AGENTS.filter(a => a.status === 'active').length;
    const offline = Store.AGENTS.filter(a => a.status === 'offline').length;
    const failed = Store.AGENTS.filter(a => a.status === 'failed').length;
    charts.status = new Chart(statusEl, {
      type: 'doughnut',
      data: {
        labels: ['Active', 'Offline', 'Failed'],
        datasets: [{ data: [active, offline, failed], backgroundColor: ['#10b981', '#6b7280', '#ef4444'] }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
}

// ============ D3 FORCE SIMULATION GRAPH ============
function initDepGraph() {
  const container = document.getElementById('dep-graph');
  if (!container) return;
  container.innerHTML = '';
  const width = container.clientWidth;
  const height = 640;

  const nodes = Store.AGENTS.map(a => ({ id: a.id, name: a.name, opco: a.opco }));
  const links = [];
  
  Object.entries(Store.DEPENDENCIES).forEach(([source, targets]) => {
    targets.forEach(target => {
      if (nodes.some(n => n.id === source) && nodes.some(n => n.id === target)) {
        links.push({ source, target });
      }
    });
  });

  const svg = d3.select(container).append('svg')
    .attr('width', width).attr('height', height);

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.3, 3])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
      const el = document.getElementById('dep-zoom-level');
      if (el) el.textContent = `Zoom: ${Math.round(event.transform.k * 100)}%`;
    });
  svg.call(zoom);

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', 'var(--border-hi)').attr('stroke-width', 2);

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle').attr('r', 18).attr('fill', d => {
    const op = getOpco(d.opco);
    return op ? op.color : '#999';
  }).attr('opacity', 0.85);

  node.append('text').attr('text-anchor', 'middle').attr('y', 4)
    .attr('fill', 'var(--text-0)').style('font-size', '9px').style('font-weight', 'bold')
    .text(d => d.name.substring(0,2).toUpperCase());

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function initOrgGraph() {
  initOrgTreeD3();
}

function initOrgTreeD3() {
  const container = document.getElementById('org-graph');
  if (!container) return;
  container.innerHTML = '';
  const width = container.clientWidth;
  const height = 640;

  const rootNode = {
    name:'Worldwidebro', type:'root',
    children: Store.OPCOS.map(o => ({
      ...o, type:'opco',
      children: Store.TEAMS.filter(t => t.opco === o.id).map(t => ({
        ...t, type:'team',
        children: Store.AGENTS.filter(a => a.team === t.id).map(a => ({ ...a, type:'agent' }))
      }))
    }))
  };

  const hierarchy = d3.hierarchy(rootNode);
  const treeLayout = d3.tree().nodeSize([45, 120]);
  treeLayout(hierarchy);

  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
  hierarchy.each(d => {
    xMin = Math.min(xMin, d.x); xMax = Math.max(xMax, d.x);
    yMin = Math.min(yMin, d.y); yMax = Math.max(yMax, d.y);
  });

  const svg = d3.select(container).append('svg')
    .attr('width', width).attr('height', height)
    .attr('viewBox', `${xMin - 90} ${yMin - 50} ${xMax - xMin + 180} ${yMax - yMin + 100}`);

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.3, 2.5])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
      const el = document.getElementById('zoom-level');
      if (el) el.textContent = `Zoom: ${Math.round(event.transform.k * 100)}%`;
    });
  svg.call(zoom);

  g.append('g').attr('class','links').selectAll('path').data(hierarchy.links()).join('path')
    .attr('class','org-graph-link')
    .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

  const nodeColors = {
    root:{ fill:'rgba(34,211,238,.15)', stroke:'rgba(34,211,238,.5)', text:'#22d3ee' },
    opco:{ fill:'rgba(167,139,250,.12)', stroke:'rgba(167,139,250,.4)', text:'#a78bfa' },
    team:{ fill:'rgba(16,185,129,.12)', stroke:'rgba(16,185,129,.4)', text:'#10b981' },
    agent:{ fill:'rgba(255,255,255,.03)', stroke:'rgba(55,65,81,.8)', text:'#d1d5db' },
  };

  const nodes = g.append('g').attr('class','nodes').selectAll('g').data(hierarchy.descendants()).join('g')
    .attr('class','org-graph-node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodes.each(function(d) {
    const node = d3.select(this);
    const data = d.data;
    const colors = nodeColors[data.type] || nodeColors.agent;
    const isAgent = data.type === 'agent';
    const w = isAgent ? 115 : 145;
    const h = isAgent ? 38 : 52;

    node.append('rect').attr('x', -w/2).attr('y', -h/2).attr('width', w).attr('height', h)
      .attr('rx', 6).attr('fill', colors.fill).attr('stroke', colors.stroke).attr('stroke-width', 1);

    if (isAgent) {
      const statusColor = { active:'#10b981', waiting:'#f59e0b', learning:'#3b82f6', review:'#a78bfa', failed:'#ef4444', offline:'#6b7280' }[data.status] || '#6b7280';
      node.append('circle').attr('cx', w/2 - 8).attr('cy', -h/2 + 8).attr('r', 3).attr('fill', statusColor);
      node.append('text').attr('text-anchor','middle').attr('y', 2).attr('fill', colors.text)
        .style('font-size','10px').style('font-weight','600')
        .text(data.name.length > 17 ? data.name.substring(0, 16) + '…' : data.name);
    } else {
      const label = data.type === 'root' ? 'WORLDWIDEBRO' : data.name;
      const sub = data.type === 'root' ? 'AI Organization' : data.type === 'opco' ? 'OPCO' : 'Team';
      node.append('text').attr('text-anchor','middle').attr('y', -10).attr('fill','rgba(156,163,175,.7)')
        .style('font-size','8px').style('font-family','JetBrains Mono, monospace').style('letter-spacing','.1em')
        .text(sub.toUpperCase());
      node.append('text').attr('text-anchor','middle').attr('y', 5).attr('fill', colors.text)
        .style('font-size','12px').style('font-weight','600').text(label);
    }
  });

  nodes.on('click', (e, d) => {
    e.stopPropagation();
    if (d.data.type === 'agent') {
      AgentModal.open(d.data.id);
    } else if (d.data.type === 'opco') {
      Router.navigate(`/opco/${d.data.id}`);
    } else if (d.data.type === 'team') {
      Router.navigate(`/team/${d.data.id}`);
    }
  });
}

window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    if (CommandPalette.open) CommandPalette.closePalette();
    else CommandPalette.openPalette();
  } else if (e.key === '?') {
    ShortcutsModal.open();
  } else {
    CommandPalette.handleKey(e);
  }
});
