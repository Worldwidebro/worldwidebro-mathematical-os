<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Application</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        .section { margin-bottom: 30px; }
        .section h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; }
        .field-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0,102,204,0.1); }
        textarea { resize: vertical; min-height: 100px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .checkbox-item { display: flex; align-items: center; margin-bottom: 8px; }
        input[type="checkbox"] { width: 16px; height: 16px; margin-right: 8px; }
        button { background: #0066cc; color: white; padding: 12px 24px; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: #0052a3; }
        .helper { font-size: 12px; color: #666; margin-top: 4px; }
        .required { color: #d32f2f; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Candidate Application</h1>
        <p class="subtitle">Worldwidebro Staffing</p>

        <form id="candidateForm">
            <div class="section">
                <h2>Personal Information</h2>
                <div class="field-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" name="fullName" required>
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="field-group">
                        <label>Phone <span class="required">*</span></label>
                        <input type="tel" name="phone" required>
                    </div>
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label>City, State</label>
                        <input type="text" name="location" placeholder="Austin, TX">
                    </div>
                    <div class="field-group">
                        <label>LinkedIn</label>
                        <input type="text" name="linkedin" placeholder="https://linkedin.com/in/...">
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Target Role</h2>
                <div class="field-group">
                    <label>Target Role(s) <span class="required">*</span></label>
                    <input type="text" name="targetRoles" placeholder="Senior Backend Engineer, Full-Stack" required>
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label>Years of Experience <span class="required">*</span></label>
                        <select name="yearsExperience" required>
                            <option value="">Select...</option>
                            <option value="0">0 years (New grad)</option>
                            <option value="1">1-2 years</option>
                            <option value="3">3-5 years</option>
                            <option value="6">6-10 years</option>
                            <option value="11">11+ years</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Salary Expectation <span class="required">*</span></label>
                        <input type="text" name="salaryExpectation" placeholder="$60K-$80K" required>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2>Background</h2>
                <div class="field-group">
                    <label>Current/Most Recent Title</label>
                    <input type="text" name="currentTitle" placeholder="Software Engineer">
                </div>
                <div class="field-group">
                    <label>Key Skills <span class="required">*</span></label>
                    <textarea name="skills" placeholder="Python, React, AWS, leadership" required></textarea>
                </div>
                <div class="field-group">
                    <label>Certifications</label>
                    <input type="text" name="certifications" placeholder="AWS Solutions Architect, PMP">
                </div>
                <div class="field-group">
                    <label>Portfolio/GitHub</label>
                    <input type="text" name="portfolio" placeholder="https://github.com/...">
                </div>
            </div>

            <div class="section">
                <h2>Availability & Preferences</h2>
                <div class="field-group">
                    <label>Start Date <span class="required">*</span></label>
                    <select name="availability" required>
                        <option value="">Select...</option>
                        <option value="immediate">Immediately</option>
                        <option value="1week">1 week</option>
                        <option value="2weeks">2 weeks</option>
                        <option value="1month">1 month</option>
                    </select>
                </div>
                <div class="two-col">
                    <div class="field-group">
                        <label>Employment Type <span class="required">*</span></label>
                        <div style="margin-top: 8px;">
                            <div class="checkbox-item">
                                <input type="checkbox" name="empType" value="fulltime">
                                <label>Full-time (W-2)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" name="empType" value="contract">
                                <label>Contract (1099)</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" name="empType" value="either">
                                <label>Either</label>
                            </div>
                        </div>
                    </div>
                    <div class="field-group">
                        <label>Work Location <span class="required">*</span></label>
                        <div style="margin-top: 8px;">
                            <div class="checkbox-item">
                                <input type="checkbox" name="workLoc" value="remote">
                                <label>Remote</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" name="workLoc" value="onsite">
                                <label>On-site</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" name="workLoc" value="hybrid">
                                <label>Hybrid</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="field-group">
                    <label>Relocate if needed?</label>
                    <select name="relocate">
                        <option value="">Select...</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                        <option value="maybe">Maybe</option>
                    </select>
                </div>
            </div>

            <div class="section">
                <h2>Legal & Auth</h2>
                <div class="checkbox-item">
                    <input type="checkbox" name="bg" id="bg" required>
                    <label for="bg">I authorize background check and can legally work in US</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" name="visa" id="visa">
                    <label for="visa">I require visa sponsorship</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" name="agree" id="agree" required>
                    <label for="agree">I agree to Worldwidebro Staffing placement terms</label>
                </div>
            </div>

            <div class="section">
                <button type="submit">Submit Application</button>
            </div>
        </form>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.0/dist/module.mjs';

        const supabase = createClient(
            'https://cyhzilqldouzgynacqpe.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5aHpsamVsbGd2dXJvd2RhbHJnaCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzE5MzAwNjI3LCJleHAiOjE4Nzg0NjY2Mjd9.q2K8J9p8k7m8n9o0p1q2r3s4t5u6v7w8x9y0z1a2b'
        );

        document.getElementById('candidateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            try {
                await supabase.from('venture_applicants').insert({
                    venture_id: 'STA-001',
                    form_type: 'candidate_application',
                    full_name: data.fullName,
                    email: data.email,
                    phone: data.phone,
                    target_roles: data.targetRoles,
                    years_experience: data.yearsExperience,
                    salary_expectation: data.salaryExpectation,
                    skills: data.skills,
                    availability: data.availability,
                    sponsorship_needed: data.visa === 'on',
                    source: 'web_form',
                    created_at: new Date().toISOString()
                });
                alert('✓ Application received! We\'ll review within 24 hours.');
                e.target.reset();
            } catch (err) {
                alert('Error submitting. Try again or email support.');
            }
        });
    </script>
</body>
</html>
