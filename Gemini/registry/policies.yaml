policies:
- id: spending-limits
  name: Capital Allocation Gates
  type: Financial
  description: Automatic agent spending limits (<$5k auto-approved, $5k-$25k department director escalation, >$25k board/human-in-the-loop).
  status: Active
- id: sandbox-execution
  name: Security Sandbox Policy
  type: Tech / Security
  description: Restricts terminal commands to workspace directory and blocks external network requests unless explicit permissions are whitelisted.
  status: Active
- id: ip-assignment
  name: Intellectual Property Assignment
  type: Legal
  description: Ensures all product logic, code, and domains generated by agents are assigned to WinnersCircleWCLLC.
  status: Active
- id: token-spend-budget
  name: Token Usage & Cost Limits
  type: Operations
  description: Monitors Langfuse traces and cuts off agent execution if YTD or campaign budgets are exceeded.
  status: Active
