<script>
/* ============================================================
   HERMES COMMAND CENTER — v2.0 (production-grade)
   Senior-engineer build: hash router, state store, toast system,
   command palette, live event bus, agent wizard, D3 org graph,
   drill-downs, audit log, working approvals, simulation mode,
   dependency graph, cost tracking, decision reasoning traces.

// ============ UTILITIES ============
const $  = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const fmtNum = n => n.toLocaleString();
const nowTime = () => new Date().toTimeString().split(' ')[0];
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// ============ STATE STORE ============
const Store = {
  workspaces: [
    { id: 'iza-prod', name: 'IZA OS', env: 'prod', color: '#a78bfa', initials: 'IZ' },
    { id: 'iza-staging', name: 'IZA OS', env: 'staging', color: '#f59e0b', initials: 'IZ' },
    { id: 'hermes-lab', name: 'Hermes Lab', env: 'dev', color: '#22d3ee', initials: 'HL' },
  ],

const getAgent = id => Store.AGENTS.find(a => a.id === id);
const getTeam  = id => Store.TEAMS.find(t => t.id === id);
const getOpco  = id => Store.OPCOS.find(o => o.id === id);
const statusInfo = key => Store.STATUSES.find(s => s.key === key);

function statusBadge(status) {
  const s = statusInfo(status);
  return `<span class="badge bg-${s.color}"><span class="status-dot" style="background:currentColor"></span>${s.label}</span>`;
}
function priorityBadge(p) {
  const map = { critical:{c:'red',l:'CRITICAL'}, high:{c:'amber',l:'HIGH'}, medium:{c:'blue',l:'MEDIUM'}, low:{c:'gray',l:'LOW'} };
  const m = map[p] || map.low;
  const colors = {
    red:'background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3)',
    amber:'background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.3)',
    blue:'background:rgba(59,130,246,.12);color:#93c5fd;border-color:rgba(59,130,246,.3)',
    gray:'background:rgba(107,114,128,.12);color:#9ca3af;border-color:rgba(107,114,128,.3)',
  };
  return `<span class="badge" style="${colors[m.c]}">${m.l}</span>`;
}
function taskStatusBadge(s) {
  const map = {
    in_progress:{l:'IN PROGRESS',s:'background:rgba(34,211,238,.12);color:#67e8f9;border-color:rgba(34,211,238,.3)'},
    review:{l:'REVIEW',s:'background:rgba(167,139,250,.12);color:#c4b5fd;border-color:rgba(167,139,250,.3)'},
    blocked:{l:'BLOCKED',s:'background:rgba(245,158,11,.12);color:#fcd34d;border-color:rgba(245,158,11,.3)'},
    failed:{l:'FAILED',s:'background:rgba(239,68,68,.12);color:#fca5a5;border-color:rgba(239,68,68,.3)'},
    completed:{l:'COMPLETED',s:'background:rgba(16,185,129,.12);color:#6ee7b7;border-color:rgba(16,185,129,.3)'},
  };
  const m = map[s]; return `<span class="badge" style="${m.s}">${m.l}</span>`;
}
function sparkline(seed, count = 16) {
  let bars = '';
  for (let i = 0; i < count; i++) {
    const h = 20 + ((seed * (i + 3) * 9301 + 49297) % 233280) / 233280 * 80;
    bars += `<div class="sparkline-bar" style="height:${h}%"></div>`;
  }
  return `<div class="sparkline">${bars}</div>`;
}

const Toast = {
  show({ type='info', title, desc, duration=4000, action }) {
    const container = $('#toast-container');
    const icons = { success:'✓', error:'✕', info:'i', warning:'!' };
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.innerHTML = `
      <div class="toast-icon">${icons[type]}</div>
      <div class="toast-body">
        <div class="toast-title">${escapeHtml(title)}</div>
        ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
        ${action ? `<button class="text-[11px] font-semibold mt-1" style="color:var(--cyan)">${escapeHtml(action.label)}</button>` : ''}
      </div>
      <button class="toast-close" aria-label="Close">×</button>
    `;
    el.querySelector('.toast-close').onclick = () => this.dismiss(el);
    if (action) {
      el.querySelector('.toast-body button').onclick = () => {
        action.onClick();
        this.dismiss(el);
      };
    }
    container.appendChild(el);
    if (duration > 0) setTimeout(() => this.dismiss(el), duration);
    return el;
  },
  dismiss(el) {
    if (!el || el.classList.contains('removing')) return;
    el.classList.add('removing');
    setTimeout(() => el.remove(), 200);
  },
  success(t, d, a) { this.show({ type:'success', title:t, desc:d, action:a }); },
  error(t, d, a)   { this.show({ type:'error', title:t, desc:d, action:a }); },
  info(t, d, a)    { this.show({ type:'info', title:t, desc:d, action:a }); },
  warning(t, d, a) { this.show({ type:'warning', title:t, desc:d, action:a }); },
};

// ============ ROUTER ============
const Router = {
  parseHash() {
    const hash = location.hash.replace(/^#/, '') || '/dashboard';
    const parts = hash.split('/').filter(Boolean);
    return { view: parts[0] || 'dashboard', param1: parts[1], param2: parts[2] };
  },
  navigate(route) { location.hash = '#' + route; },
  init() {
    window.addEventListener('hashchange', () => this.render());
    this.render();
  },
  render() {
    const { view, param1, param2 } = this.parseHash();
    Store.route = { view, param1, param2 };

    $$('.nav-item').forEach(el => {
      const r = el.dataset.route;
      const active = r === view || (view === 'opco' && r === 'opcos') || (view === 'team' && r === 'teams');
      el.classList.toggle('active', active);
    });

    this.renderBreadcrumbs(view, param1);

    const container = $('#view-container');
    if (!container) return;
    container.innerHTML = '';
    const renderer = Views[view];
    if (renderer) {
      container.innerHTML = renderer(param1, param2);
      container.scrollTop = 0;
      if (view === 'analytics') setTimeout(initCharts, 50);
      if (view === 'organization') setTimeout(initOrgGraph, 50);
      if (view === 'dependencies') setTimeout(initDepGraph, 50);
    } else {
      container.innerHTML = Views.notFound();
    }

    this.updateCounters();
  },
  renderBreadcrumbs(view, param1) {
    const el = $('#breadcrumbs');
    if (!el) return;
    const crumbs = [{ label:'IZA OS', route:'/dashboard' }];
    const labels = {
      dashboard:'Dashboard', organization:'Organization', opcos:'OPCOs', teams:'Teams',
      agents:'Agents', tasks:'Tasks', decisions:'Decisions', approvals:'Approvals',
      memory:'Memory', workflows:'Workflows', analytics:'Analytics', comms:'Communications',
      audit:'Audit Log', settings:'Settings', dependencies:'Dependencies', bottlenecks:'Bottlenecks',
    };
    if (view === 'opco' && param1) {
      crumbs.push({ label:'OPCOs', route:'/opcos' });
      const opco = getOpco(param1);
      crumbs.push({ label: opco ? opco.name : param1 });
    } else if (view === 'team' && param1) {
      crumbs.push({ label:'Teams', route:'/teams' });
      const team = getTeam(param1);
      crumbs.push({ label: team ? team.name : param1 });
    } else if (labels[view]) {
      crumbs.push({ label: labels[view] });
    }
    el.innerHTML = crumbs.map((c, i) => {
      const isLast = i === crumbs.length - 1;
      const sep = i > 0 ? '<span class="text-[var(--text-3)] mx-1">/</span>' : '';
      if (isLast || !c.route) {
        return `${sep}<span class="${isLast ? 'text-[var(--text-0)] font-medium' : 'text-[var(--text-2)]'}">${escapeHtml(c.label)}</span>`;
      }
      return `${sep}<a href="#${c.route}" class="text-[var(--text-2)] hover:text-[var(--text-0)] transition-colors">${escapeHtml(c.label)}</a>`;
    }).join('');
  },
  updateCounters() {
    const ac = $('#nav-agent-count');
    const tc = $('#nav-task-count');
    const apc = $('#nav-approval-count');
    if (ac) ac.textContent = Store.AGENTS.length;
    if (tc) tc.textContent = fmtNum(Store.TASKS.length);
    if (apc) apc.textContent = Store.APPROVALS.filter(a => Object.values(a.reviews).some(v => v === 'pending')).length;
  }
};

// ============ COMMAND PALETTE ============
const CommandPalette = {
  open: false, query: '', selectedIndex: 0, results: [],
  openPalette() {
    this.open = true; this.query = ''; this.selectedIndex = 0;
    $('#command-palette').innerHTML = this.renderShell();
    $('#command-palette').classList.remove('hidden');
    setTimeout(() => $('#cmd-input')?.focus(), 50);
    this.computeAndRender();
  },
  closePalette() { this.open = false; $('#command-palette').classList.add('hidden'); $('#command-palette').innerHTML = ''; },
  fuzzyMatch(q, text) {
    if (!q) return { match:true, score:0 };
    const ql = q.toLowerCase(), tl = text.toLowerCase();
    if (tl.includes(ql)) return { match:true, score:100 - tl.indexOf(ql) };
    let qi = 0;
    for (let i = 0; i < tl.length && qi < ql.length; i++) if (tl[i] === ql[qi]) qi++;
    if (qi === ql.length) return { match:true, score:50 };
    return { match:false, score:0 };
  },
  computeAndRender() {
    const q = this.query.trim();
    const results = [];
    const navItems = [
      { label:'Go to Dashboard', route:'/dashboard', icon:'⌂', color:'cyan', category:'Navigation' },
      { label:'Go to Organization', route:'/organization', icon:'◉', color:'purple', category:'Navigation' },
      { label:'Go to Agents', route:'/agents', icon:'▣', color:'cyan', category:'Navigation' },
      { label:'Go to Tasks', route:'/tasks', icon:'✓', color:'cyan', category:'Navigation' },
      { label:'Go to Decisions', route:'/decisions', icon:'⚖', color:'amber', category:'Navigation' },
      { label:'Go to Approvals', route:'/approvals', icon:'✎', color:'amber', category:'Navigation' },
      { label:'Go to Analytics', route:'/analytics', icon:'◰', color:'green', category:'Navigation' },
      { label:'Go to Dependencies', route:'/dependencies', icon:'⬡', color:'pink', category:'Navigation' },
      { label:'Create New Agent', action:'create-agent', icon:'+', color:'cyan', category:'Actions' },
      { label:'Toggle Simulation Mode', action:'toggle-sim', icon:'▶', color:'purple', category:'Actions' },
      { label:'Show Keyboard Shortcuts', action:'show-shortcuts', icon:'⌨', color:'amber', category:'Actions' },
    ];
    navItems.forEach(item => {
      const m = this.fuzzyMatch(q, item.label);
      if (m.match) results.push({ ...item, score:m.score, kind:'nav' });
    });
    Store.AGENTS.forEach(a => {
      const m = this.fuzzyMatch(q, a.name);
      if (m.match) results.push({ label:a.name, sub:`${a.role} · ${getOpco(a.opco).name}`, icon:a.name.substring(0,2).toUpperCase(), color:getOpco(a.opco).color, category:'Agents', action:'open-agent', agentId:a.id, score:m.score+10, kind:'agent' });
    });
    if (q.length >= 1) {
      Store.TASKS.forEach(t => {
        const m = this.fuzzyMatch(q, t.title);
        if (m.match) results.push({ label:t.title, sub:`${t.id} · ${getAgent(t.agent)?.name || ''}`, icon:'T', color:'#22d3ee', category:'Tasks', action:'open-agent', agentId:t.agent, score:m.score, kind:'task' });
      });
      Store.DECISIONS.forEach(d => {
        const m = this.fuzzyMatch(q, d.question);
        if (m.match) results.push({ label:d.question, sub:d.id, icon:'D', color:'#a78bfa', category:'Decisions', route:'/decisions', score:m.score, kind:'decision' });
      });
    }
    Store.OPCOS.forEach(o => {
      const m = this.fuzzyMatch(q, o.name);
      if (m.match) results.push({ label:o.name+' OPCO', sub:`${Store.AGENTS.filter(a=>a.opco===o.id).length} agents`, icon:o.icon, color:o.color, category:'OPCOs', route:`/opco/${o.id}`, score:m.score+5, kind:'opco' });
    });
    Store.TEAMS.forEach(t => {
      const m = this.fuzzyMatch(q, t.name);
      if (m.match) results.push({ label:t.name+' Team', sub:getOpco(t.opco).name, icon:'T', color:getOpco(t.opco).color, category:'Teams', route:`/team/${t.id}`, score:m.score+5, kind:'team' });
    });
    results.sort((a,b) => b.score - a.score);
    this.results = results.slice(0, 20);
    this.renderResults();
  },
  renderShell() {
    return `
      <div class="modal-backdrop" style="background:rgba(0,0,0,.5)" onclick="if(event.target===this)CommandPalette.closePalette()">
        <div class="command-palette" onclick="event.stopPropagation()">
          <input id="cmd-input" type="text" placeholder="Type a command or search…" autocomplete="off"/>
          <div class="cmd-results" id="cmd-results"></div>
          <div class="cmd-footer">
            <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
            <span><span class="kbd">↵</span> select</span>
            <span><span class="kbd">esc</span> close</span>
            <span style="margin-left:auto" class="mono text-[10px]">hermes v2.0</span>
          </div>
        </div>
      </div>
    `;
  },
  renderResults() {
    const container = $('#cmd-results');
    if (!container) return;
    const grouped = {};
    this.results.forEach((r, i) => {
      if (!grouped[r.category]) grouped[r.category] = [];
      grouped[r.category].push({ ...r, idx:i });
    });
    if (this.results.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="icon">∅</div><div>No results for "${escapeHtml(this.query)}"</div></div>`;
      return;
    }
    container.innerHTML = Object.entries(grouped).map(([cat, items]) => `
      <div class="cmd-group-label">${cat}</div>
      ${items.map(item => `
        <div class="cmd-item ${item.idx === this.selectedIndex ? 'selected' : ''}" data-idx="${item.idx}">
          <div class="cmd-icon" style="background:${item.color}20;color:${item.color};border:1px solid ${item.color}40">${escapeHtml(item.icon)}</div>
          <div class="flex-1 min-w-0">
            <div class="truncate">${escapeHtml(item.label)}</div>
            ${item.sub ? `<div class="text-[10px] text-[var(--text-3)] truncate">${escapeHtml(item.sub)}</div>` : ''}
          </div>
          ${item.route ? '<span class="cmd-meta">↵</span>' : ''}
        </div>
      `).join('')}
    `).join('');
    $$('.cmd-item', container).forEach(el => {
      el.onclick = () => { this.selectedIndex = parseInt(el.dataset.idx); this.execute(); };
      el.onmouseenter = () => {
        this.selectedIndex = parseInt(el.dataset.idx);
        $$('.cmd-item', container).forEach(e => e.classList.remove('selected'));
        el.classList.add('selected');
      };
    });
  },
  execute() {
    const item = this.results[this.selectedIndex];
    if (!item) return;
    this.closePalette();
    if (item.action === 'create-agent') Wizard.open();
    else if (item.action === 'open-agent') { Router.navigate(item.route || '/agents'); setTimeout(() => AgentModal.open(item.agentId), 100); }
    else if (item.action === 'toggle-sim') Simulation.toggle();
    else if (item.action === 'show-shortcuts') ShortcutsModal.open();
    else if (item.route) Router.navigate(item.route);
  },
  handleKey(e) {
    if (!this.open) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); this.selectedIndex = Math.min(this.selectedIndex+1, this.results.length-1); this.renderResults(); this.scrollSelected(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); this.selectedIndex = Math.max(this.selectedIndex-1, 0); this.renderResults(); this.scrollSelected(); }
    else if (e.key === 'Enter') { e.preventDefault(); this.execute(); }
    else if (e.key === 'Escape') { e.preventDefault(); this.closePalette(); }
  },
  scrollSelected() {
    const sel = $('.cmd-item.selected');
    sel?.scrollIntoView({ block:'nearest' });
  }
};

        <div class="section-title mb-3">Cost Trend (30d)</div>

            <div class="flex gap-3 p-2 rounded bg-[var(--bg-2)] border border-[var(--border)]">

  close() { $('#agent-modal').classList.add('hidden'); $('#agent-modal').innerHTML = ''; },

    const a = getAgent(id); if (!a) return;

    const a = getAgent(id); if (!a) return;

    Store.AGENTS = Store.AGENTS.filter(x => x.id !== id);
    Store.AUDIT_LOG.unshift({ time:nowTime(), actor:'Alex Kowalski', action:'Retired agent', target:id, type:'agent' });
    Toast.warning(`${a.name} retired`, 'Agent has been deactivated and archived', {
      label:'Undo', onClick:() => { Store.AGENTS.push(a); Router.render(); Toast.info('Restored', `${a.name} is back`); }
    });
    this.close();
    Router.render();
  }
};

// ============ AGENT WIZARD ============
const Wizard = {
  step:1, totalSteps:4,
  data:{ name:'', role:'', mission:'', opco:'', team:'', reportsTo:'', capabilities:[], can:[], cannot:[] },
  errors:{},
  open() {
    this.step = 1;
    this.data = { name:'', role:'', mission:'', opco:'', team:'', reportsTo:'', capabilities:[], can:[], cannot:[] };
    this.errors = {};
    this.render();
    $('#wizard-modal').classList.remove('hidden');
  },
  close() { $('#wizard-modal').classList.add('hidden'); $('#wizard-modal').innerHTML = ''; },
  validate() {
    this.errors = {};
    if (this.step === 1) {
      if (!this.data.name.trim()) this.errors.name = 'Name is required';
      else if (Store.AGENTS.some(a => a.name.toLowerCase() === this.data.name.trim().toLowerCase())) this.errors.name = 'Name already exists';
      if (!this.data.role.trim()) this.errors.role = 'Role is required';
      if (!this.data.mission.trim()) this.errors.mission = 'Mission is required';
    } else if (this.step === 2) {
      if (!this.data.opco) this.errors.opco = 'OPCO is required';
      if (!this.data.team) this.errors.team = 'Team is required';
      if (!this.data.reportsTo.trim()) this.errors.reportsTo = 'Manager is required';
    } else if (this.step === 3) {
      if (this.data.capabilities.length === 0) this.errors.capabilities = 'Add at least one capability';
    }
    return Object.keys(this.errors).length === 0;
  },
  next() {
    if (!this.validate()) { this.render(); return; }
    if (this.step < this.totalSteps) { this.step++; this.render(); }
    else this.submit();
  },
  back() { if (this.step > 1) { this.step--; this.render(); } },
  submit() {
    const id = this.data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString(36).slice(-4);
    const newAgent = {
      id, name:this.data.name, role:this.data.role, team:this.data.team, opco:this.data.opco,
      status:'offline', mission:this.data.mission, reportsTo:this.data.reportsTo,
      capabilities:[...this.data.capabilities], cpu:0, mem:0, confidence:0,
      task:'Awaiting activation', progress:0, docs:0, decisions:0,
      can:[...this.data.can], cannot:[...this.data.cannot],
      createdAt:new Date().toISOString().split('T')[0], tokens:0, cost:0,
    };
    Store.AGENTS.push(newAgent);
    Store.AUDIT_LOG.unshift({ time:nowTime(), actor:'Alex Kowalski', action:'Created new agent', target:id, type:'agent' });
    this.close();
    Toast.success('Agent created', `${newAgent.name} is ready for activation`, {
      label:'View →', onClick:() => AgentModal.open(id)
    });
    Router.render();
  },
  render() {
    const modal = $('#wizard-modal');
    modal.classList.remove('hidden');
    modal.innerHTML = `
      <div class="modal-backdrop" onclick="if(event.target===this)Wizard.close()">
        <div class="card w-full max-w-2xl max-h-[90vh] overflow-y-auto m-4">
          <div class="p-6">
            <div class="flex items-start justify-between mb-4">
              <div>
                <h2 class="text-lg font-bold">Create New Agent</h2>
                <p class="text-xs text-[var(--text-3)] mt-1">Step ${this.step} of ${this.totalSteps}</p>
              </div>
              <button onclick="Wizard.close()" class="w-8 h-8 rounded-lg bg-[var(--bg-2)] border border-[var(--border)] hover:border-[var(--border-hi)] flex items-center justify-center" aria-label="Close">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="wizard-progress">
              ${Array.from({length:this.totalSteps}).map((_,i) => {
                const n = i+1;
                const cls = n < this.step ? 'done' : n === this.step ? 'current' : '';
                return `<div class="wizard-progress-bar ${cls}"></div>`;
              }).join('')}
            </div>
            <div class="wizard-step ${this.step === 1 ? 'active' : ''}">
              <div class="section-title mb-4">Basic Information</div>
              <div class="form-field">
                <label>Agent Name *</label>
                <input type="text" id="wiz-name" value="${escapeHtml(this.data.name)}" placeholder="e.g. Pricing Agent"/>
                ${this.errors.name ? `<div class="error">${this.errors.name}</div>` : '<div class="hint">Unique name identifying this agent</div>'}
              </div>
              <div class="form-field">
                <label>Role *</label>
                <input type="text" id="wiz-role" value="${escapeHtml(this.data.role)}" placeholder="e.g. Pricing Analyst"/>
                ${this.errors.role ? `<div class="error">${this.errors.role}</div>` : ''}
              </div>
              <div class="form-field">
                <label>Mission *</label>
                <textarea id="wiz-mission" placeholder="What is this agent's purpose?">${escapeHtml(this.data.mission)}</textarea>
                ${this.errors.mission ? `<div class="error">${this.errors.mission}</div>` : ''}
              </div>
            </div>
            <div class="wizard-step ${this.step === 2 ? 'active' : ''}">
              <div class="section-title mb-4">Organization</div>
              <div class="form-field">
                <label>OPCO *</label>
                <select id="wiz-opco">
                  <option value="">Select OPCO…</option>
                  ${Store.OPCOS.map(o => `<option value="${o.id}" ${this.data.opco===o.id?'selected':''}>${o.name}</option>`).join('')}
                </select>
                ${this.errors.opco ? `<div class="error">${this.errors.opco}</div>` : ''}
              </div>
              <div class="form-field">
                <label>Team *</label>
                <select id="wiz-team">
                  <option value="">Select team…</option>
                  ${Store.TEAMS.filter(t => !this.data.opco || t.opco === this.data.opco).map(t => `<option value="${t.id}" ${this.data.team===t.id?'selected':''}>${t.name}</option>`).join('')}
                </select>
                ${this.errors.team ? `<div class="error">${this.errors.team}</div>` : ''}
              </div>
              <div class="form-field">
                <label>Reports To *</label>
                <input type="text" id="wiz-reports" value="${escapeHtml(this.data.reportsTo)}" placeholder="e.g. Engineering Director"/>
                ${this.errors.reportsTo ? `<div class="error">${this.errors.reportsTo}</div>` : ''}
              </div>
            </div>
            <div class="wizard-step ${this.step === 3 ? 'active' : ''}">
              <div class="section-title mb-4">Capabilities</div>
              <div class="form-field">
                <label>Skills / Tools *</label>
                <div class="tag-input" id="wiz-cap-input">
                  ${this.data.capabilities.map((c,i) => `<span class="tag">${escapeHtml(c)}<button data-idx="${i}" data-field="capabilities" type="button">×</button></span>`).join('')}
                  <input type="text" id="wiz-cap-entry" placeholder="${this.data.capabilities.length ? 'Add more…' : 'Type and press Enter…'}"/>
                </div>
                ${this.errors.capabilities ? `<div class="error">${this.errors.capabilities}</div>` : '<div class="hint">Press Enter or comma to add a skill</div>'}
              </div>
              <div class="text-[11px] text-[var(--text-3)] mb-2">Suggested:</div>
              <div class="flex flex-wrap gap-1.5">
                ${['Python','React','SQL','APIs','Analysis','Writing','Research','Testing','Design'].map(s => {
                  const active = this.data.capabilities.includes(s);
                  return `<button type="button" class="chip ${active?'active':''}" data-suggest="${s}" data-field="capabilities">${s}</button>`;
                }).join('')}
              </div>
            </div>
            <div class="wizard-step ${this.step === 4 ? 'active' : ''}">
              <div class="section-title mb-4">Permissions</div>
              <div class="grid grid-cols-2 gap-4">
                <div class="form-field">
                  <label>Can Do</label>
                  <div class="tag-input">
                    ${this.data.can.map((c,i) => `<span class="tag">${escapeHtml(c)}<button data-idx="${i}" data-field="can" type="button">×</button></span>`).join('')}
                    <input type="text" id="wiz-can-entry" placeholder="Add permission…"/>
                  </div>
                </div>
                <div class="form-field">
                  <label>Cannot Do</label>
                  <div class="tag-input">
                    ${this.data.cannot.map((c,i) => `<span class="tag">${escapeHtml(c)}<button data-idx="${i}" data-field="cannot" type="button">×</button></span>`).join('')}
                    <input type="text" id="wiz-cannot-entry" placeholder="Add restriction…"/>
                  </div>
                </div>
              </div>
              <div class="mt-6 p-4 rounded-lg bg-[var(--bg-2)] border border-[var(--border)]">
                <div class="section-title mb-3">Review</div>
                <div class="space-y-2 text-xs">
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Name</span><span>${escapeHtml(this.data.name || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Role</span><span>${escapeHtml(this.data.role || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">OPCO</span><span>${getOpco(this.data.opco)?.name || '—'}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Team</span><span>${getTeam(this.data.team)?.name || '—'}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Reports To</span><span>${escapeHtml(this.data.reportsTo || '—')}</span></div>
                  <div class="flex justify-between"><span class="text-[var(--text-3)]">Capabilities</span><span>${this.data.capabilities.length}</span></div>
                </div>
              </div>
            </div>
            <div class="flex items-center justify-between pt-4 mt-4 border-t border-[var(--border)]">
              <button class="btn btn-ghost text-xs" onclick="Wizard.back()" ${this.step===1?'disabled':''}>← Back</button>
              <button class="btn btn-primary text-xs" onclick="Wizard.next()">${this.step===this.totalSteps?'Create Agent':'Continue →'}</button>
            </div>
          </div>
        </div>
      </div>
    `;
    const bind = (id, field) => {
      const el = $('#'+id);
      if (el) el.addEventListener('input', e => { this.data[field] = e.target.value; });
    };
    bind('wiz-name','name'); bind('wiz-role','role'); bind('wiz-mission','mission'); bind('wiz-reports','reportsTo');
    const opcoSel = $('#wiz-opco');
    if (opcoSel) opcoSel.addEventListener('change', e => { this.data.opco = e.target.value; this.data.team = ''; this.render(); });
    const teamSel = $('#wiz-team');
    if (teamSel) teamSel.addEventListener('change', e => { this.data.team = e.target.value; });
    this.bindTagInput('wiz-cap-entry','capabilities');
    this.bindTagInput('wiz-can-entry','can');
    this.bindTagInput('wiz-cannot-entry','cannot');
    $$('[data-suggest]').forEach(btn => {
      btn.onclick = () => {
        const field = btn.dataset.field; const val = btn.dataset.suggest;
        if (!this.data[field].includes(val)) this.data[field].push(val);
        this.render();
      };
    });
    $$('[data-field][data-idx]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const field = btn.dataset.field; const idx = parseInt(btn.dataset.idx);
        this.data[field].splice(idx, 1); this.render();
      };
    });
  },
  bindTagInput(inputId, field) {
    const input = $('#'+inputId);
    if (!input) return;
    input.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
        e.preventDefault();
        const val = input.value.replace(/,/g,'').trim();
        if (val && !this.data[field].includes(val)) { this.data[field].push(val); this.render(); }
      } else if (e.key === 'Backspace' && !input.value && this.data[field].length) {
        this.data[field].pop(); this.render();
      }
    });
  }
};

// ============ SIMULATION ============
const Simulation = {
  toggle() {
    Store.simulation.enabled = !Store.simulation.enabled;
    if (Store.simulation.enabled) {
      Toast.success('Simulation mode on', 'Events will flow faster — watch the system come alive');
      EventBus.accelerate();
    } else {
      Toast.info('Simulation mode off', 'Returned to normal event cadence');
      EventBus.decelerate();
    }
    renderSimBanner();
  }
};

function renderSimBanner() {
  let banner = $('#sim-banner');
  if (Store.simulation.enabled) {
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'sim-banner';
      banner.className = 'sim-banner';
      $('#app-root').parentNode.insertBefore(banner, $('#app-root'));
    }
    banner.innerHTML = `
      <span class="live-indicator" style="color:#f5d0fe">SIMULATION</span>
      <span>Accelerated event stream active · agents are operating in fast-forward</span>
      <button class="btn btn-ghost text-xs ml-auto" style="padding:3px 10px;font-size:11px" onclick="Simulation.toggle()">Disable</button>
    `;
  } else if (banner) {
    banner.remove();
  }
}

// ============ EVENT BUS ============
const EventBus = {
  intervalId: null,
  templates: [
    { type:'task.completed', text:'Completed task {task}', color:'green' },
    { type:'agent.started', text:'Started working on {task}', color:'cyan' },
    { type:'memory.updated', text:'Indexed {n} new documents', color:'blue' },
    { type:'decision.created', text:'Opened new decision thread', color:'purple' },
    { type:'metric.updated', text:'Confidence updated to {n}%', color:'cyan' },
  ],
  start() { this.intervalId = setInterval(() => this.tick(), 7000); },
  stop() { if (this.intervalId) clearInterval(this.intervalId); },
  accelerate() { this.stop(); this.intervalId = setInterval(() => this.tick(), 1800); },
  decelerate() { this.stop(); this.intervalId = setInterval(() => this.tick(), 7000); },
  tick() {
    const activeAgents = Store.AGENTS.filter(a => a.status === 'active');
    if (activeAgents.length === 0) return;
    const agent = activeAgents[Math.floor(Math.random() * activeAgents.length)];
    const tmpl = this.templates[Math.floor(Math.random() * this.templates.length)];
    const n = 3 + Math.floor(Math.random() * 40);
    const text = tmpl.text.replace('{task}', agent.task).replace('{n}', n);
    Store.EVENTS.unshift({ time:'now', type:tmpl.type, agent:agent.name, agentId:agent.id, text, color:tmpl.color });
    if (Store.EVENTS.length > 30) Store.EVENTS.pop();
    Store.EVENTS.forEach((e, i) => { if (i > 0 && e.time === 'now') e.time = 'just now'; });
    agent.cpu = clamp(agent.cpu + (Math.random() * 10 - 5), 5, 95);
    agent.confidence = clamp(agent.confidence + (Math.random() * 4 - 2), 60, 99);
    agent.tokens += Math.floor(Math.random() * 800 + 200);
    agent.cost += (Math.random() * 0.02 + 0.005);
    if (Store.route.view === 'dashboard') {
      const stream = $('#event-stream');
      if (stream) stream.innerHTML = this.renderEvents();
      const kpi = $('#kpi-agents');
      if (kpi) kpi.textContent = Store.AGENTS.filter(a => a.status === 'active').length;
    }
  },
  renderEvents() {
    return Store.EVENTS.slice(0, 10).map(e => `
      <div class="flex gap-3 py-2 hover-row rounded px-1 -mx-1">
        <div class="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style="background:var(--${e.color})"></div>

// ============ EXPORTER ============
const Exporter = {
  download(filename, content, mime = 'text/csv') {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  dashboard() {
    const rows = [['Metric','Value']];
    rows.push(['Active Agents', Store.AGENTS.filter(a => a.status === 'active').length]);
    rows.push(['Total Agents', Store.AGENTS.length]);
    rows.push(['Running Tasks', Store.TASKS.filter(t => t.status === 'in_progress').length]);
    rows.push(['Pending Decisions', Store.DECISIONS.filter(d => d.status === 'pending').length]);
    rows.push(['Total Cost (30d)', '$' + Store.AGENTS.reduce((s,a) => s + a.cost, 0).toFixed(2)]);
    this.download('hermes-dashboard.csv', rows.map(r => r.join(',')).join('\n'));
    Toast.success('Exported', 'Dashboard data downloaded as CSV');
  },
  decisions() {
    const rows = [['ID','Question','Framework','Confidence','Status','Recommendation']];
    Store.DECISIONS.forEach(d => rows.push([d.id, d.question, d.framework, d.confidence, d.status, d.recommendation]));
    this.download('hermes-decisions.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'));
    Toast.success('Exported', 'Decisions downloaded as CSV');
  },
  analytics() {
    const rows = [['Agent','Tokens (30d)','Cost (30d)','Confidence','Status']];
    Store.AGENTS.forEach(a => rows.push([a.name, a.tokens, a.cost.toFixed(2), a.confidence, a.status]));
    this.download('hermes-analytics.csv', rows.map(r => r.join(',')).join('\n'));
    Toast.success('Exported', 'Analytics downloaded as CSV');
  },
  audit() {
    const rows = [['Time','Actor','Action','Target','Type']];
    Store.AUDIT_LOG.forEach(l => rows.push([l.time, l.actor, l.action, l.target, l.type]));
    this.download('hermes-audit.csv', rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'));
    Toast.success('Exported', 'Audit log downloaded');
  },
  org() {
    const svg = document.querySelector('#org-graph svg');
    if (!svg) { Toast.error('No graph', 'Render the organization view first'); return; }
    const source = new XMLSerializer().serializeToString(svg);
    this.download('hermes-organization.svg', source, 'image/svg+xml');
    Toast.success('Exported', 'Organization graph downloaded as SVG');
  }
};

  bottlenecks() {
    // Compute bottleneck score: agents with many dependents + high cpu + low progress
    const scores = Store.AGENTS.map(a => {
      const dependents = Object.entries(Store.DEPENDENCIES).filter(([_, deps]) => deps.includes(a.id)).length;
      const deps = (Store.DEPENDENCIES[a.id] || []).length;
      const queue = Store.TASKS.filter(t => t.agent === a.id).length;
      const score = (dependents * 10) + (a.cpu * 0.3) + (queue * 5) + (100 - a.progress) * 0.2;
      return { agent: a, score, dependents, queue };
    }).sort((a,b) => b.score - a.score);

    return `
    <div class="view p-6 space-y-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight mb-1">Bottleneck Analysis</h1>
        <p class="text-sm text-[var(--text-2)]">Agents ranked by constraint impact · higher score = more critical bottleneck</p>
      </div>
      <div class="grid grid-cols-4 gap-4">
        <div class="card p-4"><div class="section-title mb-2">Critical</div><div class="metric-value text-red-400">${scores.filter(s => s.score > 80).length}</div></div>
        <div class="card p-4"><div class="section-title mb-2">Warning</div><div class="metric-value text-amber-400">${scores.filter(s => s.score > 40 && s.score <= 80).length}</div></div>
        <div class="card p-4"><div class="section-title mb-2">Healthy</div><div class="metric-value text-green-400">${scores.filter(s => s.score <= 40).length}</div></div>
        <div class="card p-4"><div class="section-title mb-2">Avg Score</div><div class="metric-value text-cyan-400">${Math.round(scores.reduce((s,x) => s+x.score, 0) / scores.length)}</div></div>
      </div>
      <div class="card">
        <div class="p-4 border-b border-[var(--border)] flex items-center justify-between">
          <div class="section-title">Bottleneck Ranking</div>
          <div class="text-[11px] text-[var(--text-3)]">Score = dependents × 10 + CPU × 0.3 + queue × 5 + (100 - progress) × 0.2</div>
        </div>
        <div class="divide-y divide-[var(--border)]">
          ${scores.map((s, i) => {
            const a = s.agent;
            const op = getOpco(a.opco);
            const severity = s.score > 80 ? 'red' : s.score > 40 ? 'amber' : 'green';
            return `
              <div class="p-4 hover:bg-white/5 cursor-pointer transition-colors" onclick="AgentModal.open('${a.id}')">
                <div class="flex items-center gap-4">
                  <div class="w-8 text-center">
                    <div class="text-xs mono text-[var(--text-3)]">#${i+1}</div>
                  </div>
                  <div class="w-9 h-9 rounded-lg flex items-center justify-center text-xs font-bold mono" style="background:${op.color}20;color:${op.color};border:1px solid ${op.color}40">${a.name.substring(0,2).toUpperCase()}</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-1">
                      <div class="text-sm font-semibold">${escapeHtml(a.name)}</div>
                      ${statusBadge(a.status)}
                    </div>
                    <div class="text-[11px] text-[var(--text-3)]">${escapeHtml(a.task)}</div>
                  </div>
                  <div class="flex items-center gap-6">
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">CPU</div>
                      <div class="text-xs mono">${Math.round(a.cpu)}%</div>
                    </div>
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">QUEUE</div>
                      <div class="text-xs mono">${s.queue}</div>
                    </div>
                    <div class="text-center">
                      <div class="text-[10px] mono text-[var(--text-3)]">DEPENDENTS</div>
                      <div class="text-xs mono">${s.dependents}</div>
                    </div>
                    <div class="w-32">
                      <div class="flex items-center justify-between mb-1">
                        <div class="text-[10px] mono text-[var(--text-3)]">SCORE</div>

          }).join('')}
        </div>
      </div>
    </div>`;

// ============ APPROVALS ACTIONS ============
const Approvals = {
  act(id, action) {
    const a = Store.APPROVALS.find(x => x.id === id);
    if (!a) return;
    if (action === 'approve') {
      Object.keys(a.reviews).forEach(k => a.reviews[k] = 'approved');
      Toast.success('Approved', `${a.agent} has been fully approved`);
      Store.AUDIT_LOG.unshift({ time:nowTime(), actor:'Alex Kowalski', action:'Approved agent request', target:id, type:'approval' });
    } else if (action === 'reject') {
      if (!confirm(`Reject ${a.agent}?`)) return;
      Object.keys(a.reviews).forEach(k => a.reviews[k] = 'rejected');
      Toast.error('Rejected', `${a.agent} request rejected`);
      Store.AUDIT_LOG.unshift({ time:nowTime(), actor:'Alex Kowalski', action:'Rejected agent request', target:id, type:'approval' });
    } else if (action === 'changes') {
      const pending = Object.keys(a.reviews).find(k => a.reviews[k] === 'pending');
      if (pending) a.reviews[pending] = 'rejected';
      Toast.warning('Changes requested', `${a.agent} sent back for revision`);
    }
    Router.render();
  }
};

// ============ D3 ORG GRAPH ============
function initOrgGraph() {
  const container = document.getElementById('org-graph');
  if (!container) return;
  container.innerHTML = '';
  const width = container.clientWidth;
  const height = 640;

  const root = {
    name:'Hermes', type:'root',
    children: Store.OPCOS.map(o => ({
      ...o, type:'opco',
      children: Store.TEAMS.filter(t => t.opco === o.id).map(t => ({
        ...t, type:'team',
        children: Store.AGENTS.filter(a => a.team === t.id).map(a => ({ ...a, type:'agent' }))
      }))
    }))
  };

  const hierarchy = d3.hierarchy(root);
  const treeLayout = d3.tree().nodeSize([44, 120]);
  treeLayout(hierarchy);

  let xMin = Infinity, xMax = -Infinity, yMin = Infinity, yMax = -Infinity;
  hierarchy.each(d => {
    xMin = Math.min(xMin, d.x); xMax = Math.max(xMax, d.x);
    yMin = Math.min(yMin, d.y); yMax = Math.max(yMax, d.y);
  });

  const svg = d3.select(container).append('svg')
    .attr('width', width).attr('height', height)
    .attr('viewBox', `${xMin - 90} ${yMin - 50} ${xMax - xMin + 180} ${yMax - yMin + 100}`);

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.3, 2.5])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
      const el = document.getElementById('zoom-level');
      if (el) el.textContent = `Zoom: ${Math.round(event.transform.k * 100)}%`;
    });
  svg.call(zoom);

  g.append('g').attr('class','links').selectAll('path').data(hierarchy.links()).join('path')
    .attr('class','org-graph-link')
    .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

  const nodeColors = {
    root:{ fill:'rgba(34,211,238,.15)', stroke:'rgba(34,211,238,.5)', text:'#22d3ee' },
    opco:{ fill:'rgba(167,139,250,.12)', stroke:'rgba(167,139,250,.4)', text:'#a78bfa' },
    team:{ fill:'rgba(16,185,129,.12)', stroke:'rgba(16,185,129,.4)', text:'#10b981' },
    agent:{ fill:'rgba(255,255,255,.03)', stroke:'rgba(55,65,81,.8)', text:'#d1d5db' },
  };

  const nodes = g.append('g').attr('class','nodes').selectAll('g').data(hierarchy.descendants()).join('g')
    .attr('class','org-graph-node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodes.each(function(d) {
    const node = d3.select(this);
    const data = d.data;
    const colors = nodeColors[data.type];
    const isAgent = data.type === 'agent';
    const w = isAgent ? 115 : 145;
    const h = isAgent ? 38 : 52;

    node.append('rect').attr('x', -w/2).attr('y', -h/2).attr('width', w).attr('height', h)
      .attr('rx', 6).attr('fill', colors.fill).attr('stroke', colors.stroke).attr('stroke-width', 1);

    if (isAgent) {
      const statusColor = { active:'#10b981', waiting:'#f59e0b', learning:'#3b82f6', review:'#a78bfa', failed:'#ef4444', offline:'#6b7280' }[data.status] || '#6b7280';
      node.append('circle').attr('cx', w/2 - 8).attr('cy', -h/2 + 8).attr('r', 3).attr('fill', statusColor);
      node.append('text').attr('text-anchor','middle').attr('y', 2).attr('fill', colors.text)
        .style('font-size','10px').style('font-weight','600')
        .text(data.name.length > 17 ? data.name.substring(0, 16) + '…' : data.name);
    } else {
      const label = data.type === 'root' ? 'HERMES' : data.name;
      const sub = data.type === 'root' ? 'AI Organization' : data.type === 'opco' ? 'OPCO' : 'Team';
      const count = data.type === 'root' ? Store.AGENTS.length :
                    data.type === 'opco' ? Store.AGENTS.filter(a => a.opco === data.id).length :
                    Store.AGENTS.filter(a => a.team === data.id).length;
      node.append('text').attr('text-anchor','middle').attr('y', -10).attr('fill','rgba(156,163,175,.7)')
        .style('font-size','8px').style('font-family','JetBrains Mono, monospace').style('letter-spacing','.1em')
        .text(sub.toUpperCase());
      node.append('text').attr('text-anchor','middle').attr('y', 5).attr('fill', colors.text)
        .style('font-size','12px').style('font-weight','600').text(label);
      node.append('text').attr('text-anchor','middle').attr('y', 19).attr('fill','rgba(156,163,175,.7)')
        -weight','500').text(count + ' agents');
    }
  });

  nodes.on('click', (event, d) => {
    event.stopPropagation();
    if (d.data.type === 'agent') {
      AgentModal.open(d.data.id);
    } else if (d.data.type === 'opco') {
      Router.navigate(`/opco/${d.data.id}`);
    } else if (d.data.type === 'team') {
      Router.navigate(`/team/${d.data.id}`);
    }
  });

  simulation.on('tick', () => {
    links
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    nodes.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function initDepGraph() {
  const container = document.getElementById('dep-graph');
  if (!container) return;
  container.innerHTML = '';
  const width = container.clientWidth;
  const height = 640;

  const nodesData = Store.AGENTS.map(a => ({ ...a }));
  const linksData = [];
  Object.entries(Store.DEPENDENCIES).forEach(([sourceId, targetIds]) => {
    targetIds.forEach(targetId => {
      if (Store.AGENTS.some(a => a.id === sourceId) && Store.AGENTS.some(a => a.id === targetId)) {
        linksData.push({ source: sourceId, target: targetId });
      }
    });
  });

  const svg = d3.select(container).append('svg')
    .attr('width', width).attr('height', height);

  const g = svg.append('g');

  const zoom = d3.zoom().scaleExtent([0.3, 2.5])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
      const el = document.getElementById('dep-zoom-level');
      if (el) el.textContent = `Zoom: ${Math.round(event.transform.k * 100)}%`;
    });
  svg.call(zoom);

  const simulation = d3.forceSimulation(nodesData)
    .force('link', d3.forceLink(linksData).id(d => d.id).distance(120))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(25));

  const links = g.append('g').attr('class','links').selectAll('line')
    .data(linksData).join('line')
    .attr('stroke', 'var(--border-hi)')
    .attr('stroke-width', 1.5)
    .attr('marker-end', 'url(#arrow)');

  svg.append('defs').append('marker')
    .attr('id', 'arrow')
    .attr('viewBox', '0 -5 10 10')
    .attr('refX', 20)
    .attr('refY', 0)
    .attr('markerWidth', 6)
    .attr('markerHeight', 6)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M0,-5L10,0L0,5')
    .attr('fill', 'var(--border-hi)');

  const nodes = g.append('g').attr('class','nodes').selectAll('g')
    .data(nodesData).join('g')
    .attr('class', 'org-graph-node')
    .on('click', (event, d) => {
      event.stopPropagation();
      AgentModal.open(d.id);
    })
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  nodes.append('circle')
    .attr('r', 10)
    .attr('fill', d => getOpco(d.opco)?.color || 'var(--text-3)')
    .attr('stroke', 'var(--bg-1)')
    .attr('stroke-width', 1.5);

  nodes.append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '1.8em')
    .attr('fill', 'var(--text-1)')
    .style('font-size', '9px')
    .text(d => d.name);

  simulation.on('tick', () => {
    links
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
    nodes.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function initCharts() {
  const activityCtx = document.getElementById('chart-activity');

      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Tasks Completed',
          data: [120, 150, 180, 140, 210, 90, 100],
          borderColor: '#22d3ee',
          tension: 0.3,
          fill: false

      options: { responsive: true, maintainAspectRatio: false }

  const statusCtx = document.getElementById('chart-status');
  if (statusCtx) {
    new Chart(statusCtx, {
      type: 'doughnut',
      data: {
        labels: ['Active', 'Waiting', 'Learning', 'Review', 'Failed', 'Offline'],
        datasets: [{
          data: [
            Store.AGENTS.filter(a => a.status === 'active').length,
            Store.AGENTS.filter(a => a.status === 'waiting').length,
            Store.AGENTS.filter(a => a.status === 'learning').length,

            Store.AGENTS.filter(a => a.status === 'failed').length,
            Store.AGENTS.filter(a => a.status === 'offline').length

          backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#a78bfa', '#ef4444', '#6b7280']
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  const costCtx = document.getElementById('chart-cost');
  if (costCtx) {
    const costByOpco = {};
    Store.AGENTS.forEach(a => {
      costByOpco[a.opco] = (costByOpco[a.opco] || 0) + a.cost;
    });
    new Chart(costCtx, {
      type: 'bar',
      data: {
        labels: Object.keys(costByOpco).map(id => getOpco(id)?.name || id),
        datasets: [{
          label: 'Cost ($)',
          data: Object.values(costByOpco),
          backgroundColor: Object.keys(costByOpco).map(id => getOpco(id)?.color || '#22d3ee')
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }

  const confCtx = document.getElementById('chart-conf');
  if (confCtx) {
    new Chart(confCtx, {
      type: 'line',
      data: {
        labels: ['12am', '4am', '8am', '12pm', '4pm', '8pm'],
        datasets: [{
          label: 'Average Confidence (%)',
          data: [84, 86, 89, 87, 90, 89],
          borderColor: '#10b981',
          tension: 0.3,
          fill: false
        }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
}

window.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    if (CommandPalette.open) CommandPalette.closePalette();
    else CommandPalette.openPalette();
  }
  if (e.key === '?') {
    e.preventDefault();
    ShortcutsModal.open();
  }
  CommandPalette.handleKey(e);
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'cmd-input') {
    CommandPalette.query = e.target.value;
    CommandPalette.computeAndRender();
  }
});

function initApp() {
  renderShell();
  Router.init();
  EventBus.start();
  renderSimBanner();
  
  const savedTheme = localStorage.getItem('hermes_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
}

document.addEventListener('DOMContentLoaded', initApp);
