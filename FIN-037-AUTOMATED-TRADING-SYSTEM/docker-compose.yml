version: '3.8'

services:
  # ========== PERSISTENT DATA LAYER ==========

  # Qdrant: Vector DB for trade pattern embeddings (persistent)
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: fin037_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      - QDRANT_STORAGE_SNAPSHOT_ENABLED=true
      - QDRANT_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - fin037

  # ========== EPHEMERAL LAYER ==========

  # Redis: Real-time cache + position state (ephemeral, OK to lose)
  redis:
    image: redis:7-alpine
    container_name: fin037_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - fin037

  # ========== EXECUTION LAYER ==========

  # Crucix: Order execution + position management
  crucix:
    image: crucix:latest
    container_name: fin037_crucix
    build:
      context: ./docker/crucix
      dockerfile: Dockerfile
    ports:
      - "3117:3117"
    environment:
      # Broker APIs
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}

      # Infrastructure
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}

      # Risk management
      - MAX_DAILY_LOSS_PCT=${MAX_DAILY_LOSS_PCT:-5}
      - MAX_PER_TRADE_RISK_PCT=${MAX_PER_TRADE_RISK_PCT:-2}
      - MAX_POSITION_SIZE_PCT=${MAX_POSITION_SIZE_PCT:-10}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3117/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - fin037

  # MiroFish: Position monitoring UI + real-time alerts
  mirofish:
    image: mirofish:latest
    container_name: fin037_mirofish
    build:
      context: ./docker/mirofish
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5001:5001"
    environment:
      - CRUCIX_URL=http://crucix:3117
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - LANG=en_US.UTF-8  # Fix: Force English UI (was hardcoded Chinese)
    depends_on:
      crucix:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fin037

  # ========== OBSERVABILITY LAYER ==========

  # Prometheus: Metrics collection (scrapes Crucix + MiroFish)
  prometheus:
    image: prom/prometheus:latest
    container_name: fin037_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - fin037

  # Grafana: Dashboards (P&L, risk, Sharpe ratio)
  grafana:
    image: grafana/grafana:latest
    container_name: fin037_grafana
    ports:
      - "3001:3000"  # Map to 3001 to avoid conflict with MiroFish
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ventures2026}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - fin037

networks:
  fin037:
    driver: bridge
