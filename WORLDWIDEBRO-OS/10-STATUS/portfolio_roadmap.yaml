# IZA OS 10-Point Architectural Roadmap
# Tracks status and assets of the core Venture Studio Operating System modules.

roadmap:
  - module: "01-SECTOR-MAP"
    status: "completed"
    description: "Sector taxonomy, sub-vertical configurations, and required capabilities mapping."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/registries/sector_registry.yaml"
      - "WORLDWIDEBRO-OS/08-DATA/registries/sector_subverticals.yaml"

  - module: "02-CAPABILITY-GRAPH"
    status: "completed"
    description: "Neo4j capability-to-repository maps linking owned and starred codebases to abstract skills."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/registries/capability_registry.yaml"
      - "local Neo4j IMPLEMENTS edges"

  - module: "03-VENTURE-FACTORY"
    status: "completed"
    description: "Automated CLI venture spawner resolving capabilities and generating folder templates."
    milestone_assets:
      - "WORLDWIDEBRO-OS/05-AGENTS/create_venture.py"
      - "venture.json template schemas"

  - module: "04-AGENT-FACTORY"
    status: "completed"
    description: "Agent configuration engine spawning custom profiles, reasoning models, and authority limits."
    milestone_assets:
      - "WORLDWIDEBRO-OS/05-AGENTS/agent_registry.yaml"
      - "WORLDWIDEBRO-OS/05-AGENTS/agent_factory.py"

  - module: "05-LEAD-ENGINE"
    status: "completed"
    description: "Scraper registry, data sources mapping, and verification pipelines linked to Twenty CRM."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/registries/lead_intelligence/sector_sources.yaml"
      - "WORLDWIDEBRO-OS/08-DATA/registries/lead_intelligence/scraper_registry.yaml"
      - "WORLDWIDEBRO-OS/08-DATA/registries/lead_intelligence/enrichment_pipeline.yaml"

  - module: "06-DOCUMENT-INTELLIGENCE"
    status: "in_progress"
    description: "Self-hosted PDF processing, text extraction, and Syncthing peer-to-peer file synchronization."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/registries/agent_tools_registry.yaml (syncthing/stirling-pdf entries)"

  - module: "07-METRICS-ENGINE"
    status: "completed"
    description: "100-metric portfolio success scorecard and North Star KPI definitions."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/registries/portfolio_metrics_scorecard.yaml"

  - module: "08-KNOWLEDGE-GRAPH"
    status: "completed"
    description: "Neo4j schema constraints and node labels representing the expanded IZA OS ontology."
    milestone_assets:
      - "WORLDWIDEBRO-OS/08-DATA/knowledge_graph/neo4j_schema.cypher"

  - module: "09-REPOSITORY-MAPPING"
    status: "completed"
    description: "Comprehensive catalog parsing and enriching 700+ owned and starred codebases in the API server."
    milestone_assets:
      - "repos-index.json"
      - "Gemini/server.py handle_get_repositories integration"

  - module: "10-AUTONOMOUS-OPERATIONS"
    status: "planned"
    description: "Continuous LangGraph execution loops and n8n workflow listeners operating ventures autonomously."
    milestone_assets:
      - "n8n server endpoints"
      - "langfuse tracing gateways"
