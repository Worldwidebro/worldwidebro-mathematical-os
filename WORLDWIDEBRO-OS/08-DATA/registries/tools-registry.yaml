# REPOSITORY INTELLIGENCE LAYER

tools:
  - tool_id: AIBOS-REPO-001
    name: Repomix
    category: repository_intelligence
    purpose: AI context packaging, repository compression, LLM-ready context
    status: available

    github: https://github.com/yamadashy/repomix
    install:
      type: npm
      command: npm install -g repomix

    health_check:
      command: repomix --version
      expected: "Repomix version"
      type: cli

    used_by:
      - coding-agent
      - repository-analyzer
      - venture-factory

    integration:
      output_format: xml
      destination: repomix-output.xml
      frequency: on-demand

  - tool_id: AIBOS-REPO-002
    name: SocratiCode
    category: repository_intelligence
    purpose: Codebase indexing, dependency intelligence, hybrid search, code graph
    status: partial

    github: https://github.com/giancarloerra/socraticode
    install:
      type: docker-compose
      command: docker-compose up -d socraticode

    health_check:
      command: docker ps | grep socraticode
      expected: socraticode running
      type: container

    used_by:
      - socraticode-mcp
      - codebase-explorer

    integration:
      port: 8000
      api_type: rest
      requires:
        - qdrant
        - ollama

  - tool_id: AIBOS-REPO-003
    name: Serena
    category: repository_intelligence
    purpose: Semantic code understanding, symbol-level navigation, MCP coding intelligence
    status: available

    github: https://github.com/oraios/serena
    install:
      type: git_clone
      command: git clone https://github.com/oraios/serena

    health_check:
      command: serena --help
      expected: "Serena help message"
      type: cli

    used_by:
      - code-navigator
      - symbol-resolver

    integration:
      mcp_capable: true
      output: symbol_index

  - tool_id: AIBOS-REPO-004
    name: GitNexus
    category: repository_intelligence
    purpose: Repository visualization, dependency graphs, code relationships
    status: available

    github: https://github.com/jondot/gitnexus
    install:
      type: npm
      command: npm install -g gitnexus

    health_check:
      command: gitnexus --version
      expected: "GitNexus version"
      type: cli

    used_by:
      - dependency-visualizer
      - repository-mapper

    integration:
      output_format: json
      graph_output: graphml

  - tool_id: AIBOS-REPO-005
    name: Graphify
    category: repository_intelligence
    purpose: Repository graph generation, code relationship mapping
    status: unknown

    github: https://github.com/search?q=graphify+repository+graph
    install:
      type: npm
      command: npm install -g graphify

    health_check:
      command: graphify --version
      expected: "Graphify version"
      type: cli

    used_by:
      - graph-generator
      - dependency-mapper

    integration:
      output_format: json
      graph_output: nodes_and_edges

