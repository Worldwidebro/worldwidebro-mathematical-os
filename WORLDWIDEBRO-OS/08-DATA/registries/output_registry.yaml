# IZA OS Output Registry
# Maps venture types to standardized deliverables generated by the Output Layer.

outputs:
  - name: website_prototype
    category: frontend
    template: "index.html"
    builder: "Open Design System"
    exports:
      - html
      - zip

  - name: financial_report
    category: documents
    template: "financial_model.xlsx"
    builder: "ReportLab PDF Engine"
    exports:
      - pdf
      - xlsx

  - name: marketing_sizzle
    category: media
    template: "hyperframes-promo.json"
    builder: "HeyGen HyperFrames + FFmpeg"
    exports:
      - mp4

  - name: operational_database
    category: database
    template: "schema.sql"
    builder: "PostgreSQL / SQLite Builder"
    exports:
      - sql
      - db
