# IZA OS Lead Scraper Registry
# Maps scraper repositories to automated extraction targets and capabilities.

scrapers:
  - name: crawlee
    repository: "https://github.com/apify/crawlee"
    language: "TypeScript"
    capabilities:
      - "recursive-web-crawling"
      - "headless-browser-rendering"
      - "contact-info-extraction"
    outputs:
      - "JSON page extract"
      - "emails_found"
      - "phones_found"

  - name: scrapy
    repository: "https://github.com/scrapy/scrapy"
    language: "Python"
    capabilities:
      - "xpath-css-data-extraction"
      - "batch-url-spidering"
    outputs:
      - "CSV dataset"
      - "lead_matrix.json"

  - name: playwright
    repository: "https://github.com/microsoft/playwright"
    language: "JavaScript/Python"
    capabilities:
      - "dynamic-dom-interaction"
      - "session-cookie-handling"
      - "user-flow-automation"
    outputs:
      - "screen_captures"
      - "profile_data"

  - name: theharvester
    repository: "https://github.com/laramies/theHarvester"
    language: "Python"
    capabilities:
      - "osint-domain-harvesting"
      - "public-email-discovery"
    outputs:
      - "domain_emails.txt"

  - name: holehe
    repository: "https://github.com/megadose/holehe"
    language: "Python"
    capabilities:
      - "email-footprint-verification"
      - "social-account-lookup"
    outputs:
      - "registered_services_list"
