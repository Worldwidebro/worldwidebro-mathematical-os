# IZA OS Exo & Database Routing Map
# Defines Tailscale network routing, storage mounts, and RAG database collections.

topology:
  macbook_air:
    ip: "localhost"
    role: "development_console"
    local_ports:
      fcc_router: 8082
      gemini_server: 8000
      mcp_gateway: 8001

  mac_studio:
    ip: "100.87.214.70"
    role: "centralized_brain"
    tailscale_ports:
      ollama: 11434
      qdrant: 6333
      neo4j_http: 7474
      neo4j_bolt: 7687
      postgres: 5432
      redis: 6379
      twenty_crm: 3004
      n8n: 5678
      langfuse: 3003

storage_mounts:
  mac_studio:
    fast_drive_2tb:
      mount_path: "/Volumes/LaCie/fast"
      contents:
        - name: "ollama_models"
          path: "/Volumes/LaCie/ollama/models"
        - name: "qdrant_storage"
          path: "/AI/vector"
        - name: "neo4j_storage"
          path: "/AI/graph"
        - name: "postgres_storage"
          path: "/AI/database"

    archive_drive_4tb:
      mount_path: "/Volumes/LaCie/archive"
      contents:
        - name: "datasets"
          path: "/archive/datasets"
        - name: "repositories_archive"
          path: "/archive/repos"
        - name: "system_backups"
          path: "/archive/backups"
        - name: "system_logs"
          path: "/archive/logs"

databases:
  qdrant:
    endpoint: "http://100.87.214.70:6333"
    collections:
      - name: "repositories"
        vector_size: 768
        distance: "Cosine"
        description: "Semantic representation of the 1,597 owned and starred repositories."
      - name: "notes"
        vector_size: 768
        distance: "Cosine"
        description: "Obsidian Second Brain markdown strategic planning files."

  neo4j:
    endpoint: "bolt://100.87.214.70:7687"
    auth:
      user: "neo4j"
      password_env: "NEO4J_PASSWORD" # ventures2026
    ontology:
      - "Venture -[BELONGS_TO]-> OPCO -[BELONGS_TO]-> Entity -[BELONGS_TO]-> Holding"
      - "Repo -[IMPLEMENTS]-> Capability"

  redis:
    endpoint: "redis://100.87.214.70:6379"
    use_cases:
      - "agent_session_memory"
      - "task_event_queues"

  postgres:
    endpoint: "postgresql://100.87.214.70:5432"
    databases:
      - name: "iza_os_ventures"
      - name: "twenty"
      - name: "langfuse"
