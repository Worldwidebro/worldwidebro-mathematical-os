# IZA OS Sector Sub-Verticals & Business Models
# Classifies specific productized business units and layouts for venture spawning.

sectors:
  - name: ecommerce
    subverticals:
      - name: storefront_saas
        label: "AI Storefront Builder"
        monetization: "Subscription SaaS / Transaction fees"
        required_capabilities: ["storefront", "payments", "authentication"]
        default_price_tier: "$49/mo"

      - name: product_intelligence
        label: "Product Research & Competitor Tracker"
        monetization: "Monthly platform access"
        required_capabilities: ["search", "analytics", "dashboard"]
        default_price_tier: "$29/mo"

      - name: inventory_forecasting
        label: "AI Stock Ingestion & Demand Forecasting"
        monetization: "Usage-based billing"
        required_capabilities: ["inventory", "analytics", "scheduling"]
        default_price_tier: "$99/mo"

  - name: construction
    subverticals:
      - name: estimating_saas
        label: "AI Construction Blueprint Estimator"
        monetization: "Per-estimate usage fee / Subscription"
        required_capabilities: ["ocr", "analytics", "dashboard"]
        default_price_tier: "$99/mo"

      - name: contractor_crm
        label: "Lead Routing & Client Ingestion Portal"
        monetization: "Monthly user seats"
        required_capabilities: ["crm", "forms", "notifications"]
        default_price_tier: "$39/seat/mo"

      - name: permit_navigator
        label: "AI Building Permit Filing Assistant"
        monetization: "Flat fee per permit audit"
        required_capabilities: ["ocr", "search", "forms"]
        default_price_tier: "$150/permit"

  - name: financial
    subverticals:
      - name: bookkeeping_automation
        label: "AI Ledger & Bookkeeping Engine"
        monetization: "Monthly flat platform fee"
        required_capabilities: ["payments", "analytics", "ocr"]
        default_price_tier: "$79/mo"

      - name: portfolio_analyst
        label: "Private Equity Valuation Dashboard"
        monetization: "Enterprise licensing"
        required_capabilities: ["analytics", "dashboard", "graph"]
        default_price_tier: "$499/mo"

      - name: tax_optimization
        label: "Deduction Finder & Tax Filing Assistant"
        monetization: "Per tax return filing fee"
        required_capabilities: ["ocr", "analytics", "forms"]
        default_price_tier: "$199/year"

  - name: logistics_transport
    subverticals:
      - name: route_optimization
        label: "AI Driver Dispatch & Route Optimizer"
        monetization: "Per route optimization call / Subscription"
        required_capabilities: ["scheduling", "notifications", "analytics"]
        default_price_tier: "$129/mo"

  - name: technology
    subverticals:
      - name: repository_intelligence
        label: "Codebase Graph & Dependency Scanner"
        monetization: "Monthly per repository access"
        required_capabilities: ["devtools", "graph", "rag"]
        default_price_tier: "$19/repo/mo"
