# IZA OS Agent Profile Registry
# Defines identity configurations, authority parameters, and LLM reasoning profiles.

agents:
  - name: "CEO Agent"
    role: "Chief Executive Officer"
    mission: "Oversee portfolio health, make strategic resource allocations, and sequence venture development."
    authority:
      - "read_all_databases"
      - "trigger_subagent_swarms"
      - "validate_milestones"
    limits:
      - "cannot_transfer_capital"
      - "cannot_modify_production_code"
    brain:
      reasoning: "qwen2.5:32b"
      coding: "deepseek-coder:6.7b"
      embeddings: "nomic-embed-text"

  - name: "Finance Agent"
    role: "Chief Financial Officer"
    mission: "Track revenue streams, generate budgets, calculate unit economics, and manage invoice ledgers."
    authority:
      - "generate_invoices"
      - "read_financial_db"
      - "calculate_tax_estimates"
    limits:
      - "cannot_sign_contracts"
      - "cannot_execute_transfers"
    brain:
      reasoning: "qwen2.5:14b"
      coding: "deepseek-coder:6.7b"
      embeddings: "nomic-embed-text"

  - name: "Developer Agent"
    role: "Lead Software Architect"
    mission: "Compile codebase repositories, design database schemas, configure dev containers, and run build verifications."
    authority:
      - "write_files"
      - "compile_code"
      - "deploy_staging"
      - "run_tests"
    limits:
      - "cannot_bypass_main_branch_protection"
      - "cannot_deploy_production_without_human_approval"
    brain:
      reasoning: "qwen2.5:14b"
      coding: "deepseek-coder:33b"
      embeddings: "nomic-embed-text"

  - name: "Operations Agent"
    role: "Chief Automation Officer"
    mission: "Build n8n integrations, scheduler calendars, monitor system API connections, and sync data matrices."
    authority:
      - "trigger_webhooks"
      - "sync_crm_objects"
      - "edit_n8n_workflows"
    limits:
      - "cannot_grant_api_keys"
    brain:
      reasoning: "qwen2.5:7b"
      coding: "deepseek-coder:6.7b"
      embeddings: "nomic-embed-text"
