# AI Boss OS — master system configuration
# Secrets: use environment variables (see system_config.yaml.example)

version: "1.0.0"
system_name: ai-boss-os
environment: ${AI_BOSS_ENV:-development}

paths:
  entity_registry: registries/entity_registry/entities.json
  relationships_graph: registries/entity_registry/relationships.graph
  agent_schema: ../agents-os/shared/schemas/agent.schema.json
  contracts: ../agents-os/shared/CONTRACTS-SUMMARY.md
  ventures_csv: ../venture-hub/ventures-master.csv

kafka:
  bootstrap_servers: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
  client_id: ai-boss-os
  partition_key: venture_id
  replication_factor: ${KAFKA_REPLICATION_FACTOR:-1}
  retention_ms: 604800000  # 7 days
  topic_prefix: event
  topic_version: v1

temporal:
  host: ${TEMPORAL_HOST:-localhost:7233}
  namespace: ${TEMPORAL_NAMESPACE:-ai-boss-os}
  task_queue: venture-execution

n8n:
  base_url: ${N8N_BASE_URL:-http://localhost:5678}
  api_key: ${N8N_API_KEY:-}

postgres:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  database: ${POSTGRES_DB:-ai_boss_os}
  user: ${POSTGRES_USER:-ai_boss}
  password: ${POSTGRES_PASSWORD:-}
  sslmode: ${POSTGRES_SSLMODE:-prefer}
  schema_dir: memory/postgres/schema

neo4j:
  uri: ${NEO4J_URI:-bolt://localhost:7687}
  user: ${NEO4J_USER:-neo4j}
  password: ${NEO4J_PASSWORD:-}
  database: ${NEO4J_DATABASE:-neo4j}

redis:
  url: ${REDIS_URL:-redis://localhost:6379/0}
  agent_state_ttl_seconds: 3600

duckdb:
  path: ${DUCKDB_PATH:-memory/analytics/analytics.duckdb}

weaviate:
  url: ${WEAVIATE_URL:-http://localhost:8080}
  api_key: ${WEAVIATE_API_KEY:-}

grafana:
  url: ${GRAFANA_URL:-http://localhost:3000}
  api_key: ${GRAFANA_API_KEY:-}

prometheus:
  url: ${PROMETHEUS_URL:-http://localhost:9090}

supabase:
  url: ${SUPABASE_URL:-}
  service_key: ${SUPABASE_SERVICE_KEY:-}
  project_ref: ${SUPABASE_PROJECT_REF:-}

risk:
  auto_spend_limit_usd: 250
  constraints_file: registries/risk_registry/failure_modes.yaml

observability:
  log_level: ${LOG_LEVEL:-INFO}
  metrics_prefix: ai_boss_os

bootstrap:
  create_kafka_topics: true
  create_postgres_schema: true
  load_entity_registry: true
