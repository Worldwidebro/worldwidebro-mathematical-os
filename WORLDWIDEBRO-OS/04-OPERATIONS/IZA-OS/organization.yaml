# IZA OS Master Organization Registry
# Version: 2.0
# Date: 2026-07-16
# Purpose: Define complete organizational structure for AI-native operating system

# This file ties together:
# - Hermes (Executive Layer)
# - 12 Capability Departments
# - 18 OPCO Territories
# - 712 Ventures
# - Agent Assignments
# - Capability Marketplace

---

# ============================================================================
# LAYER 1: GOVERNANCE & EXECUTIVE
# ============================================================================

hermes:
  name: "Hermes"
  title: "Chief Operating Intelligence"
  mission: "Coordinate all departments, allocate capital, make strategic decisions, resolve conflicts"

  responsibilities:
    - strategic_direction
    - capital_allocation
    - risk_tolerance_setting
    - conflict_resolution
    - escalation_authority
    - venture_sequencing

  decision_authority:
    capital_threshold: 25000
    irreversible_decisions: true
    venture_formation: true
    opco_strategy: true

  authority:
    - read_all_databases
    - trigger_department_swarms
    - approve_major_ventures
    - allocate_resources
    - set_org_strategy
    - override_decisions_below_authority

  limits:
    - cannot_override_human_on_irreversible
    - cannot_hide_failures
    - cannot_exceed_human_authority

  brain:
    reasoning: "qwen2.5:32b"
    strategy: "claude-opus-4.8"
    embeddings: "nomic-embed-text"

  reporting_to: "Human Owner"


# ============================================================================
# LAYER 2: CAPABILITY DEPARTMENTS (Service Layer)
# ============================================================================

departments:

  # ========== DEPARTMENT 1: FINANCE & CAPITAL ==========

  finance:
    name: "Finance & Capital"
    code: "FIN"
    mission: "Manage capital allocation, revenue tracking, investments, acquisitions, and financial operations"

    director:
      name: "Finance Director Agent"
      id: "fin_director_001"
      authority:
        - approve_budgets_under: 25000
        - generate_invoices: true
        - read_financial_db: true
        - calculate_taxes: true

    teams:
      - name: "Accounting"
        agents:
          - name: "Bookkeeping Agent"
            id: "fin_bookkeeping_001"
            responsibilities: [invoice_generation, expense_tracking, reconciliation]
          - name: "Tax Agent"
            id: "fin_tax_001"
            responsibilities: [tax_planning, filing, compliance]

      - name: "Treasury"
        agents:
          - name: "Cash Flow Agent"
            id: "fin_cashflow_001"
            responsibilities: [forecasting, liquidity_management, payments]

      - name: "Valuations & Investments"
        agents:
          - name: "Valuation Agent"
            id: "fin_valuation_001"
            responsibilities: [venture_valuation, unit_economics, roi_calculation]
          - name: "Portfolio Agent"
            id: "fin_portfolio_001"
            responsibilities: [investor_tracking, roi_management, returns]

      - name: "M&A"
        agents:
          - name: "M&A Agent"
            id: "fin_ma_001"
            responsibilities: [acquisition_analysis, deal_structuring, integration]

    capabilities_offered:
      - accounting_setup
      - invoicing
      - cash_flow_forecasting
      - financial_reporting
      - payroll_management
      - tax_planning
      - valuation
      - roi_tracking
      - investment_analysis

    tools:
      - QuickBooks
      - Supabase
      - Stripe
      - Tax_software

