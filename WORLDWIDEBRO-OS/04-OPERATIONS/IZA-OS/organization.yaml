# ============================================================================
# COMMUNICATION PROTOCOL
# ============================================================================

communication:
  protocol: "event_driven"
  message_bus: "nats"

  message_types:
    - REQUEST
    - REPORT
    - ESCALATION
    - STATUS

  routing_rules:
    venture_launch: [product, technology, finance, sales, marketing]
    customer_payment: [sales, finance, customer_success]
    product_issue: [technology, product, customer_success]
    security_incident: [risk, technology, governance]


