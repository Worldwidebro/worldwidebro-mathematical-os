            id: "tech_frontend_001"
            responsibilities: [react_development, ui_components, responsive_design]
          - name: "Backend Agent"
            id: "tech_backend_001"
            responsibilities: [api_development, database_design, integrations]
          - name: "Mobile Agent"
            id: "tech_mobile_001"
            responsibilities: [ios_android_development, cross_platform]

      - name: "AI & Machine Learning"
        agents:
          - name: "AI Agent"
            id: "tech_ai_001"
            responsibilities: [llm_integration, prompt_engineering, ml_models]
          - name: "Data Agent"
            id: "tech_data_001"
            responsibilities: [pipelines, analytics, warehouse]

      - name: "Infrastructure & DevOps"
        agents:
