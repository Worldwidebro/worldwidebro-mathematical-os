version: '3.9'

services:
  # Graph Database for Knowledge Graph Infrastructure
  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    hostname: neo4j.internal
    environment:
      NEO4J_AUTH: neo4j/ventures2026
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_apoc_export_use__arrow__for__all: "true"
      NEO4J_apoc_import_file__use__neo4j__config: "true"
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://neo4j:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Time-Series & Caching for Agent Coordination
  redis:
    image: redis:7.2-alpine
    container_name: redis
    hostname: redis.internal
    command: redis-server --appendonly yes --maxmemory 256m --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres.internal
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dashboarding & Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    hostname: grafana.internal
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ventures2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ventures
    restart: unless-stopped
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  ventures:
    driver: bridge
    name: ventures
