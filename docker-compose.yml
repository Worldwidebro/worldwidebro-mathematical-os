services:
  # Graph Database for Knowledge Graph Infrastructure
  neo4j:
    image: neo4j:5.23
    container_name: neo4j
    hostname: neo4j.internal
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ventures2026}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_apoc_export_use__arrow__for__all: "true"
      NEO4J_apoc_import_file__use__neo4j__config: "true"
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # Bolt Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://neo4j:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Time-Series & Caching for Agent Coordination
  redis:
    image: redis:7.2-alpine
    container_name: redis
    hostname: redis.internal
    command: redis-server --appendonly yes --maxmemory 256m --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    hostname: postgres.internal
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Database for Semantic Search & Embeddings
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    hostname: qdrant.internal
    ports:
      - "6333:6333"  # REST API + Web UI
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # Dashboarding & Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    hostname: grafana.internal
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-ventures2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ventures
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Local Model Router - OpenAI-compatible proxy in front of Ollama
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    hostname: litellm.internal
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - ./.env.litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Observability — LLM tracing, metrics, and agent observability
  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: langfuse
    hostname: langfuse.internal
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres.internal:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET:-langfuse-dev-secret}
      SALT: ${LANGFUSE_SALT:-langfuse-dev-salt}
      NEXTAUTH_URL: http://localhost:3003
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPORT: "true"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3003:3000"
    networks:
      - ventures
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    hostname: prometheus.internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    hostname: otel.internal
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    networks:
      - ventures
    restart: unless-stopped

  # Workflow automation — self-hosted, own SQLite DB (no external dependency)
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    hostname: n8n.internal
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_ENCRYPTION_KEY: n8n-dev-encryption-key-change-me
      GENERIC_TIMEZONE: America/New_York
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ventures
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  grafana_data:
    driver: local
  qdrant_data:
    driver: local
  prometheus_data:
    driver: local
  n8n_data:
    driver: local

networks:
  ventures:
    driver: bridge
    name: ventures
