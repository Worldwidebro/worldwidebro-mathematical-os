      - cold_call_execution
      - deal_tracking
    neo4j_memory_key: "vent_ops_001"
    deployment_phase: "week_4"
    parent_orchestrator: "AGT-F001"  # Sales Orchestrator

  venture_lt_005:
    id: "AGT-VEN-LT-005"
    name: "LT-005 Venture Agent"
    tier: venture
    domain: "22-VENTURES"
    venture_id: "LT-005"
    description: "HealthRoute logistics agent"
    responsibilities:
      - dispatch_optimization
      - customer_lifecycle
      - revenue_tracking
    capabilities:
      - neo4j_context_assembly
      - dispatch_automation
      - crm_sync
    neo4j_memory_key: "vent_lt_005"
    deployment_phase: "week_4"
    parent_orchestrator: "AGT-F001"

  venture_con_001:
    id: "AGT-VEN-CON-001"
    name: "CON-001 Venture Agent"
    tier: venture
    domain: "22-VENTURES"
    venture_id: "CON-001"
    description: "Construction services agent"
    responsibilities:
      - project_management
      - client_communication
      - crew_coordination
    capabilities:
      - neo4j_context_assembly
      - project_tracking
    neo4j_memory_key: "vent_con_001"
    deployment_phase: "week_4"
    parent_orchestrator: "AGT-F003"  # Ops Orchestrator

  venture_re_001:
    id: "AGT-VEN-RE-001"
    name: "RE-001 Venture Agent"
    tier: venture
    domain: "22-VENTURES"
    venture_id: "RE-001"
    description: "Real estate investment agent"
    responsibilities:
      - deal_sourcing
      - financial_modeling
      - investor_reporting
    capabilities:
      - neo4j_context_assembly
      - deal_modeling
      - investor_updates
    neo4j_memory_key: "vent_re_001"
    deployment_phase: "week_4"
    parent_orchestrator: "AGT-E001"  # CEO

  # ... 304 more ventures (auto-generated from Supabase)
  # Template at: venture_agent_template.py

discovery_methods:
  - by_id: "Search AGT-{E|F|VEN}-{NNNN}"
  - by_task: "Search capabilities + domain (neo4j_context_assembly → 50 agents)"
  - by_domain: "Search domain field (25-SALES → Sales agents)"
  - by_deployment: "Search deployment_phase (week_4 → 18 agents)"
  - by_venture: "Search venture_id (OPS-001 → 1 agent)"

# Approval matrix (who can approve what)
approval_matrix:
  ceo:
    max_approval: 50000
    can_override: true
  cfo:
    max_approval: 10000
    can_override: false
  coo:
    max_approval: 25000
    can_override: false
