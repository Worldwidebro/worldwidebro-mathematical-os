## CONSOLIDATION PLAN

This file will aggregate data from:

sources:
  - _REGISTRIES/CANONICAL/CAPABILITY_REGISTRY.yaml
  - _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml
  - _REGISTRIES/CANONICAL/VENTURE_REGISTRY.yaml
  - _REGISTRIES/agents-by-sector.yaml
  - _REGISTRIES/skills/index.yaml
  - repos/*/config/agents.yaml
  - repos/*/config/skills.yaml

  # GitHub stars (if tracked)
