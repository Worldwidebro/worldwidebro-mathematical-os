  - Correlation matrix: Capability ↔ Repo ↔ Venture
  - VEX visibility report: What can VEX see?
  - Skill enablement map: Which agents enable which capabilities?
  - Gap analysis: What's missing for each venture?
  - Wiki-link brackets: How are these connected?

