## TEST SUITE (25 Test Domains)

### 1. REPOSITORY DISCOVERY TESTS

test_id: TEST-REPO-DISCOVERY
registry: sources.repositories
executable: true
tests:
  - name: "Can enumerate all repositories"
    command: "grep -c 'id:' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml"
    expected: "~1740"
    status: PENDING

  - name: "No duplicate repository IDs"
    command: "yq '.repositories[].id' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml | sort | uniq -d | wc -l"
    expected: "0"
    status: PENDING

  - name: "All repositories have URLs"
    command: "yq '.repositories[] | select(.url == null) | .id' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml | wc -l"
    expected: "0"
    status: PENDING

  - name: "Archive status recorded"
    command: "yq '.repositories[] | select(.archived != null) | .id' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml | wc -l"
    expected: ">0"
    status: PENDING

---

### 2. REPOSITORY INGESTION TESTS

test_id: TEST-REPO-INGESTION
registry: sources.repositories
executable: true
tests:
  - name: "README extracted for each repo"
