### 5. REPO ↔ CAPABILITY MAPPING TESTS

test_id: TEST-REPO-CAPABILITY-MAPPING
registry: sources.capabilities
executable: true
tests:
  - name: "Every repo in capabilities index exists in repository registry"
    command: |
      yq '.capabilities[] | .repository' _REGISTRIES/CANONICAL/CAPABILITY_REGISTRY.yaml | sort -u > /tmp/cap_repos.txt
      yq '.repositories[].id' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml | sort -u > /tmp/all_repos.txt
      comm -23 /tmp/cap_repos.txt /tmp/all_repos.txt | wc -l
    expected: "0"
    status: PENDING

  - name: "Repo → Capability mapping is bidirectional"
    command: "yq '.repositories[] | select(.capabilities == null) | .id' _REGISTRIES/CANONICAL/REPOSITORY_REGISTRY.yaml | wc -l"
    expected: "<100"
    status: PENDING

---

### 6. WORKFLOW EXTRACTION TESTS

test_id: TEST-WORKFLOW-EXTRACTION
registry: sources.workflows
executable: true
tests:
