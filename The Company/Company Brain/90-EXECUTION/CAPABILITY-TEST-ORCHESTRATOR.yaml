### 10. MASTER DISCOVERY TEST

test_id: TEST-MASTER-DISCOVERY
registry: "all"
executable: true
description: "Can the system answer: given a business objective, what can we do?"
test:
  objective: "Find everything we already have that can help acquire and onboard a medical-courier customer"
  expected_to_discover:
    - repositories: ["lt-005-medical-courier-dispatch", "ops-staff-001-staffing", "vex-*"]
    - capabilities: ["Order Management", "Lead Generation", "CRM", "Email", "SMS"]
    - funnels: ["ACQUIRE", "QUALIFY", "CONTACT", "CONVERT", "DELIVER", "BILL"]
    - workflows: ["order-processing", "driver-assignment", "delivery-tracking"]
    - tools: ["Stripe", "Twilio", "Google Maps", "Supabase"]
    - agents: ["sales-agent", "dispatch-agent", "customer-service-agent"]
  status: PENDING

