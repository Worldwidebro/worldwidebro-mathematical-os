# ============================================================================
# ENTRY 1: Anthropic Sales Plugin — Account Research
# ============================================================================

capabilities:
  - id: "CAP-001"
    ref_id: "CAP-001"
    slug: "anthropic-account-research"
    name: "Account Research (Prospect Intelligence)"
    description: "Research a company or person and extract actionable sales intelligence"
    
    category: "sales"
    vertical: "general"  # Works across all verticals
    maturity: "production"
    
    source: "anthropic"
    source_url: "https://github.com/anthropics/knowledge-work-plugins/tree/main/sales/skills/account-research"
    repo_status: "active"
    stars: 500
    
    skill:
      name: "account-research"
      description: "Get a complete picture of any company or person before outreach"
      triggers:
        - "research [company]"
        - "look up [person]"
        - "intel on [prospect]"
        - "who is [name] at [company]"
        - "tell me about [company]"
    
    inputs:
      required:
        - "company_name: string"
        - "person_name: string (optional)"
      optional:
        - "research_depth: 'overview'|'detailed'"
        - "include_enrichment: boolean"
    
    outputs:
      primary: "Structured company/person research with intel"
      format: "markdown"
      example:
        company: "WakeMed"
        industry: "Healthcare"
        employee_count: "8000+"
        key_people:
          - name: "Jane Doe"
            title: "Lab Director"
            linkedin: "https://linkedin.com/..."
        recent_news: ["Accreditation renewed", "New CAP certification"]
        hiring_signals: "Active recruiting for operations roles"
    
    execution:
      type: "skill"
      model: "sonnet"
      estimated_tokens: 2000
      estimated_latency_ms: 8000
      cost_per_invocation: "$0.02"
    
    dependencies:
      mcps:
        - mcp_id: "MCP-ENRICHMENT"
          required: false
          fallback: true
      skills: []
      external_apis:
        - "Google Search API"
        - "LinkedIn (enrichment optional)"
    
    healthroute_fit: 95
    healthroute_use_case: "Research medical labs before outreach: WakeMed, Atrium Health, Duke Health; identify lab directors, specimen volumes, compliance posture"
    healthroute_gap: "Specimen volume buried in facility profiles; no HIPAA research auto-trigger"
    
    integrations:
      supabase: false
      neo4j: false
      slack: false
      custom_mcp: false
    
    owner: "Anthropic"
    approval_status: "approved"
    access_control: "public"
    
    tags: ["sales", "research", "prospecting", "b2b", "anthropic"]
    related_capabilities: ["CAP-002", "CAP-006"]
    version: "1.0"
    created: "2026-09-10"
    last_updated: "2026-09-10"

