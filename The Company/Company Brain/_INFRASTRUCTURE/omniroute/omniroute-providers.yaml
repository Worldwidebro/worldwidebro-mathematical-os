# USAGE EXAMPLES

usage:

  - example: "Simple query via CLI"
    command: |
      omniroute query \
        --task "code-generation" \
        --complexity 5 \
        --vendor "any"
    expected: >
      Provider: exo-mac-studio
      Model: mlx-community/Qwen3-Coder-480B-A35B
      Latency: ~8s
      Cost: $0.00

  - example: "Query with cost constraint"
    command: |
      omniroute query \
        --task "code-generation" \
        --max-cost-per-mtok 0.01 \
        --max-latency-ms 10000
    expected: >
      Provider: ollama-mac-air
      Model: qwen2.5-coder:14b
      Latency: ~2s
      Cost: $0.00

  - example: "Query via MCP (Claude Code)"
    command: "@omniroute route --task code-gen --complexity 7"
    expected: >
      Routes to: anthropic-claude claude-sonnet-5
      Fallback: exo-mac-studio

