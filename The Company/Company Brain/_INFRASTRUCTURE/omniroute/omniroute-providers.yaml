---

# ROUTING RULES (when to use which provider)

routing_rules:

  # Routing by task complexity
  - rule_id: "by-complexity"
    description: "Route based on task complexity (1-10 scale)"
    conditions:
      - complexity: 1-3
        providers: ["ollama-mac-air", "ollama-mac-studio"]
        rationale: "Simple tasks use local models"
      - complexity: 4-6
        providers: ["exo-mac-studio", "ollama-mac-air"]
        rationale: "Medium tasks use distributed MLX or fallback"
      - complexity: 7-10
        providers: ["anthropic-claude"]
        rationale: "Hard problems escalate to frontier Claude"

  # Routing by model type
  - rule_id: "by-model-type"
    description: "Route based on required model type"
    conditions:
      - task: "embedding"
        models: ["nomic-embed-text"]
        fallback: "none"
      - task: "code-generation"
        models: ["qwen2.5-coder:14b", "qwen3-coder-480b"]
        fallback: "claude-sonnet-5"
      - task: "reasoning"
        models: ["qwen3.6-35b", "claude-opus-4.8"]
        fallback: "claude-sonnet-5"

  # Routing by latency requirement
  - rule_id: "by-latency"
    description: "Route based on SLA latency requirement"
    conditions:
      - latency_sla: "<100ms"
        providers: ["ollama-mac-air"]
        note: "Only local Ollama on Mac Air meets <100ms"
      - latency_sla: "<500ms"
        providers: ["exo-mac-studio", "ollama-mac-air"]
      - latency_sla: ">500ms"
        providers: ["anthropic-claude"]  # Cloud OK if SLA allows

  # Routing by cost budget
  - rule_id: "by-cost-budget"
    description: "Route based on venture's cost budget"
    conditions:
      - cost_budget: "$0 (free)"
        providers: ["ollama-mac-air", "exo-mac-studio"]
      - cost_budget: "<$1/month"
        providers: ["ollama-mac-air", "exo-mac-studio"]
      - cost_budget: ">$1/month"
        providers: ["anthropic-claude"]

  # Routing by venture tier
  - rule_id: "by-venture-tier"
    description: "Route based on venture readiness tier"
    conditions:
      - tier: "prototype"
        providers: ["ollama-mac-air"]
        rationale: "Save costs, local only"
      - tier: "mvp"
        providers: ["exo-mac-studio", "ollama-mac-air"]
      - tier: "production"
        providers: ["anthropic-claude"]  # Frontier + reliable
        fallback: ["exo-mac-studio"]

---

# FALLBACK CHAINS (what to try if primary fails)

fallback_chains:

  - chain_id: "code-gen-chain"
    task: "code-generation"
    sequence:
      - provider: "ollama-mac-air"
        model: "qwen2.5-coder:14b"
        timeout_ms: 5000
      - provider: "exo-mac-studio"
        model: "mlx-community/Qwen3-Coder-480B-A35B"
        timeout_ms: 10000
      - provider: "anthropic-claude"
        model: "claude-sonnet-5"
        timeout_ms: 30000

  - chain_id: "reasoning-chain"
    task: "reasoning"
    sequence:
      - provider: "exo-mac-studio"
        model: "mlx-community/Qwen3.6-35B-A3B-5bit"
        timeout_ms: 10000
      - provider: "anthropic-claude"
        model: "claude-opus-4.8"
        timeout_ms: 30000

  - chain_id: "embedding-chain"
    task: "embedding"
    sequence:
      - provider: "ollama-mac-air"
        model: "nomic-embed-text"
        timeout_ms: 5000
      - provider: "ollama-mac-studio"
        model: "nomic-embed-text"
        timeout_ms: 5000

