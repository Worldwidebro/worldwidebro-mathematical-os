# DEPLOYMENT CHECKLIST

deployment:

  steps:
    - step: 1
      title: "Verify OmniRoute is running"
      command: "curl http://localhost:20128/health"
      expected: "200 OK"
      status: "✅ Done (verified 2026-09-07)"

    - step: 2
      title: "Copy this config to OmniRoute storage"
      command: "docker cp omniroute-providers.yaml omniroute:/app/config/"
      expected: "File copied to container"
      status: "⏳ Pending"

    - step: 3
      title: "Verify Ollama running on Mac Air"
      command: "ollama list"
      expected: "qwen2.5-coder:14b, nomic-embed-text listed"
      status: "✅ Done"

    - step: 4
      title: "Verify exo running on Mac Studio"
      command: "curl http://100.87.214.70:52415/v1/models"
      expected: "120-model catalog returned"
      status: "⏳ Pending"

    - step: 5
      title: "Test provider routing"
      command: >
        curl -X POST http://localhost:20128/api/route \
          -H "Content-Type: application/json" \
          -d '{"task": "code-generation", "complexity": 5}'
      expected: "Provider recommendation returned"
      status: "⏳ Pending"

  completion_criteria:
    - "All 5 deployment steps completed"
    - "OmniRoute knows about all 6 providers"
    - "Routing rules are loaded and active"
    - "Fallback chains tested end-to-end"
    - "At least 1 venture can query OmniRoute for model selection"

