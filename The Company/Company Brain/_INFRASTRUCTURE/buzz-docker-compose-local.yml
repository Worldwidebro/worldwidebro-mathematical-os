version: '3.8'

services:
  # Buzz Relay (main WebSocket server)
  buzz-relay:
    image: buzz:latest
    container_name: buzz_relay
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@buzz_postgres:5432/buzz
      REDIS_URL: redis://buzz_redis:6379/0
      S3_BUCKET: buzz-media
      S3_ENDPOINT: http://buzz_minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      RUST_LOG: info
      BIND_ADDRESS: "0.0.0.0:8080"
    depends_on:
      buzz_postgres:
        condition: service_healthy
      buzz_redis:
        condition: service_started
      buzz_minio:
        condition: service_healthy
    volumes:
      - buzz_relay_data:/app/data
    networks:
      - buzz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (event log storage)
  buzz_postgres:
    image: postgres:16-alpine
    container_name: buzz_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buzz
    ports:
      - "5433:5432"
    volumes:
      - buzz_postgres_data:/var/lib/postgresql/data
    networks:
      - buzz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (pub/sub for real-time events)
  buzz_redis:
    image: redis:7-alpine
    container_name: buzz_redis
    ports:
      - "6380:6379"
    volumes:
      - buzz_redis_data:/data
    networks:
      - buzz-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible object storage)
  buzz_minio:
    image: minio/minio:latest
    container_name: buzz_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - buzz_minio_data:/minio_root/data
    networks:
      - buzz-network
    restart: unless-stopped
    command: server /minio_root/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  buzz_relay_data:
    driver: local
  buzz_postgres_data:
    driver: local
  buzz_redis_data:
    driver: local
  buzz_minio_data:
    driver: local

networks:
  buzz-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
