version: '3.8'

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-gateway
    ports:
      - "8000:3000"
    environment:
      - OMNIROUTE_ENV=production
      - TAILSCALE_ENABLED=true
      - PORT=3000
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
