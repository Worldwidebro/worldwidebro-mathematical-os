services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-gateway
    ports:
      - "8000:3000"
    environment:
      # Core
      - OMNIROUTE_ENV=production
      - PORT=3000

      # Tailscale networking (optional, for peer access)
      - TAILSCALE_ENABLED=false

      # Ollama routing (local models on Mac Studio)
      - OLLAMA_API_BASE=http://100.87.214.70:11434
      - OLLAMA_ENABLE=true

      # n8n tool dispatch (for 110 tools)
      - N8N_API_BASE=http://100.87.214.70:5678
      - N8N_ENABLE=true

      # Neo4j tracking (for decision logging + revenue attribution)
      - NEO4J_URI=bolt://100.87.214.70:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changeme
      - NEO4J_ENABLE=true

      # Token aggregation (free tier)
      - AGGREGATION_ENABLE=true
      - AGGREGATION_REFRESH_INTERVAL=3600

      # Cost tracking
      - COST_TRACKING_ENABLE=true
      - COST_EXPORT_INTERVAL=60

    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
