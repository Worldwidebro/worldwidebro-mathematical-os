version: '3.8'

# LiteLLM Proxy Configuration
# Model routing + inference gateway
# Connects to Ollama (local) + Claude API (remote) + exo (distributed)

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: company-brain-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}

      # Observability
      LANGFUSE_PUBLIC_KEY: pk_localhost
      LANGFUSE_SECRET_KEY: sk_localhost
      LANGFUSE_BASEURL: http://host.docker.internal:3003

      # LiteLLM settings
      LITELLM_LOG: "DEBUG"
      LOG_LEVEL: "INFO"
    volumes:
      # Mount config from LaCie storage (persistent, accessible to container)
      - /Volumes/LaCie/config/litellm-config.yaml:/app/config.yaml:ro
    networks:
      - company-brain-infrastructure
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - neo4j
      - qdrant

  # Redis for caching (LiteLLM response cache)
  redis:
    image: redis:7-alpine
    container_name: company-brain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - /Volumes/LaCie/redis/data:/data
    networks:
      - company-brain-infrastructure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Neo4j (from main compose, included here for reference)
  neo4j:
    image: neo4j:5.23
    container_name: company-brain-neo4j
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: "neo4j/changeme"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
    volumes:
      - /Volumes/LaCie/neo4j/data:/data
      - /Volumes/LaCie/neo4j/logs:/logs
    networks:
      - company-brain-infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant (from main compose, included here for reference)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: company-brain-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    environment:
      QDRANT__DEBUG: "false"
      QDRANT__LOG_LEVEL: "info"
    volumes:
      - /Volumes/LaCie/qdrant/storage:/qdrant/storage
      - /Volumes/LaCie/qdrant/snapshots:/qdrant/snapshots
    networks:
      - company-brain-infrastructure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  company-brain-infrastructure:
    driver: bridge
