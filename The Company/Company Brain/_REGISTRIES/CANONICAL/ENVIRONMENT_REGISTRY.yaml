## Environment-Specific Configuration

### Local Development
```yaml
environment: local
service_endpoints:
  neo4j: bolt://localhost:7687
  postgres: postgresql://localhost:5433
  qdrant: http://localhost:6333
sync_strategy: Direct connection to Mac Studio via Tailscale
data_freshness: Real-time
```

### Staging
```yaml
environment: staging
service_endpoints:
  neo4j: bolt://100.87.214.70:7687
  postgres: postgresql://100.87.214.70:5433
  qdrant: http://100.87.214.70:6333
  supabase: https://aipehhzlsmfxxzwceppd.supabase.co
sync_strategy: Weekly YAML sync from local, daily Supabase sync
data_freshness: Daily
```

### Production
```yaml
environment: production
service_endpoints:
  vercel: https://vex-hero-site-sigma.vercel.app
  supabase: https://aipehhzlsmfxxzwceppd.supabase.co
  make: https://us2.make.com
  github: https://github.com/worldwidebro
sync_strategy: CI/CD pipeline (git → GitHub Actions → Vercel/Supabase)
data_freshness: Real-time
```

## Routing Rules

**Which environment to use for:**
- **Development:** Use `local` (testing code changes)
- **Integration Testing:** Use `staging` (test venture interactions)
- **User-Facing Features:** Use `production` (VEX, revenue ventures)
- **Data Analytics:** Use `production` Supabase (source of truth)
- **Agent Execution:** Use `staging` for testing, `production` for real ventures

