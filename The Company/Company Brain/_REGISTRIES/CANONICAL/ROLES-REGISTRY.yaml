---
name: roles-registry
description: "Master registry of all roles in estate/family office ecosystem"
version: "1.0"
created: "2026-09-23"
authority: "CP-001 (Enterprise) + CP-027 (Infrastructure)"

# This registry defines WHAT each role is and what authority it carries
# Each role has:
#   - role_id (unique identifier, ROLE-XXXX)
#   - title (human-readable name)
#   - entity_type (what kind of entity has this role)
#   - authority_level (decision-making power)
#   - responsibilities (what the role does)
#   - required_evidence (what documents prove the role exists)
#   - approval_authority (what can they approve?)

roles:

  # ===== FAMILY & GOVERNANCE =====
  - role_id: ROLE-FOUNDER
    title: "Founder"
    entity_type: "Family / Holding Company"
    authority_level: "SOVEREIGN"
    description: "Ultimate decision authority over estate"
    responsibilities:
      - "Strategic direction"
      - "Succession planning"
      - "Capital allocation decisions"
      - "Beneficiary designation"
    approval_authority:
      - "Can approve: Any decision"
      - "Cannot approve: Nothing (ultimate authority)"
    required_evidence:
      - "Trust documents"
      - "Will"
      - "Articles of organization"
    approval_limits:
      unlimited: true

  - role_id: ROLE-CO-PRINCIPAL
    title: "Spouse / Partner"
    entity_type: "Family Trust"
    authority_level: "EXECUTIVE"
    description: "Co-owner of estate with founder"
    responsibilities:
      - "Co-decision making on major items"
      - "Beneficiary oversight"
      - "Estate review"
    approval_authority:
      - "Can approve: Major decisions (joint with founder)"
      - "Cannot approve: Unilateral decisions"
    required_evidence:
      - "Trust agreement"
      - "Marriage certificate"
    approval_limits:
      requires_joint_approval: true
      joint_with: "ROLE-FOUNDER"

  - role_id: ROLE-TRUSTEE-PRIMARY
    title: "Primary Trustee"
    entity_type: "Trust"
    authority_level: "FIDUCIARY"
    description: "Manages trust assets on behalf of beneficiaries"
    responsibilities:
      - "Asset management"
      - "Beneficiary distributions"
      - "Investment decisions"
      - "Tax planning"
      - "Trust administration"
    approval_authority:
      - "Can approve: Trust distributions up to $[LIMIT]"
      - "Can approve: Investment decisions within mandate"
      - "Cannot approve: Changes to trust terms (requires attorney)"
    required_evidence:
      - "Trustee certification"
      - "Trust agreement"
      - "Bond (if required)"
    approval_limits:
      distribution_limit: 250000
      investment_scope: "Within investment policy statement"

  - role_id: ROLE-TRUSTEE-CO
    title: "Co-Trustee"
    entity_type: "Trust"
    authority_level: "FIDUCIARY"
    description: "Shares trustee responsibilities"
    responsibilities:
      - "Joint asset management"
      - "Shared decision-making"
    approval_authority:
      - "Can approve: With co-trustee consent"
    required_evidence:
      - "Trustee certification"
      - "Trust agreement"
    approval_limits:
      requires_joint_approval: true
      joint_with: "ROLE-TRUSTEE-PRIMARY"

  - role_id: ROLE-TRUST-PROTECTOR
    title: "Trust Protector"
    entity_type: "Trust"
    authority_level: "ADVISORY"
    description: "Independent oversight of trustee"
    responsibilities:
      - "Trustee monitoring"
      - "Beneficiary advocacy"
      - "Trust terms review"
      - "Dispute resolution"
    approval_authority:
      - "Can veto: Trustee decisions if improper"
      - "Can remove: Trustee (with cause)"
    required_evidence:
      - "Trust agreement"
      - "Protector appointment letter"
    approval_limits:
      veto_power: true

  # ===== FAMILY OFFICE EXECUTIVE =====
  - role_id: ROLE-FOE-CEO
    title: "Family Office CEO"
    entity_type: "Family Office"
    authority_level: "EXECUTIVE"
    description: "Chief executive of family office operations"
    responsibilities:
      - "Day-to-day operations"
      - "Staff management"
      - "Board liaison"
      - "Strategic implementation"
    approval_authority:
      - "Can approve: Operating expenses up to $[LIMIT]"
      - "Can approve: Hiring/staffing decisions"
      - "Cannot approve: Capital allocations (requires CFO/founder)"
    required_evidence:
      - "Employment agreement"
      - "Board resolution"
      - "Background check"
    approval_limits:
      operating_expense_limit: 100000

  - role_id: ROLE-FOE-CFO
    title: "Family Office CFO"
    entity_type: "Family Office"
    authority_level: "EXECUTIVE"
    description: "Financial oversight of estate and family office"
    responsibilities:
      - "Financial reporting"
      - "Budget management"
      - "Capital allocation"
      - "Treasury management"
      - "Tax planning"
    approval_authority:
      - "Can approve: Capital allocations up to $[LIMIT]"
      - "Can approve: Budget changes within scope"
      - "Can approve: Debt management decisions"
      - "Cannot approve: Unlimited capital (requires founder)"
    required_evidence:
      - "Employment agreement"
      - "Board resolution"
      - "CPA certification (optional)"
    approval_limits:
      capital_allocation_limit: 500000
      debt_approval_limit: 1000000

  - role_id: ROLE-FOE-COO
    title: "Family Office COO"
    entity_type: "Family Office"
    authority_level: "EXECUTIVE"
    description: "Operational management of family office"
    responsibilities:
      - "HR management"
      - "Process management"
      - "Vendor management"
      - "Compliance oversight"
    approval_authority:
      - "Can approve: Operating procedures"
      - "Can approve: Vendor contracts up to $[LIMIT]"
      - "Can approve: Staff compensation"
    required_evidence:
      - "Employment agreement"
      - "Board resolution"
    approval_limits:
      vendor_contract_limit: 50000

  - role_id: ROLE-FOE-CIO
    title: "Family Office CIO"
    entity_type: "Family Office"
    authority_level: "EXECUTIVE"
    description: "Technology and data infrastructure"
    responsibilities:
      - "Technology strategy"
      - "Data management"
      - "Cybersecurity"
      - "System administration"
    approval_authority:
      - "Can approve: Technology purchases up to $[LIMIT]"
      - "Can approve: Data policies"
      - "Can approve: System access controls"
    required_evidence:
      - "Employment agreement"
      - "Background check"
    approval_limits:
      technology_purchase_limit: 100000

  # ===== LEGAL & PROFESSIONAL ADVISORS =====
  - role_id: ROLE-ATTORNEY-ESTATE
    title: "Estate Planning Attorney"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Legal authority on trusts, wills, and succession"
    responsibilities:
      - "Trust document drafting"
      - "Will preparation"
      - "Succession planning"
      - "Legal compliance"
      - "Beneficiary documentation"
    approval_authority:
      - "Required approval: Any trust changes"
      - "Required approval: Beneficiary modifications"
      - "Advisory only: Tax planning (coordinate with CPA)"
    required_evidence:
      - "Engagement letter"
      - "Bar license verification"
      - "E&O insurance"
    approval_limits:
      advisory_veto: true

  - role_id: ROLE-ATTORNEY-CORPORATE
    title: "Corporate Attorney"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Legal authority on contracts, entities, compliance"
    responsibilities:
      - "Entity formation"
      - "Contract review"
      - "Regulatory compliance"
      - "Governance documentation"
    approval_authority:
      - "Required approval: Major contracts ($[LIMIT]+)"
      - "Required approval: Entity formation"
      - "Advisory only: Business strategy"
    required_evidence:
      - "Engagement letter"
      - "Bar license verification"
      - "E&O insurance"
    approval_limits:
      contract_approval_threshold: 100000

  - role_id: ROLE-ATTORNEY-RE
    title: "Real Estate Attorney"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Legal authority on property transactions"
    responsibilities:
      - "Deed preparation"
      - "Purchase/sale agreements"
      - "Tenant matters"
      - "Easement/encumbrance review"
    approval_authority:
      - "Required approval: Property acquisitions"
      - "Required approval: Property sales"
      - "Advisory only: Property management"
    required_evidence:
      - "Engagement letter"
      - "Bar license verification"

  - role_id: ROLE-TAX-ADVISOR
    title: "CPA / Tax Advisor"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Tax strategy and compliance"
    responsibilities:
      - "Tax return preparation"
      - "Tax planning"
      - "Audit support"
      - "Entity tax structure advice"
    approval_authority:
      - "Required approval: Tax strategy decisions"
      - "Required approval: Return filing"
      - "Advisory only: Business strategy"
    required_evidence:
      - "Engagement letter"
      - "CPA certification"
      - "Errors & Omissions insurance"
    approval_limits:
      advisory_veto: true

  - role_id: ROLE-AUDITOR
    title: "External Auditor"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Independent financial audit"
    responsibilities:
      - "Annual audit"
      - "Financial statement verification"
      - "Control assessment"
      - "Compliance audit"
    approval_authority:
      - "Can veto: Financial statement accuracy"
      - "Advisory: Internal control improvements"
    required_evidence:
      - "Engagement letter"
      - "CPA certification"
      - "Audit firm credentials"

  - role_id: ROLE-BANKER
    title: "Private Banker"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Banking and treasury relationships"
    responsibilities:
      - "Account management"
      - "Liquidity management"
      - "Credit facility management"
      - "Payment processing"
    approval_authority:
      - "Advisory: Account structure"
      - "Can facilitate: Wire transfers (requires CFO approval)"
    required_evidence:
      - "Bank relationship letter"
      - "Account documentation"

  - role_id: ROLE-INVESTMENT-MANAGER
    title: "Portfolio Manager / Investment Advisor"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Investment strategy and management"
    responsibilities:
      - "Portfolio management"
      - "Asset allocation"
      - "Manager selection"
      - "Performance reporting"
    approval_authority:
      - "Advisory: Investment decisions"
      - "Can propose: Allocation changes"
      - "Requires: Trustee or CFO final approval"
    required_evidence:
      - "Investment advisory agreement"
      - "SEC registration (if required)"
      - "Performance history"

  - role_id: ROLE-INSURANCE-BROKER
    title: "Insurance Broker"
    entity_type: "External Advisory"
    authority_level: "ADVISORY"
    description: "Insurance coverage strategy"
    responsibilities:
      - "Risk assessment"
      - "Coverage recommendations"
      - "Policy placement"
      - "Claims coordination"
    approval_authority:
      - "Can recommend: Coverage types"
      - "Required approval: Major coverage changes"
    required_evidence:
      - "Broker agreement"
      - "Insurance license"
      - "E&O insurance"

  # ===== REAL ESTATE & PROPERTY =====
  - role_id: ROLE-PROPERTY-MANAGER
    title: "Property Manager"
    entity_type: "Real Estate Entity"
    authority_level: "MANAGEMENT"
    description: "Day-to-day property management"
    responsibilities:
      - "Tenant management"
      - "Maintenance coordination"
      - "Rent collection"
      - "Compliance with regulations"
      - "Property reporting"
    approval_authority:
      - "Can approve: Routine maintenance up to $[LIMIT]"
      - "Can approve: Tenant leases (within parameters)"
      - "Cannot approve: Major capital projects"
    required_evidence:
      - "Management agreement"
      - "Background check"
    approval_limits:
      maintenance_limit: 25000

  - role_id: ROLE-DEVELOPER
    title: "Development Manager"
    entity_type: "Real Estate Development"
    authority_level: "MANAGEMENT"
    description: "Real estate development and construction"
    responsibilities:
      - "Project management"
      - "Contractor coordination"
      - "Budget management"
      - "Timeline management"
    approval_authority:
      - "Can approve: Contractor payments (per contract)"
      - "Can approve: Minor change orders"
      - "Cannot approve: Major scope changes"
    required_evidence:
      - "Developer agreement"
      - "License verification"

  # ===== VENTURE OPERATIONS =====
  - role_id: ROLE-VENTURE-CEO
    title: "Venture CEO / Founder"
    entity_type: "Operating Company / Venture"
    authority_level: "MANAGEMENT"
    description: "Chief executive of operating venture"
    responsibilities:
      - "Operations management"
      - "Strategic execution"
      - "Reporting to holding company"
      - "Team management"
    approval_authority:
      - "Can approve: Operating expenses up to $[LIMIT]"
      - "Can approve: Hiring within budget"
      - "Cannot approve: Major capital (requires OpCo board)"
    required_evidence:
      - "Appointment letter"
      - "Background check"
    approval_limits:
      operating_expense_limit: 50000

  - role_id: ROLE-VENTURE-CFO
    title: "Venture CFO"
    entity_type: "Operating Company / Venture"
    authority_level: "MANAGEMENT"
    description: "Financial management of operating venture"
    responsibilities:
      - "Financial reporting"
      - "Budgeting"
      - "Accounting"
      - "Profitability tracking"
    approval_authority:
      - "Can approve: Operating expenses"
      - "Cannot approve: Capital allocation (requires CEO/OpCo)"
    required_evidence:
      - "Employment agreement"
      - "CPA certification (optional)"

  # ===== CONTROL PLANE AUTHORITY =====
  - role_id: ROLE-CP-MEMBER
    title: "Control Plane Member"
    entity_type: "Control Plane"
    authority_level: "GOVERNANCE"
    description: "Member of a control plane"
    responsibilities:
      - "Strategic decisions within domain"
      - "Policy setting"
      - "Approval authority in domain"
    approval_authority:
      - "Varies by control plane"
    required_evidence:
      - "CP appointment"
      - "Charter document"

  # ===== ADDITIONAL ROLES (Can be expanded) =====
  - role_id: ROLE-BOARD-MEMBER
    title: "Board Member"
    entity_type: "Company Board"
    authority_level: "GOVERNANCE"
    description: "Member of board of directors"
    responsibilities:
      - "Governance oversight"
      - "Strategic direction"
      - "Risk oversight"
    approval_authority:
      - "Board-level decisions (collective)"
    required_evidence:
      - "Board resolution"
      - "Shareholder approval"

  - role_id: ROLE-ADVISOR
    title: "Advisor (General)"
    entity_type: "Advisory"
    authority_level: "ADVISORY"
    description: "General advisor to estate"
    responsibilities:
      - "Guidance and counsel"
      - "Strategic advice"
    approval_authority:
      - "Advisory only (no approval authority)"
    required_evidence:
      - "Advisor agreement"

# ===== APPROVAL AUTHORITY MATRIX =====
# This defines what decisions require what roles to approve

approval_requirements:

  capital_allocation:
    under_100k: ["ROLE-FOE-CFO"]
    100k_to_500k: ["ROLE-FOE-CFO", "ROLE-FOUNDER"]
    over_500k: ["ROLE-FOUNDER"]

  trust_changes:
    beneficiary_modification: ["ROLE-ATTORNEY-ESTATE", "ROLE-FOUNDER"]
    trust_terms: ["ROLE-ATTORNEY-ESTATE", "ROLE-FOUNDER"]
    trustee_replacement: ["ROLE-TRUST-PROTECTOR", "ROLE-FOUNDER"]

  property_transactions:
    acquisition: ["ROLE-ATTORNEY-RE", "ROLE-FOE-CFO"]
    sale: ["ROLE-ATTORNEY-RE", "ROLE-FOUNDER"]
    major_renovation: ["ROLE-DEVELOPER", "ROLE-FOE-CFO"]

  contracts:
    under_100k: ["ROLE-ATTORNEY-CORPORATE"]
    100k_plus: ["ROLE-ATTORNEY-CORPORATE", "ROLE-FOE-CEO"]
    major_supplier: ["ROLE-ATTORNEY-CORPORATE", "ROLE-FOE-COO"]

  tax_decisions:
    annual_tax_plan: ["ROLE-TAX-ADVISOR", "ROLE-FOE-CFO"]
    significant_transactions: ["ROLE-TAX-ADVISOR", "ROLE-FOUNDER"]

  insurance:
    coverage_changes: ["ROLE-INSURANCE-BROKER", "ROLE-FOE-CFO"]
    new_policies: ["ROLE-INSURANCE-BROKER"]

notes: |
  CRITICAL CONTEXT:

  1. Authority levels (hierarchical):
     - SOVEREIGN: Founder only - unlimited authority
     - EXECUTIVE: C-level officers - broad authority within domain
     - FIDUCIARY: Legal/trust authority - domain-specific
     - GOVERNANCE: Board/control plane - policy setting
     - ADVISORY: External advisors - guidance, not approval
     - MANAGEMENT: Operational - day-to-day decisions

  2. Approval authority is CUMULATIVE:
     - Lower authority requires higher approval
     - Some decisions require MULTIPLE roles (joint approval)

  3. [LIMIT] placeholders should be updated with actual thresholds:
     - Set by founder or CFO
     - Document in separate APPROVAL-AUTHORITY-LIMITS.yaml

  4. Next step: Map people (PEOPLE-REGISTRY) to roles (this file)
     - Use RESPONSIBILITY-MATRIX to show entity → role → person
     - Highlight gaps (unfilled roles)
