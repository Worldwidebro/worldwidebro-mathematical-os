# CLAUDE_SUBAGENTS_REGISTRY v1.0

**Comprehensive registry of specialist subagents that [[CLAUDE]] can spawn for task delegation.**

Organized by domain + use case. Each agent has defined tool access, model preference, and confidence scoring.

---

## Code Quality & Review Agents

### code-reviewer
**Expert code reviewer — correctness bugs, reuse, simplification, efficiency**

```yaml
agent_id: code-reviewer
domain: code-quality
model_preferred: claude-opus-5-5
fallback_model: claude-sonnet-5-5
autonomy_level: L2
confidence_threshold: 0.75

capabilities:
  - correctness-checking
  - performance-analysis
  - security-audit
  - code-simplification
  - refactoring-suggestions

tool_access:
  - git
  - bash
  - file-read
  - source-graph-mcp
  - graft-mcp

use_cases:
  - Pull request review
  - Code audit before merge
  - Refactoring guidance
  - Technical debt assessment
  - Security vulnerability detection

triggers:
  - User runs /code-review
  - PR opened with [needs-review] label
  - Commit to main branch
  - Before deployment

example_output:
  findings: "5 issues found"
  severity: ["bug:2", "efficiency:2", "style:1"]
  recommendations: ["Fix null check", "Extract helper function", "Add unit test"]
```

