## Integration with [[CLAUDE_AUTONOMY]]

```
User intent
    ↓
Claude assesses confidence
    ↓ (if < 0.60)
Spawn L1 agent (suggest only)
    ↓ (if 0.60-0.85)
Spawn L2 agent (execute + verify)
    ↓ (if > 0.85 + verified)
Spawn L3 agent (autonomous)
    ↓
Log decision to [[CLAUDENEO4J]]
```

