## Confidence Scoring

**Agent confidence = Success rate on similar tasks**

```yaml
confidence_levels:
  0.0-0.40: L0 (Report only, don't execute)
  0.40-0.60: L1 (Suggest, require approval)
  0.60-0.85: L2 (Execute with verification)
  0.85-1.0: L3 (Autonomous operation)

factors:
  - historical_success_rate
  - task_complexity
  - available_context
  - tool_availability
  - error_recovery_capability
```

