## How to Spawn Subagents

### From Claude Code

```bash
# Automatic discovery
claude "review my code"
# → Spawns: code-reviewer + security-reviewer (parallel)

# Explicit spawn
/code-review --max-findings all

# Parallel subagents
/security-reviewer
/performance-optimizer
# → Both run in parallel, results merged
```

### From [[CLAUDEAPI]]

```python
from anthropic import Anthropic

client = Anthropic()

# Delegate to code reviewer subagent
response = client.messages.create(
    model="claude-opus-5-5",
    messages=[
        {
            "role": "user",
            "content": [
                {
                    "type": "text",
                    "text": "Review this code for security issues"
                },
                {
                    "type": "document",
                    "source": {"type": "file", "file_id": "..."}
                }
            ]
        }
    ],
    system="You are code-reviewer subagent. Review for bugs, security, performance."
)
```

### From Neo4j (via MCP)

```cypher
// Log subagent spawn
MERGE (task:Task {id: "TASK-001"})
MERGE (agent:Agent {name: "code-reviewer"})
MERGE (task)-[:DELEGATED_TO]->(agent)
SET task.status = "in_progress", agent.confidence_score = 0.78
```

