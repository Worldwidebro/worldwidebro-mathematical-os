## Agent Dispatch Logic

### Routing Rules

```yaml
dispatch_rules:
  # Code quality
  - trigger: "code_review"
    agents: [code-reviewer, security-reviewer]
    parallel: true

  # Build failures
  - trigger: "build_failed"
    agents:
      - path: "*.ts"
        agent: typescript-build-resolver
      - path: "*.rs"
        agent: rust-build-resolver
      - path: "*.go"
        agent: go-build-resolver
      - path: "CMakeLists.txt"
        agent: cpp-build-resolver
    parallel: true

  # Testing
  - trigger: "test_coverage_low"
    agents: [tdd-guide, e2e-runner]
    parallel: false
    order: [tdd-guide, e2e-runner]

  # Performance
  - trigger: "performance_issue"
    agents: [performance-optimizer]
    autonomy: L1

  # Security
  - trigger: "security_audit"
    agents: [security-reviewer]
    autonomy: L1
    requires_approval: true

  # Database
  - trigger: "schema_change"
    agents: [database-reviewer]
    autonomy: L1
```

