     - PENDING_VERIFICATION: Data found, awaiting confirmation
     - VERIFIED: Confirmed with supporting documents
     - EXPIRED: No longer in role

  3. Authority levels (hierarchical):
     - SOVEREIGN: Ultimate decision authority (Founder only)
     - EXECUTIVE: Can make decisions within budget/scope
     - FIDUCIARY: Legal/trust authority (trustees, protectors)
     - ADVISORY: Provide guidance (lawyers, CPAs, advisors)
     - MANAGEMENT: Operational decisions (CEO, managers)

