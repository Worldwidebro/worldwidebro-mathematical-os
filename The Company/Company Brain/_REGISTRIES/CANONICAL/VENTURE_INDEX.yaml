## Quick Lookup

| I want to find... | Use this query |
|---|---|
| A specific venture | find_venture_by_id |
| Revenue-ready ventures | find_revenue_ready_ventures |
| All logistics ventures | find_ventures_by_sector (SEC-009) |
| Ventures in planning stage | find_ventures_by_status (PLANNING) |
| Ventures under an OpCo | find_ventures_by_opco |
| Ventures needing a skill | find_ventures_needing_capability |
| Ventures assigned to an agent | find_ventures_assigned_to_agent |

