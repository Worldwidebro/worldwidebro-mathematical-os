name: VENTURE_INDEX
version: "1.0"
description: Search + discovery index for all 789 ventures — find by sector, status, revenue, opco
authority: CP-050 (Revenue & Capital)
status: ACTIVE
created: 2026-09-25
updated: 2026-09-25
base_id: B050

# VENTURE DISCOVERY INDEX
# Source of truth: Supabase (live), indexed daily
# Enables: "What ventures do we have?" / "Show me revenue-ready ventures" / "Which ventures are in logistics?"

index_structure:
  total_ventures: 789
  live_ventures: 580
  planned_ventures: 209
  indexed_attributes:
    - venture_id
    - venture_name
    - sector_id
    - status
    - revenue_stage
    - opco_id
    - revenue_ytd
    - employee_count

# VENTURE DISCOVERY QUERIES

discovery_paths:
  find_venture_by_id:
    query: "ventures_registry WHERE venture_id = 'VEN-XXX'"
    returns: "Complete venture profile (name, sector, status, revenue, team, agents)"
    source: "Supabase (authoritative)"
    base_link: "[[B050|Control Base B050]]"

  find_revenue_ready_ventures:
    query: "ventures_registry WHERE status IN ['OPERATING', 'SCALING'] AND revenue_ytd > 0"
    returns: "All active revenue-generating ventures"
    example: "OPS-001, LT-005, CALLCENTER (tier-0 ready)"
    base_link: "[[B050|Control Base B050]]"

  find_ventures_by_sector:
    query: "ventures_registry WHERE sector_id = 'SEC-XXX'"
    returns: "All ventures in a sector"
    example: "SEC-009 (Logistics) → LT-005, LT-011, LT-020, ..."
    base_link: "[[B050|Control Base B050]]"

  find_ventures_by_status:
    query: "ventures_registry WHERE status = 'VALIDATING'"
    returns: "Ventures at a specific lifecycle stage"
    statuses: ["PLANNING", "BUILDING", "VALIDATING", "OPERATING", "SCALING", "EXITING"]
    base_link: "[[B050|Control Base B050]]"

  find_ventures_by_opco:
    query: "ventures_registry WHERE opco_id = 'OPC-XXX'"
    returns: "All ventures under an operating company"
    example: "OPC-01 → 120+ ventures"
    base_link: "[[B050|Control Base B050]]"

  find_ventures_needing_capability:
    query: "ventures_registry WHERE required_capabilities CONTAINS 'CAP-XXX'"
    returns: "All ventures that need a specific capability"
    base_link: "[[B050|Control Base B050]]"

  find_ventures_assigned_to_agent:
    query: "ventures_registry WHERE assigned_agents CONTAINS 'AGT-XXX'"
    returns: "All ventures managed by an agent"
    base_link: "[[B050|Control Base B050]]"

