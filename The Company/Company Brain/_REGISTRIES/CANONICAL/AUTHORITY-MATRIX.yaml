---
name: authority-matrix
description: "Approval authority and decision thresholds"
version: "1.0"
created: "2026-09-23"
authority: "CP-001 (Enterprise)"

# This defines WHO can approve WHAT and up to what AMOUNT
# Used by agents to route decisions and verify authority
# Format:
#   decision_type:
#     description: what this decision is
#     approvers:
#       role: [list of required roles]
#       any_of: [list of alternative roles]
#       all_of: [list of required roles (all must approve)]
#     thresholds:
#       amount: approval_role

decision_authority:

  # ===== CAPITAL ALLOCATION =====
  capital_allocation:
    description: "Allocation of capital from Master Holdco to investments/OpCos"
    under_100k:
      approvers:
        role: ["ROLE-FOE-CFO"]
      required_evidence: ["Budget approval", "Project plan"]
    100k_to_500k:
      approvers:
        all_of: ["ROLE-FOE-CFO", "ROLE-FOUNDER"]
      required_evidence: ["Board memo", "Financial analysis", "Risk assessment"]
    over_500k:
      approvers:
        role: ["ROLE-FOUNDER"]
      required_evidence: ["Full board review", "Legal review", "Tax implications"]
      escalation: "Requires founder review + family office CEO briefing"

  # ===== TRUST MODIFICATIONS =====
  trust_modification:
    description: "Changes to trust documents or terms"
    beneficiary_change:
      approvers:
        all_of: ["ROLE-ATTORNEY-ESTATE", "ROLE-FOUNDER"]
      required_evidence: ["Attorney recommendation", "Legal analysis"]
      escalation: "May require beneficiary notice"
    trustee_replacement:
      approvers:
        any_of:
          - ["ROLE-TRUST-PROTECTOR", "ROLE-FOUNDER"]
          - ["ROLE-FOUNDER"] # founder alone can do this
      required_evidence: ["New trustee certification", "Bond documentation"]
    trust_terms:
      approvers:
        all_of: ["ROLE-ATTORNEY-ESTATE", "ROLE-FOUNDER"]
      required_evidence: ["Full legal review", "Tax impact analysis"]

  # ===== PROPERTY TRANSACTIONS =====
  property_acquisition:
    description: "Purchase of new real estate"
    approvers:
      all_of: ["ROLE-ATTORNEY-RE", "ROLE-FOE-CFO"]
    required_evidence: ["Title search", "Appraisal", "Environmental review"]
    escalation: "Over $1M requires founder approval"
    founder_threshold: 1000000

  property_sale:
    description: "Sale of real estate"
    approvers:
      all_of: ["ROLE-ATTORNEY-RE", "ROLE-FOUNDER"]
    required_evidence: ["Market analysis", "Tax implication review", "Buyer creditworthiness"]

  property_renovation:
    description: "Major capital project on property"
    under_100k:
      approvers:
        role: ["ROLE-PROPERTY-MANAGER"]
      required_evidence: ["Contractor bids", "Scope of work"]
    100k_to_500k:
      approvers:
        all_of: ["ROLE-DEVELOPER", "ROLE-FOE-CFO"]
      required_evidence: ["Architect plans", "Budget", "Timeline"]
    over_500k:
      approvers:
        all_of: ["ROLE-DEVELOPER", "ROLE-FOE-CFO", "ROLE-FOUNDER"]
      required_evidence: ["Full project review", "Risk assessment", "Return on investment"]

  # ===== CONTRACTS =====
  contract_approval:
    description: "Approval of significant contracts"
    under_100k:
      approvers:
        role: ["ROLE-ATTORNEY-CORPORATE"]
      required_evidence: ["Legal review"]
    100k_to_500k:
      approvers:
        all_of: ["ROLE-ATTORNEY-CORPORATE", "ROLE-FOE-CEO"]
      required_evidence: ["Legal review", "Business justification", "Terms negotiation"]
    over_500k:
      approvers:
        all_of: ["ROLE-ATTORNEY-CORPORATE", "ROLE-FOE-CEO", "ROLE-FOUNDER"]
      required_evidence: ["Full review", "Strategic impact"]
    vendor_relationship:
      approvers:
        all_of: ["ROLE-ATTORNEY-CORPORATE", "ROLE-FOE-COO"]
      required_evidence: ["Vendor background check", "Reference verification"]

  # ===== DEBT & BORROWING =====
  debt_decision:
    description: "New debt or line of credit"
    under_250k:
      approvers:
        role: ["ROLE-FOE-CFO"]
      required_evidence: ["Debt schedule", "Repayment plan"]
    250k_to_1m:
      approvers:
        all_of: ["ROLE-FOE-CFO", "ROLE-BANKER"]
      required_evidence: ["Loan proposal", "Underwriting", "Financial projections"]
    over_1m:
      approvers:
        all_of: ["ROLE-FOE-CFO", "ROLE-FOUNDER"]
      required_evidence: ["Full loan review", "Board approval", "Strategic rationale"]

  # ===== TAX DECISIONS =====
  tax_planning:
    description: "Major tax planning decisions"
    annual_strategy:
      approvers:
        all_of: ["ROLE-TAX-ADVISOR", "ROLE-FOE-CFO"]
      required_evidence: ["Tax projection", "Strategy memo"]
    significant_transaction:
      approvers:
        all_of: ["ROLE-TAX-ADVISOR", "ROLE-FOE-CFO", "ROLE-FOUNDER"]
      required_evidence: ["Tax impact analysis", "Alternative structures", "Recommendation"]

  # ===== INSURANCE & RISK =====
  insurance_decision:
    description: "Insurance coverage and policies"
    coverage_change:
      approvers:
        all_of: ["ROLE-INSURANCE-BROKER", "ROLE-FOE-CFO"]
      required_evidence: ["Coverage analysis", "Premium comparison"]
    new_policy:
      approvers:
        role: ["ROLE-INSURANCE-BROKER"]
      required_evidence: ["Risk assessment", "Policy details"]
    high_value_coverage:
      approvers:
        all_of: ["ROLE-INSURANCE-BROKER", "ROLE-FOUNDER"]
      required_evidence: ["Full risk review", "Strategic importance"]

  # ===== VENTURE OPERATIONS =====
  venture_capex:
    description: "Capital expenditure for operating venture"
    under_50k:
      approvers:
        role: ["ROLE-VENTURE-CEO"]
      required_evidence: ["Budget justification"]
    50k_to_250k:
      approvers:
        all_of: ["ROLE-VENTURE-CEO", "ROLE-FOE-CFO"]
      required_evidence: ["Business case", "ROI analysis"]
    over_250k:
      approvers:
        all_of: ["ROLE-VENTURE-CEO", "ROLE-FOE-CFO", "ROLE-FOUNDER"]
      required_evidence: ["Strategic review", "OpCo board approval"]

  venture_hiring:
    description: "Hiring at operating venture"
    standard_role:
      approvers:
        role: ["ROLE-VENTURE-CEO"]
      required_evidence: ["Job description", "Budget approval"]
    executive_hire:
      approvers:
        all_of: ["ROLE-VENTURE-CEO", "ROLE-FOE-COO"]
      required_evidence: ["Background check", "Reference verification", "Compensation approval"]

  # ===== BENEFICIARY DISTRIBUTIONS =====
  trust_distribution:
    description: "Distribution from Family Trust to beneficiaries"
    routine_distribution:
      approvers:
        role: ["ROLE-TRUSTEE-PRIMARY"]
      required_evidence: ["Trust authorization", "Tax documentation"]
      threshold: 100000
    discretionary_large:
      approvers:
        all_of: ["ROLE-TRUSTEE-PRIMARY", "ROLE-TRUST-PROTECTOR"]
      required_evidence: ["Trustee discretion memo", "Beneficiary need documentation"]
    change_in_distribution:
      approvers:
        all_of: ["ROLE-ATTORNEY-ESTATE", "ROLE-TRUSTEE-PRIMARY"]
      required_evidence: ["Legal amendment", "Tax implications"]

  # ===== PERSONNEL & COMPENSATION =====
  family_office_hire:
    description: "Hiring for family office positions"
    standard_hire:
      approvers:
        role: ["ROLE-FOE-COO"]
      required_evidence: ["Job description", "Salary approval"]
    executive_hire:
      approvers:
        all_of: ["ROLE-FOE-COO", "ROLE-FOE-CEO"]
      required_evidence: ["Background check", "Board approval if required"]
    cfo_or_ceo:
      approvers:
        role: ["ROLE-FOUNDER"]
      required_evidence: ["Search process", "Board recommendation", "Compensation package"]

  compensation_change:
    description: "Salary or bonus changes"
    standard_adjustment:
      approvers:
        role: ["ROLE-FOE-COO"]
      required_evidence: ["Performance review", "Market data"]
    executive_adjustment:
      approvers:
        all_of: ["ROLE-FOE-COO", "ROLE-FOE-CFO"]
      required_evidence: ["Board memo", "Budget impact"]
    c_suite_change:
      approvers:
        role: ["ROLE-FOUNDER"]
      required_evidence: ["Full review", "Compensation committee approval if applicable"]

# ===== ESCALATION RULES =====
escalation:
  rule_1: "Any decision requiring founder approval cannot be delegated"
  rule_2: "Any decision over $500K requires founder review"
  rule_3: "Any legal/fiduciary decision requires attorney review"
  rule_4: "Any tax-affecting decision requires CPA review"
  rule_5: "Trust modifications always require both trustee and attorney"
  rule_6: "Property transactions always require real estate attorney"
  rule_7: "Decisions affecting two or more Bases require orchestrator review"

# ===== CONFLICT RESOLUTION =====
conflicts:
  multiple_approvers: "If multiple roles required, ALL must approve (AND logic)"
  any_of: "If any_of is specified, ONE role from list must approve (OR logic)"
  sequential: "Some decisions may require sequential approval (e.g., attorney first, then CFO)"

# ===== EXCEPTION PROCESS =====
exceptions:
  description: "How to handle exceptions to normal approval"
  urgent_decision:
    approval_path: "Founder + highest relevant role"
    documentation: "Must document urgency + rationale"
    followup: "Full board review within 30 days"
  unable_to_reach_approver:
    approval_path: "Escalate to next role up"
    documentation: "Must document attempts to reach primary approver"
    timeline: "Decision cannot be delayed >5 business days

approval_limits:
  ROLE-FOUNDER:
    capital_allocation: "UNLIMITED"
    trust_modifications: "UNLIMITED"
    major_strategy: "UNLIMITED"

  ROLE-FOE-CFO:
    capital_allocation: "$500,000"
    operating_expenses: "$100,000"
    debt_approval: "$1,000,000"

  ROLE-FOE-CEO:
    operating_budget: "$100,000"
    vendor_contracts: "$100,000"
    staffing_budget: "$50,000"

  ROLE-VENTURE-CEO:
    operating_expenses: "$50,000"
    capex: "$100,000"
    hiring_budget: "$25,000"

  ROLE-PROPERTY-MANAGER:
    maintenance: "$25,000"
    routine_repairs: "$10,000"

  ROLE-TRUSTEE-PRIMARY:
    distributions: "$100,000"
    routine_disbursements: "$25,000"

notes: |
  CRITICAL CONTEXT:

  1. All thresholds in USD and should be reviewed annually
  2. Thresholds can be updated by CP-001 (Enterprise Control Plane)
  3. Joint approval (all_of) means ALL parties must sign off
  4. Alternative approval (any_of) means ONE party can approve
  5. Decisions above founder threshold always require founder review
  6. No delegation allowed for fiduciary/legal decisions
  7. This matrix feeds into agent routing logic for decision escalation

  USAGE FOR AGENTS:

  Agent decision flow:
    1. Identify decision type (capital allocation, contract, etc.)
    2. Identify amount
    3. Look up approval requirements
    4. Query PEOPLE-REGISTRY to find assigned people for those roles
    5. Route for approval + log decision
    6. If no one assigned to required role → Flag as GAP
