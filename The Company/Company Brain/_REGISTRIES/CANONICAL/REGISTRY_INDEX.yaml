**To Add New Registry:**

1. Create file in `_REGISTRIES/CANONICAL/`
2. Add to META-REGISTRY.yaml
3. Add to REGISTRY-DEPENDENCIES.yaml (if has feeds)
4. Add to REGISTRY_INDEX.yaml (this file)
5. Create corresponding index if needed
6. Update relevant Bases via wiki links
