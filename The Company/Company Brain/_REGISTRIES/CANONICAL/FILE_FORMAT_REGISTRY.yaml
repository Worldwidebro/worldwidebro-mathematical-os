## 2. CONVERSION DECISION TREE

```yaml
CONVERSION_ALGORITHM:
  input: "<file_format>"
  desired_output: "<target_format>"

  decision_tree:
    - step_1_check_canonical: "Is input already canonical for its class?"
      if_yes: "Stop. File is optimal."
      if_no: "Proceed to step 2."

    - step_2_find_path: "Look up conversion path in registry above."
      if_found: "Proceed to step 3."
      if_not_found: "Proceed to step 4 (fallback)."

    - step_3_select_engine: "Choose engine by priority:"
      priority:
        - 1_local_free: "FFmpeg, ImageMagick, Pandoc, LibreOffice, DuckDB, Tesseract (free, local, private)"
        - 2_local_paid: "Expensive licenses (rarely used for conversion)"
        - 3_cloud_safe: "CloudConvert, Zamzar (for formats unavailable locally)"
        - 4_cloud_risky: "Last resort (file uploaded, privacy risk)"

    - step_4_fallback: "No known conversion path:"
      option_a: "Check CloudConvert or Zamzar catalogs."
      option_b: "If sensitive data, find local equivalent."
      option_c: "If no solution, document blocker in [[KILL-LIST|KILL-LIST.md]]."
```

