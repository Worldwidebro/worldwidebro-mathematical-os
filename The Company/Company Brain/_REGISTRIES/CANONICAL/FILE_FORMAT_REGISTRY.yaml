## 9. UPDATING THIS REGISTRY

**When to add a new format:**

1. A new `.extension` is requested
2. No local engine solution exists
3. Document in this registry under the appropriate class
4. Test conversion locally first; only add cloud option if necessary
5. Update [[STARTHERE|STARTHERE.md]] reference count
6. Link from relevant venture/domain README

