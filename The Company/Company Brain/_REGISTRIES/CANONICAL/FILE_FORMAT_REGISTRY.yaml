## 6. QUALITY ASSURANCE

After conversion:

```yaml
QA_STEPS:
  - "1. File size reasonable? (not 0 bytes, not 10x original)"
  - "2. Content spot-check: Random page/section readable?"
  - "3. Metadata preserved? (timestamps, author, version)"
  - "4. Encoding correct? (UTF-8 for text, proper color space for images)"
  - "5. For sensitive data: Ensure no leakage in headers/metadata."
```

