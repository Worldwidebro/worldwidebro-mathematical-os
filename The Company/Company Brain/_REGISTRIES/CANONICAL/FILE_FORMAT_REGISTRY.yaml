## 5. COST CALCULATION

```yaml
COST_PER_CONVERSION:
  local_free: $0.00
  local_expensive_license: $10-1000 (one-time or annual)
  cloud_pay_per_use: $0.25-1.00 per file
  cloud_subscription: $5-50/month

RECOMMENDATION:
  - "For <100 files/month: Use free local engines."
  - "For 100-1000 files/month: Invest in automation (scripts)."
  - "For >1000 files/month: Consider batch license or API."
```

