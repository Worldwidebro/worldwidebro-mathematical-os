## 8. WORKFLOW EXAMPLES

### Example 1: Ingest PDF Contract → Knowledge Graph

```
contract.pdf (scanned)
    ↓
OCRmyPDF (local, free)
    ↓
contract_searchable.pdf
    ↓
pdftotext (local, free)
    ↓
contract.txt
    ↓
Manual markup → contract.md
    ↓
Ingest to Qdrant + Neo4j
```

**Privacy:** TIER_1 (never cloud)
**Time:** ~5 minutes
**Cost:** $0.00

---

### Example 2: Batch Convert 500 PNGs → WebP

```
*.png (500 files, directory)
    ↓
ImageMagick batch (local, free)
    ↓
for f in *.png; do convert "$f" "${f%.png}.webp"; done
    ↓
*.webp (500 files, ~60% size reduction)
```

**Privacy:** TIER_2 (no sensitive data)
**Time:** ~10 minutes
**Cost:** $0.00

---

### Example 3: Convert Excel Report → Markdown Docs

```
quarterly_report.xlsx
    ↓
LibreOffice headless (local, free)
    ↓
quarterly_report.csv
    ↓
DuckDB + Python script (local, free)
    ↓
quarterly_report.json
    ↓
Pandoc → quarterly_report.md
    ↓
Markdown ingested to Obsidian + Neo4j
```

**Privacy:** TIER_2
**Time:** ~3 minutes
**Cost:** $0.00

