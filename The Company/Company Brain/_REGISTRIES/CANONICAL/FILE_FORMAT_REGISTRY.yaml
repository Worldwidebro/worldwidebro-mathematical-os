## 3. ENGINE REFERENCE

Each engine listed below with preferred command, cost, and privacy model:

### LOCAL ENGINES (RECOMMENDED)

| Engine | Formats | Install | Cost | Privacy | Speed |
|--------|---------|---------|------|---------|-------|
| **Pandoc** | `.md`, `.docx`, `.html`, `.latex`, `.epub`, `.rst` | `brew install pandoc` | FREE | LOCAL | Fast |
| **LibreOffice** | `.xlsx`, `.docx`, `.pptx`, `.odt`, `.pdf` | `brew install libreoffice` | FREE | LOCAL | Medium |
| **FFmpeg** | `.mp4`, `.mov`, `.webm`, `.mkv`, `.mp3`, `.wav`, `.aac` | `brew install ffmpeg` | FREE | LOCAL | Medium/Slow |
| **ImageMagick** | `.png`, `.jpg`, `.webp`, `.gif`, `.svg`, `.tiff`, `.bmp` | `brew install imagemagick` | FREE | LOCAL | Fast |
| **DuckDB** | `.csv`, `.xlsx`, `.json`, `.jsonl`, `.parquet` | `brew install duckdb` | FREE | LOCAL | Fast |
| **Tesseract** | `.png`, `.jpg`, `.tiff`, `.pdf` (text extraction) | `brew install tesseract` | FREE | LOCAL | Slow |
| **OCRmyPDF** | `.pdf` (scanned → searchable) | `pip install ocrmypdf` | FREE | LOCAL | Slow |
| **Calibre** | `.epub`, `.mobi`, `.pdf`, `.docx` (ebooks) | `brew install calibre` | FREE | LOCAL | Medium |
| **wkhtmltopdf** | `.html` → `.pdf` | `brew install --cask wkhtmltopdf` | FREE | LOCAL | Medium |
| **FreeCAD** | `.step`, `.stp`, `.iges`, `.stl`, `.obj` (CAD) | `brew install freecad` | FREE | LOCAL | Slow |

### CLOUD ENGINES (FALLBACK)

| Service | Formats | Cost | Privacy | Use Case |
|---------|---------|------|---------|----------|
| **CloudConvert** | 200+ formats | $0.25/min (pay-as-you-go) | Cloud upload | Rare/complex formats |
| **Zamzar** | 1,100+ formats | $0.29-1.00/file | Cloud upload | Obscure legacy formats |
| **Convertio** | 300+ formats | Free tier available | Cloud upload | Lightweight conversions |
| **Smallpdf** | PDF-focused | Free tier limited | Cloud upload | PDF workflows |
| **iLovePDF** | PDF-focused | Free tier limited | Cloud upload | PDF workflows |

