## 4. PRIVACY TIER SYSTEM

**Decide based on data sensitivity:**

```yaml
TIER_1_ALWAYS_LOCAL:
  - contracts
  - financial_records
  - customer_data
  - source_code
  - credentials
  - pii
  action: "Use local engines only. Never cloud upload."

TIER_2_PREFER_LOCAL:
  - business_documents
  - internal_research
  - drafts
  - designs
  action: "Use local if available. Cloud OK if time-critical."

TIER_3_CLOUD_OK:
  - public_content
  - published_materials
  - non-sensitive_images
  - generic_media
  action: "Cloud services acceptable."
```

