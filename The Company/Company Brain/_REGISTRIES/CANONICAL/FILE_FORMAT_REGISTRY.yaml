# FILE FORMAT REGISTRY — Canonical Format Decisions

**Purpose:** Single source of truth for file format selection, conversion paths, engine preference, and cost/privacy trade-offs.

**Authority:** [[STARTHERE|CP-027 Infrastructure Control Plane]]

---

## 1. CANONICAL FORMATS (PRIMARY)

Each information class has ONE default format:

```yaml
DOCUMENTATION:
  canonical: .md
  final: .pdf
  editable: .md
  rationale: "Git-friendly, version-controllable, universal."
  conversions:
    - from: .docx
      engine: pandoc
      command: "pandoc input.docx -o output.md"
      cost: free
      privacy: local
    - from: .html
      engine: pandoc
      command: "pandoc input.html -o output.md"
      cost: free
      privacy: local

SPREADSHEET_DATA:
  canonical: .xlsx
  exchange: .csv
  rationale: "Human-editable, versioned, discoverable."
  conversions:
    - from: .csv
      engine: libreoffice
      command: "libreoffice --headless --convert-to xlsx input.csv"
      cost: free
      privacy: local
    - from: .json
      engine: duckdb
      command: "duckdb 'COPY (SELECT * FROM read_json(\"input.json\")) TO \"output.csv\" (FORMAT CSV);'"
      cost: free
      privacy: local

STRUCTURED_DATA:
  canonical: .json
  alternatives:
    large_datasets: .jsonl
    analytics: .parquet
    config: .yaml
  rationale: "API-native, agent-friendly."
  conversions:
    - from: .yaml
      engine: python
      command: "python -c 'import yaml,json; json.dump(yaml.safe_load(open(\"input.yaml\")),open(\"output.json\",\"w\"))'"
      cost: free
      privacy: local
    - from: .csv
      engine: duckdb
      command: "duckdb 'COPY (SELECT * FROM read_csv(\"input.csv\")) TO \"output.json\" (FORMAT JSON);'"
      cost: free
      privacy: local

CONFIGURATION:
  canonical: .yaml
  alternatives:
    secrets: bitwarden
    env: .env
  rationale: "Human-readable, diff-friendly."
  conversions:
    - from: .json
      engine: python
      command: "python -c 'import json,yaml; yaml.dump(json.load(open(\"input.json\")),open(\"output.yaml\",\"w\"))'"
      cost: free
      privacy: local

DATABASE:
  canonical: .sql
  runtime: PostgreSQL
  alternatives:
    migrations: .sql
    queries: .sql
  rationale: "Portable, versioned, standard."
  conversions:
    - from: .xlsx
      engine: duckdb
      command: "duckdb 'INSERT INTO table SELECT * FROM read_excel(\"input.xlsx\");'"
      cost: free
      privacy: local

LARGE_ANALYTICS:
  canonical: .parquet
  rationale: "Columnar, compressed, ML-friendly."
  conversions:
    - from: .csv
      engine: duckdb
      command: "duckdb 'COPY (SELECT * FROM read_csv(\"input.csv\")) TO \"output.parquet\";'"
      cost: free
      privacy: local
    - from: .xlsx
      engine: duckdb
      command: "duckdb 'COPY (SELECT * FROM read_excel(\"input.xlsx\")) TO \"output.parquet\";'"
      cost: free
      privacy: local

IMAGE:
  canonical: .png
  alternatives:
    photo: .jpg
    web: .webp
    icon_logo: .svg
    archive: .tiff
  rationale: "Screenshots default PNG; photos JPEG; vectors SVG."
  conversions:
    - from: .jpg
      engine: imagemagick
      command: "convert input.jpg output.png"
      cost: free
      privacy: local
    - from: .webp
      engine: imagemagick
      command: "convert input.webp output.png"
      cost: free
      privacy: local
    - from: .svg
      engine: imagemagick
      command: "convert -background white input.svg output.png"
      cost: free
      privacy: local

VIDEO:
  canonical: .mp4
  alternatives:
    editing: .mov
    streaming: .webm
    archive: .mkv
  rationale: "MP4 universally compatible; MOV for pro workflows."
  conversions:
    - from: .mov
      engine: ffmpeg
      command: "ffmpeg -i input.mov -c:v h264 -c:a aac output.mp4"
      cost: free
      privacy: local
    - from: .mkv
      engine: ffmpeg
      command: "ffmpeg -i input.mkv -c:v h264 -c:a aac output.mp4"
      cost: free
      privacy: local
    - from: .avi
      engine: ffmpeg
      command: "ffmpeg -i input.avi -c:v h264 -c:a aac output.mp4"
      cost: free
      privacy: local
    - to_gif:
      engine: ffmpeg
      command: "ffmpeg -i input.mp4 -vf 'scale=480:-1' -r 10 output.gif"
      cost: free
      privacy: local

AUDIO:
  canonical: .wav
  alternatives:
    distribution: .mp3
    lossless: .flac
    voice: .opus
  rationale: "WAV for master; MP3 for distribution; OPUS for streaming."
  conversions:
    - from: .mp3
      engine: ffmpeg
      command: "ffmpeg -i input.mp3 -c:a pcm_s16le output.wav"
      cost: free
      privacy: local
    - from: .m4a
      engine: ffmpeg
      command: "ffmpeg -i input.m4a -c:a pcm_s16le output.wav"
      cost: free
      privacy: local
    - from: .ogg
      engine: ffmpeg
      command: "ffmpeg -i input.ogg -c:a pcm_s16le output.wav"
      cost: free
      privacy: local

DOCUMENT:
  canonical: .md
  final_print: .pdf
  editable: .docx
  web: .html
  rationale: "Markdown primary; DOCX for collaboration; PDF for finalization."
  conversions:
    - from: .docx
      to: .md
      engine: pandoc
      command: "pandoc input.docx -t markdown -o output.md"
      cost: free
      privacy: local
    - from: .md
      to: .pdf
      engine: pandoc
      command: "pandoc input.md -o output.pdf"
      cost: free
      privacy: local
    - from: .md
      to: .docx
      engine: pandoc
      command: "pandoc input.md -t docx -o output.docx"
      cost: free
      privacy: local
    - from: .md
      to: .html
      engine: pandoc
      command: "pandoc input.md -t html -o output.html"
      cost: free
      privacy: local
    - from: .html
      to: .pdf
      engine: wkhtmltopdf
      command: "wkhtmltopdf input.html output.pdf"
      cost: free
      privacy: local

EBOOK:
  canonical: .epub
  alternatives:
    kindle: .mobi
    pdf_fallback: .pdf
  rationale: "EPUB is reflowable standard; MOBI for Kindle."
  conversions:
    - from: .pdf
      engine: calibre
      command: "ebook-convert input.pdf output.epub"
      cost: free
      privacy: local
    - from: .docx
      engine: calibre
      command: "ebook-convert input.docx output.epub"
      cost: free
      privacy: local
    - from: .html
      engine: calibre
      command: "ebook-convert input.html output.epub"
      cost: free
      privacy: local

ARCHIVE:
  canonical: .zip
  alternatives:
    compression: .7z
    unix: .tar.gz
  rationale: "ZIP for cross-platform; TAR.GZ for unix; 7Z for max compression."
  conversions:
    - format_agnostic: "Both .zip and .tar.gz unzip identically; prefer .zip for user-facing archives."

OCR_SCANNED:
  source: .pdf (scanned)
  canonical: .pdf (searchable)
  extraction: .md or .json
  rationale: "Extract text from scanned PDFs, make searchable, ingest to knowledge graph."
  conversions:
    - from: .pdf (scanned)
      engine: ocrmypdf
      command: "ocrmypdf input.pdf output.pdf"
      cost: free
      privacy: local
    - from: .pdf (searchable)
      to: .txt
      engine: pdftotext
      command: "pdftotext input.pdf output.txt"
      cost: free
      privacy: local
    - from: .png/.jpg (image)
      to: .txt
      engine: tesseract
      command: "tesseract input.png output"
      cost: free
      privacy: local
    - from: .txt
      to: .md
      engine: manual_markup
      command: "Add markdown headers, formatting, and context."
      cost: manual
      privacy: local

CAD_3D:
  canonical: .step
  alternatives:
    interchange: .fbx
    print: .stl
    archive: .blend
  rationale: "STEP is industry standard; FBX for interchange; STL for 3D printing."
  conversions:
    - from: .obj
      engine: freecad
      command: "freecad --convert-fcstd input.obj output.step"
      cost: free
      privacy: local
    - from: .dwg
      engine: freecad
      command: "freecad --convert-fcstd input.dwg output.step"
      cost: free
      privacy: local
```

