## Enforcement Rules

**Neo4j Constraints:**
```cypher
CREATE CONSTRAINT venture_status_enum
  FOR (v:Entity:Venture)
  REQUIRE v.lifecycle_state IN ['PLANNING', 'BUILDING', 'VALIDATING', 'OPERATING', 'SCALING', 'PAUSED', 'EXITING']

CREATE CONSTRAINT agent_status_enum
  FOR (a:Entity:Agent)
  REQUIRE a.status IN ['AVAILABLE', 'ASSIGNED', 'EXECUTING', 'PAUSED', 'COMPLETED', 'FAILED', 'RETIRED']

-- (Similar constraints for all entity types)
```

**Git Hook Validation:**
```bash
# Pre-commit linter checks:
if grep -r "status.*=.*['\"]invalid['\"]" *.yaml; then
  echo "ERROR: Invalid status value detected"
  exit 1
fi
```

## Usage Examples

```yaml
# Venture status
venture:
  venture_id: VEN-005
  name: "LT-005 Courier"
  lifecycle_state: "OPERATING"  # Must be from venture enum

# Agent status
agent:
  agent_id: AGT-100
  name: "Venture Manager"
  status: "AVAILABLE"  # Must be from agent enum

# Task status
task:
  task_id: TSK-001
  workflow_id: WFL-005
  status: "EXECUTING"  # Must be from task enum
```

**Transitions:** All state changes must follow transition rules — unauthorized transitions are blocked by workflow logic.

