# Deployment Checklist (Add Scenarios Here)

## To Deploy New Scenario:
1. Create in Make.com UI (or via MCP scenarios_create)
2. Note the Make scenario ID
3. Add entry to this registry with:
   - ref_id: SCN-{6-digit counter}
   - make_id: {Make scenario ID}
   - venture_id: {venture code}
   - All metadata fields (purpose, modules, dependencies, revenue model)
4. Commit to git with venture ID in message
5. Update MAKE-MCP-PROCEDURES.md with scenario ID
6. Test first execution and log results

## Status Codes:
- active: Running on schedule, no issues
- inactive: Disabled (manual or error)
- testing: Pilot run, monitoring for issues
- pending_auth: Waiting for app credentials
- error: Last execution failed

