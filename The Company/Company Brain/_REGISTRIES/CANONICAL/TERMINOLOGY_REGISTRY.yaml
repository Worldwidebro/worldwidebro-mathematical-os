**Application Rules:**

1. **Code Replacement:** Replace all variants with canonical form in codebase
2. **Neo4j Queries:** Use canonical names in Cypher queries
3. **Documentation:** Use canonical forms in all docs (MD, YAML)
4. **Git Hook:** Pre-commit linter enforces canonical terminology
5. **Database:** All entity properties use canonical snake_case

**Example Enforcement:**

```bash
# WRONG — uses variant
MATCH (v:Venture) WHERE v.status = "deploy"

# RIGHT — uses canonical
MATCH (v:Entity:Venture) WHERE v.lifecycle_state = "DEPLOYED"
```

**Mapping to Bases:**
- All terminology owned by B001 (Sovereign)
- Sub-terms managed by domain-specific Bases:
  - Agent terminology → B027 (Orchestration)
  - Capital terminology → B050 (Revenue & Capital)
  - Deployment terminology → B027 (Infrastructure)
