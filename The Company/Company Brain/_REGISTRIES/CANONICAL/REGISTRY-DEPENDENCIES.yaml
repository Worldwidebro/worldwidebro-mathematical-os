**Critical Dependency Chains:**

1. **CONTROL_BASES_REGISTRY is the hub** — changes here ripple to all other registries
2. **VENTURES_REGISTRY is live (Supabase)** — primary source of truth for venture data
3. **TERMINOLOGY_REGISTRY is a blocker** — must exist before any other changes

**Data Quality Principles:**

1. **Authoritative Source Rule:** Each registry has exactly ONE source of truth
2. **No Circular Dependencies:** All feeds form DAG (directed acyclic graph), no cycles
3. **Freshness Guarantees:** Each feed has explicit frequency (daily/weekly/monthly/quarterly)
4. **Change Propagation:** When source registry updates, all downstream registries must be re-derived

**Example Cascade (VENTURES_REGISTRY changes):**

```
VENTURES_REGISTRY updates (Supabase live)
  ↓
CONTROL_BASES_REGISTRY re-derives (ventures in base)
  ↓
BUSINESS-METRIC_REGISTRY updates (base health metrics)
  ↓
REVENUE_EVIDENCE_REGISTRY updates (revenue attribution)
  ↓ (observed in Neo4j after 24h SLA)
```

**To Add a New Registry:**

1. Define it in META-REGISTRY.yaml
2. Add its dependencies here
3. Specify source of truth
4. Enforce freshness SLA
5. Wire to Base via base_link
6. Test upstream cascades
