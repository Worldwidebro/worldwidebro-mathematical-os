---
name: role-requirements
description: "What each role requires: credentials, documents, access, training, workflows"
version: "1.0"
created: "2026-09-23"
authority: "CP-027 (Infrastructure) + CP-001 (Enterprise)"

# This defines what Company Brain needs from a person/agent BEFORE they can be activated in a role
# Maps to ROLES-REGISTRY.yaml (role definitions)
# Feeds into ONBOARDING-TEMPLATES.yaml (automated onboarding packages)
# Produces: Person/Agent → Requirements → Checklist → Evidence → Activated

role_requirements:

  # ===== FAMILY & GOVERNANCE =====
  ROLE-FOUNDER:
    description: "Ultimate decision authority"
    requires_credential: false
    identity_requirements:
      - legal_name
      - personal_identification
      - contact_information
    documents_required:
      - trust_documents
      - will
      - articles_of_organization
      - board_resolutions
    systems_access:
      - company_brain
      - supabase_admin
      - neo4j_admin
      - email_system
      - approval_system
    workflows:
      - all_high_level_decisions
      - capital_allocation_approval
      - trust_modifications
      - succession_planning
    approval_limits:
      capital_allocation: "UNLIMITED"
      trust_changes: "UNLIMITED"
      entity_creation: "UNLIMITED"
    training_required:
      - company_brain_overview
      - approval_authority
      - decision_tracking
    evidence_to_produce:
      - documented_decisions
      - approval_signatures
      - strategy_memos
    onboarding_days: 3

  ROLE-TRUSTEE-PRIMARY:
    description: "Manages trust assets"
    requires_credential: true
    credential_type: "Trustee Certification"
    identity_requirements:
      - legal_name
      - personal_identification
      - contact_information
      - background_check
    documents_required:
      - trustee_certification
      - trust_agreement_copy
      - bond_documentation
      - conflict_of_interest_form
      - beneficiary_information
    systems_access:
      - company_brain
      - supabase_fiduciary
      - estate_accounting
      - document_system
      - distribution_tracking
    workflows:
      - trust_administration
      - beneficiary_distributions
      - investment_oversight
      - annual_reporting
    approval_limits:
      distributions: "$100,000"
      investment_changes: "Within IPS"
      annual_distributions: "Per trust terms"
    training_required:
      - trust_administration_101
      - fiduciary_duties
      - company_brain_trustee_module
      - distribution_workflows
    evidence_to_produce:
      - trustee_resolutions
      - distribution_documentation
      - annual_accounting
      - beneficiary_communications
    onboarding_days: 5

  # ===== FAMILY OFFICE EXECUTIVES =====
  ROLE-FOE-CFO:
    description: "Family office financial oversight"
    requires_credential: false
    preferred_credential: "CPA"
    identity_requirements:
      - legal_name
      - personal_identification
      - contact_information
      - background_check
      - employment_verification
    documents_required:
      - employment_agreement
      - role_description
      - board_resolution
      - resume_cv
      - certificate_of_good_standing
      - e_and_o_insurance
    systems_access:
      - company_brain
      - supabase_financial
      - neo4j_query
      - accounting_platform
      - banking_access
      - treasury_dashboard
      - reporting_system
    workflows:
      - monthly_close
      - financial_reporting
      - capital_allocation
      - budget_review
      - cash_management
      - tax_planning
    approval_limits:
      capital_allocation: "$500,000"
      operating_expenses: "$100,000"
      debt_approval: "$1,000,000"
      vendor_contracts: "$100,000"
    training_required:
      - company_brain_finance_module
      - approval_authority_limits
      - reporting_requirements
      - compliance_framework
    evidence_to_produce:
      - monthly_financial_statements
      - capital_allocation_memos
      - budget_variance_reports
      - forecasts
      - tax_memos
    onboarding_days: 5

  # ===== LEGAL & PROFESSIONAL ADVISORS =====
  ROLE-ATTORNEY-ESTATE:
    description: "Estate planning legal authority"
    requires_credential: true
    credential_type: "Bar License"
    identity_requirements:
      - legal_name
      - personal_identification
      - bar_license_verification
      - e_and_o_insurance
    documents_required:
      - bar_license_copy
      - firm_credentials
      - e_and_o_insurance_certificate
      - engagement_letter
      - conflict_of_interest_form
    systems_access:
      - company_brain
      - document_system
      - supabase_legal
      - email_system
    workflows:
      - trust_administration
      - estate_planning
      - beneficiary_modifications
      - succession_planning
      - legal_compliance
    approval_limits:
      required_for_approval: ["trust_changes", "beneficiary_mods", "succession_plans"]
      veto_power: true
    training_required:
      - company_brain_legal_module
      - estate_planning_workflows
      - approval_authority
    evidence_to_produce:
      - legal_opinions
      - document_drafts
      - compliance_memos
      - board_resolutions
    onboarding_days: 2

  ROLE-TAX-ADVISOR:
    description: "Tax strategy and compliance"
    requires_credential: true
    credential_type: "CPA"
    identity_requirements:
      - legal_name
      - personal_identification
      - cpa_license_verification
      - e_and_o_insurance
    documents_required:
      - cpa_license_copy
      - firm_credentials
      - e_and_o_insurance_certificate
      - engagement_letter
    systems_access:
      - company_brain
      - document_system
      - supabase_financial
      - tax_research_tools
      - email_system
    workflows:
      - annual_tax_planning
      - return_preparation
      - entity_tax_structure
      - transaction_tax_impact
    approval_limits:
      required_for_approval: ["tax_strategy", "transaction_impact", "return_filing"]
      advisory_veto: true
    training_required:
      - company_brain_tax_module
      - tax_workflows
      - entity_structures
    evidence_to_produce:
      - tax_memos
      - return_drafts
      - strategic_recommendations
      - impact_analysis
    onboarding_days: 2

  # ===== VENTURE OPERATIONS =====
  ROLE-VENTURE-CEO:
    description: "Venture/company chief executive"
    requires_credential: false
    identity_requirements:
      - legal_name
      - personal_identification
      - contact_information
      - background_check
    documents_required:
      - appointment_letter
      - resume_cv
      - background_check
      - founders_agreement
      - equity_documentation
    systems_access:
      - company_brain
      - supabase_venture
      - github_access
      - vercel_access
      - banking_venture
      - operational_tools
      - slack_workspace
    workflows:
      - operations_management
      - financial_reporting
      - hiring_decisions
      - vendor_management
      - product_development
      - revenue_tracking
    approval_limits:
      operating_expenses: "$50,000"
      capex: "$100,000"
      hiring_budget: "$25,000"
      cannot_approve: ["major_capital", "ownership_changes"]
    training_required:
      - company_brain_venture_module
      - reporting_requirements
      - approval_authority
      - operational_workflows
    evidence_to_produce:
      - monthly_metrics
      - financial_reports
      - team_updates
      - strategic_memos
    onboarding_days: 3

  # ===== REAL ESTATE =====
  ROLE-PROPERTY-MANAGER:
    description: "Property day-to-day operations"
    requires_credential: false
    preferred_credential: "Property Management License"
    identity_requirements:
      - legal_name
      - personal_identification
      - contact_information
      - background_check
    documents_required:
      - management_agreement
      - license_if_applicable
      - background_check
      - insurance_certificate
      - emergency_contact
      - vendor_references
    systems_access:
      - company_brain
      - property_database
      - tenant_management
      - maintenance_tracking
      - email_system
      - reporting_dashboard
    workflows:
      - rent_collection
      - maintenance_coordination
      - tenant_communication
      - inspections
      - vendor_management
      - monthly_reporting
    approval_limits:
      maintenance: "$25,000"
      routine_repairs: "$10,000"
      tenant_leases: "Within parameters"
    training_required:
      - company_brain_property_module
      - maintenance_workflows
      - reporting_requirements
      - tenant_management
    evidence_to_produce:
      - monthly_reports
      - maintenance_logs
      - tenant_communications
      - rent_collection_records
    onboarding_days: 3

# ===== AI AGENT REQUIREMENTS (Same structure, different context) =====

  ROLE-AGENT-REAL-ESTATE:
    description: "AI agent supporting real estate portfolio"
    type: "AI_AGENT"
    requires_credential: false
    identity_requirements:
      - agent_id
      - agent_name
      - deployment_location
      - version
    documents_required:
      - agent_specification
      - capability_specification
      - skill_definitions
      - tool_access_list
      - approval_limits_document
    systems_access:
      - company_brain_read
      - property_database_read
      - document_search
      - market_data
      - financial_data
      - reporting_system_write
    workflows:
      - property_analysis
      - valuation_support
      - risk_assessment
      - due_diligence_support
      - reporting
    approval_limits:
      can_recommend: ["acquisitions", "dispositions", "financing"]
      cannot_approve_without_human: ["property_purchase", "property_sale", "contract_execution"]
    training_required:
      - estate_domain_knowledge
      - real_estate_workflows
      - approval_authority
      - human_oversight_requirements
    evidence_to_produce:
      - analysis_reports
      - recommendations
      - workflow_logs
      - decision_audit_trail
    onboarding_days: 1

# ===== COMPLETION CHECKLIST =====
# Every role activation follows this pattern:
#
# 1. IDENTITY VERIFIED
#    ✓ All identity_requirements collected
#    ✓ Background check passed
#    ✓ Credentials verified (if applicable)
#
# 2. DOCUMENTS COLLECTED
#    ✓ All documents_required obtained
#    ✓ Scanned and stored in document system
#    ✓ Evidence catalog updated
#
# 3. SYSTEMS CONFIGURED
#    ✓ All systems_access provisioned
#    ✓ Passwords/credentials shared securely
#    ✓ Test access verified
#
# 4. TRAINING COMPLETED
#    ✓ All training_required modules signed off
#    ✓ Competency verified
#    ✓ Workflows reviewed
#
# 5. WORKFLOWS ACTIVATED
#    ✓ All workflows assigned
#    ✓ First task created
#    ✓ Manager briefing completed
#
# 6. APPROVAL AUTHORITY DOCUMENTED
#    ✓ Approval limits documented and signed
#    ✓ Escalation paths briefed
#    ✓ Policy acknowledgment signed
#
# 7. INITIAL EVIDENCE
#    ✓ First evidence artifact produced
#    ✓ Quality verified
#    ✓ Role activated

notes: |
  CRITICAL USAGE:

  1. Every role has a ROLE-REQUIREMENTS entry in this file
  2. When onboarding a person/agent, use this as the checklist
  3. Maps to RESPONSIBILITY-MATRIX when person is assigned
  4. Feeds into ONBOARDING-TEMPLATES.yaml for automated packages
  5. Produces ONBOARDING-CHECKLIST per person

  ACTIVATION CRITERIA:
  - 100% of identity_requirements complete
  - 100% of documents_required collected
  - 100% of systems_access provisioned
  - 100% of training_required signed off
  - At least one evidence_to_produce artifact submitted and verified

  STATUS TRACKING:
  - PENDING: Waiting for requirements
  - IN_PROGRESS: Working through checklist
  - PENDING_REVIEW: Ready for final approval
  - ACTIVE: Fully onboarded and operational
  - INACTIVE: No longer fulfilling role (but keep record for audit)
