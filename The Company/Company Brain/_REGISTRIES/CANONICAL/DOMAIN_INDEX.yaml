# DISCOVERY QUERIES

discovery:
  find_domain_by_number:
    query: "domains_index WHERE domain_id = '00-CONSTITUTION'"
    returns: "Domain metadata (name, layer, purpose, files, control points)"

  find_domain_by_purpose:
    query: "domains_index WHERE purpose CONTAINS 'Neo4j'"
    returns: "All domains related to a topic"

  find_files_in_domain:
    query: "domains_index WHERE domain_id = '08-KNOWLEDGE-GRAPH'"
    returns: "All files and sub-folders in domain"

  find_domain_owner:
    query: "domains_index WHERE domain_id = 'XX'"
    returns: "Control point and Base responsible for this domain"

