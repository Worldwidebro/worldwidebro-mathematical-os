## Aggregation: 250 Domains → 12 Control Planes

```
CONTROL_DOMAINS_250.yaml (machine-readable)
        ↓
Aggregates to:
        ↓
CONTROL_PLANES (human-readable)
        ↓
CP-001: Corporate & Strategy (Domains 1-40)
CP-002: Business Model & Revenue (Domains 41-80)
CP-003: Customers & Marketing (Domains 81-120)
CP-004: Product & Innovation (Domains 121-140)
CP-005: Operations (Domains 141-160)
CP-012: Agents & AI (Domains 161-180)
CP-065: Research & Intelligence (Domains 181-200)
CP-006: Open Source & Capability (Domains 201-220)
CP-027: Engineering & Infrastructure (Domains 221-240)
CP-028: Governance & Security (Domains 241-250)
CP-030: Revenue & Collections (Revenue-specific domains)
CP-050: Master Control (Meta-governance)
```

**Key Insight:** The 250 domains give you COMPLETE coverage of all company business areas. The 12 control planes are the PHYSICAL execution units. Every domain maps to:
- An owned folder/system
- A set of registries (queries)
- A control plane (governance)
- A set of agents (automation)

---

**Status:** Framework complete. Ready to map existing systems to domains + wire to agents.

