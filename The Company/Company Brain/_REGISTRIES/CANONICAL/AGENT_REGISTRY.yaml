## METADATA SCHEMA

```yaml
agent_template:
  id: string                      # unique identifier (auto-generated: agent-{name}-{version})
  name: string                    # display name
  file_path: string              # location in codebase
  description: string            # what it does
  domain: string                 # which domain (00-50)
  logic_layers: [string]         # which logics it executes (LOGIC-001 to LOGIC-072)
  control_planes: [string]       # which CPs govern it (CP-001 to CP-050)
  capabilities: [string]         # which capabilities it enables/executes
  required_skills: [string]      # dependencies (other skills it needs)
  required_tools: [string]       # tool names (neo4j, bash, github, etc.)
  required_mcps: [string]        # MCP server names (mcp__claude_ai_GitHub, etc.)
  autonomy_level: string         # L1 (human) / L2 (assisted) / L3 (autonomous)
  trustworthiness_score: float   # 0.0-1.0 (higher = more autonomous-ready)
  cost_per_use_usd: float       # estimated cost to run once
  expected_duration_minutes: int # how long it typically takes
  success_rate_percent: int     # historical success rate
  last_verified: date           # last tested/verified date
  sectors_applicable: [string]  # which sectors can use it (SEC-001 to SEC-035)
  ventures_deployed: [string]   # ventures currently using it
```

