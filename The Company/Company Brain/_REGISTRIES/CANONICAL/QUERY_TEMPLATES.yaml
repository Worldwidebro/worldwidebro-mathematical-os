## Usage Example

```python
# Execute a pre-built template
query = query_templates['find_ventures_by_sector']
results = neo4j.execute(
    query['template'],
    parameters={
        'sector_id': 'SEC-009',
        'limit': 10
    }
)
# Returns: List of ventures in Logistics sector
```

## Adding New Templates

1. Define Cypher or search algorithm
2. Document parameters + returns
3. Add to QUERY_TEMPLATES.yaml
4. Test performance with LIMIT
5. Wire to agent via Agent Registry
6. Update wiki links

