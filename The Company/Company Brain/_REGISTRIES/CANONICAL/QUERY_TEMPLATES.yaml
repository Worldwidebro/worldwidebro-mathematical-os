# QUERY TEMPLATE LIBRARY
# Pre-built patterns for common operations on Neo4j + Qdrant
# Used by agents to avoid SQL injection, optimize performance

cypher_templates:
  find_agent_by_id:
    name: "Find Agent by ID"
    description: "Retrieve complete agent definition"
    wiki_link: "[[Agent]]"
    base_link: "[[B027|Control Base B027]]"
    template: |
      MATCH (a:Entity:Agent {agent_id: $agent_id})
      RETURN a.agent_id, a.agent_name, a.agent_type, a.agent_base, a.agent_status, a.capabilities, a.skills
      LIMIT 1
    parameters:
      - name: "agent_id"
        type: "string"
        example: "AGT-050"
    returns:
      - "agent_id"
      - "agent_name"
      - "agent_type"
      - "agent_base"
      - "agent_status"
      - "capabilities (list)"
      - "skills (list)"

  find_ventures_by_sector:
    name: "Find Ventures by Sector"
    description: "List all operating ventures in a sector"
    wiki_link: "[[Venture]]"
    base_link: "[[B050|Control Base B050]]"
    template: |
      MATCH (v:Entity:Venture)-[:OPERATES_IN]->(s:Entity:Sector {sector_id: $sector_id})
      RETURN v.venture_id, v.venture_name, v.status, v.revenue_stage
      ORDER BY v.revenue_stage DESC
      LIMIT $limit
    parameters:
      - name: "sector_id"
        type: "string"
        example: "SEC-009"
      - name: "limit"
        type: "integer"
        example: 10
    returns:
      - "venture_id"
      - "venture_name"
      - "status"
      - "revenue_stage"

  find_agents_in_base:
    name: "Find Agents in Control Base"
    description: "All agents scoped to a Base"
    wiki_link: "[[Control Base]]"
    base_link: "[[B027|Control Base B027]]"
    template: |
      MATCH (a:Entity:Agent)-[:BELONGS_TO]->(b:ControlBase {base_id: $base_id})
      RETURN a.agent_id, a.agent_name, a.agent_status
      ORDER BY a.agent_id
    parameters:
      - name: "base_id"
        type: "string"
        example: "B027"
    returns:
      - "agent_id"
      - "agent_name"
      - "agent_status"

  find_venture_capabilities:
    name: "Find Required Capabilities"
    description: "What capabilities does a venture need?"
    wiki_link: "[[Capability]]"
    base_link: "[[B027|Control Base B027]]"
    template: |
      MATCH (v:Entity:Venture {venture_id: $venture_id})-[:REQUIRES]->(c:Capability)
      RETURN c.capability_id, c.capability_name, c.status, c.maturity_level
      ORDER BY c.maturity_level DESC
    parameters:
      - name: "venture_id"
        type: "string"
        example: "VEN-005"
    returns:
      - "capability_id"
      - "capability_name"
      - "status"
      - "maturity_level"

  find_agents_with_skill:
    name: "Find Agents with Skill"
    description: "Which agents have a specific skill?"
    wiki_link: "[[Skill]]"
    base_link: "[[B027|Control Base B027]]"
    template: |
      MATCH (a:Entity:Agent)-[:HAS_SKILL]->(s:Skill {skill_id: $skill_id})
      RETURN a.agent_id, a.agent_name, a.agent_status
      ORDER BY a.agent_id
    parameters:
      - name: "skill_id"
        type: "string"
        example: "SKL-042"
    returns:
      - "agent_id"
      - "agent_name"
      - "agent_status"

  find_control_point_domains:
    name: "Find Domains under Control Point"
    description: "What domains does a CP govern?"
    wiki_link: "[[Control Point]]"
    base_link: "[[B001|Control Base B001]]"
    template: |
      MATCH (cp:ControlPoint {control_point_id: $control_point_id})-[:CONTROLS]->(d:Domain)
      RETURN d.domain_id, d.domain_name, d.file_count
      ORDER BY d.domain_id
    parameters:
      - name: "control_point_id"
        type: "string"
        example: "CP-027"
    returns:
      - "domain_id"
      - "domain_name"
      - "file_count"

  find_venture_revenue_chain:
    name: "Venture → Revenue Chain"
    description: "Trace venture → capability → skill → agent → revenue"
    wiki_link: "[[Revenue]]"
    base_link: "[[B050|Control Base B050]]"
    template: |
      MATCH path = (v:Entity:Venture {venture_id: $venture_id})
        -[:REQUIRES]->(c:Capability)
        -[:ENABLED_BY]->(s:Skill)
        -[:EXECUTED_BY]->(a:Entity:Agent)
        -[:PRODUCES]->(r:Revenue)
      RETURN v.venture_name, c.capability_name, s.skill_id, a.agent_name, r.amount, r.date
      ORDER BY r.date DESC
    parameters:
      - name: "venture_id"
        type: "string"
        example: "VEN-005"
    returns:
      - "venture_name"
      - "capability_name"
      - "skill_id"
      - "agent_name"
      - "amount"
      - "date"

# HYBRID SEARCH TEMPLATES (Neo4j + Qdrant)

hybrid_search_templates:
  semantic_venture_search:
    name: "Semantic Venture Search"
    description: "Find ventures by description similarity"
    wiki_link: "[[Search]]"
    base_link: "[[B027|Control Base B027]]"
    algorithm: "Qdrant embedding similarity + Neo4j relationship confirmation"
    template: |
      1. Query Qdrant: SEARCH ventures_collection
         WHERE text_search($query, embedding_model="nomic-embed-text")
         LIMIT 20
      2. Confirm Neo4j: MATCH (v:Entity:Venture)
         WHERE v.venture_id IN $qdrant_results
         RETURN v.venture_id, v.venture_name, v.description
    parameters:
      - name: "query"
        type: "string"
        example: "medical logistics courier services"
    returns:
      - "venture_id"
      - "venture_name"
      - "description"
      - "relevance_score"

  capability_gap_analysis:
    name: "Capability Gap Analysis"
    description: "Find ventures that need a capability"
    wiki_link: "[[Capability]]"
    base_link: "[[B027|Control Base B027]]"
    algorithm: "Neo4j graph traversal + Qdrant semantic match"
    template: |
      1. Neo4j: MATCH (v:Entity:Venture)
         WHERE NOT (v)-[:HAS_CAPABILITY]->(c:Capability {capability_id: $capability_id})
         RETURN v.venture_id, v.venture_name
      2. Qdrant: SEARCH ventures_collection
         WHERE semantic_match("ventures needing " + $capability_name)
         FILTER venture_id IN $neo4j_results
    parameters:
      - name: "capability_id"
        type: "string"
        example: "CAP-015"
      - name: "capability_name"
        type: "string"
        example: "Hybrid Search"
    returns:
      - "venture_id"
      - "venture_name"
      - "gap_distance"

# PERFORMANCE NOTES

performance:
  cypher_query_optimization:
    - "Always use LIMIT to avoid full scans"
    - "Index on entity_id fields (venture_id, agent_id, sector_id, etc.)"
    - "Use :Entity label prefix for fast filtering (Entity:Venture vs Venture)"
    - "Match on indexed properties first, filter after"

  hybrid_query_latency:
    - "Qdrant embedding lookup: ~50-100ms"
    - "Neo4j confirmation: ~10-20ms"
    - "Total hybrid query: ~100-150ms for 20 results"
    - "Cache semantic embeddings for common queries"

