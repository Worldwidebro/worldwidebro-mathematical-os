---
name: AGENT_INDEX
version: "1.0"
description: Search + discovery index for all 318 agents — find by type, base, capability, skill
authority: CP-027 (Infrastructure & Orchestration)
status: ACTIVE
created: 2026-09-25
updated: 2026-09-25
base_id: B027

# AGENT DISCOVERY INDEX
# Enables fast lookup: "What agents do X?" / "Which agents work in sector Y?"
# Built from AGENTS_REGISTRY.yaml via automated indexing
# Must be kept in sync with AGENTS_REGISTRY via CI pipeline

index_structure:
  total_agents: 318
  indexed_attributes:
    - agent_id
    - agent_name
    - agent_type
    - agent_base
    - agent_sector
    - agent_domain
    - agent_capabilities
    - agent_skills
    - agent_tools
    - agent_status
  query_methods:
    - by_id: "AGT-001 to AGT-318"
    - by_type: "routing, research, operational, tactical"
    - by_base: "B001-B500"
    - by_sector: "SEC-001 to SEC-036"
    - by_capability: "CAP-001 to CAP-300"
    - by_skill: "search, retrieve, analyze, execute"
    - by_tool: "Neo4j, Qdrant, OmniRoute, etc."
    - by_status: "available, assigned, executing, paused, retired"

# INDEXING RULES
query_examples:
  find_research_agents: |
    SELECT agent_id, agent_name FROM agents_registry
    WHERE agent_type = 'research'
    ORDER BY agent_name

  find_agents_by_base: |
    SELECT agent_id, agent_name, agent_base FROM agents_registry
    WHERE agent_base = 'B027'
    ORDER BY agent_id

  find_agents_by_sector: |
    SELECT agent_id, agent_name, agent_sector FROM agents_registry
    WHERE agent_sector = 'SEC-009'
    LIMIT 10

  find_agents_with_skill: |
    SELECT agent_id, agent_name FROM agents_registry
    WHERE skills CONTAINS 'SKL-042'
    ORDER BY agent_id

  find_agents_in_workflow: |
    SELECT agent_id, agent_name FROM agents_registry
    WHERE assigned_workflows CONTAINS 'WFL-001'

