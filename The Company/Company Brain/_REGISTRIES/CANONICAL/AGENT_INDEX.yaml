# AGENT DISCOVERY QUERIES

discovery_paths:
  find_agent_by_id:
    query: "agents_registry WHERE agent_id = 'AGT-XXX'"
    returns: "Complete agent definition (name, type, base, capabilities, skills, tools, status)"
    base_link: "[[B027|Control Base B027]]"

  find_agents_for_venture:
    query: "agents_registry WHERE assigned_ventures CONTAINS 'VEN-XXX'"
    returns: "All agents currently assigned to venture"
    example: "VEN-005 (LT-005 courier) → AGT-101, AGT-102, AGT-160"
    base_link: "[[B050|Control Base B050]]"

  find_agents_by_skill:
    query: "agents_registry WHERE skills CONTAINS 'SKL-XXX'"
    returns: "All agents with this skill"
    example: "SKL-042 (Neo4j Query) → AGT-050, AGT-051, AGT-200"
    base_link: "[[B027|Control Base B027]]"

  find_agents_by_capability:
    query: "agents_registry WHERE capabilities CONTAINS 'CAP-XXX'"
    returns: "All agents with this capability"
    example: "CAP-015 (Hybrid Search) → AGT-050, AGT-051, AGT-052"
    base_link: "[[B027|Control Base B027]]"

  find_available_agents:
    query: "agents_registry WHERE agent_status = 'AVAILABLE'"
    returns: "Unassigned agents ready for new work"
    base_link: "[[B027|Control Base B027]]"

  find_agents_in_base:
    query: "agents_registry WHERE agent_base = 'B-XXX'"
    returns: "All agents scoped to a specific Base"
    example: "B027 (Orchestration) → 45 agents"
    base_link: "[[B027|Control Base B027]]"

  find_agents_by_sector:
    query: "agents_registry WHERE agent_sector = 'SEC-XXX'"
    returns: "All agents serving a specific sector"
    example: "SEC-009 (Logistics) → 12 agents"
    base_link: "[[B027|Control Base B027]]"

# INDEXING METADATA

index_maintenance:
  freshness: "Weekly (synced from AGENTS_REGISTRY.yaml via CI)"
  last_indexed: 2026-09-25
  index_size: ~50KB
  query_performance: "< 100ms for any query"
  owner: "CP-027 (Agent Orchestration)"

  sync_process: |
    1. AGENTS_REGISTRY.yaml changes
    2. Pre-commit hook validates schema
    3. CI pipeline re-indexes AGENT_INDEX.yaml
    4. Neo4j (:Entity:Agent) nodes updated
    5. Cache invalidated in Qdrant

  validation_rules:
    - "All agents in index exist in AGENTS_REGISTRY.yaml"
    - "No duplicate agent_ids"
    - "All referenced bases/sectors/domains exist"
    - "All referenced skills/capabilities exist"
    - "Agent status is valid enum"

