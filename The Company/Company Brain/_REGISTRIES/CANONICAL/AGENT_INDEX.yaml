**Query Examples:**

```sql
-- Find all research agents
SELECT agent_id, agent_name, agent_status
FROM agents_registry
WHERE agent_type = 'research'
ORDER BY agent_id

-- Find agents assigned to a venture
SELECT agent_id, agent_name, agent_base
FROM agents_registry
WHERE assigned_ventures CONTAINS 'VEN-005'

-- Find agents with a specific skill
SELECT agent_id, agent_name
FROM agents_registry
WHERE skills CONTAINS 'SKL-042' (Neo4j Query)
ORDER BY agent_name

-- Find available agents in a sector
SELECT agent_id, agent_name, agent_base
FROM agents_registry
WHERE agent_sector = 'SEC-009'
  AND agent_status = 'AVAILABLE'
ORDER BY agent_id LIMIT 5
```

