## Integration Strategy

### Phase 1: Core Academic Sources (Sep 2026)
- arXiv: Daily ingestion of new papers
- Semantic Scholar: Citation context + embeddings
- OpenAlex: Scholarly graph + topic classification

### Phase 2: Code & Implementation (Oct 2026)
- Papers With Code: Paper-to-code mapping
- Hugging Face: Pre-trained models + model cards
- GitHub: Open-source baseline implementations

### Phase 3: Specialized Sources (Nov 2026)
- ACL Anthology: NLP research (free)
- Connected Papers: Research lineage + similarity
- Industry blogs: State-of-the-art summaries

### Phase 4: Evaluation & Adoption (Dec 2026)
- Benchmark tracking (MMLU, SuperGLUE, OpenLLM)
- Replication experiments on Company Brain infrastructure
- Adoption decisions (watch/pilot/adopted/rejected)

## Research Agent Workflow

```
DISCOVER (New Paper)
    ↓
EXTRACT (Claims, Methods, Models, Code)
    ↓
VERIFY (Check against Company Brain)
    ↓
LINK (Map to capabilities, repos, opportunities)
    ↓
EXPERIMENT (Test in sandbox environment)
    ↓
EVALUATE (Measure against metrics)
    ↓
DECIDE (Adopt, pilot, watch, or reject)
    ↓
UPDATE (Add to Company Brain graph)
    ↓
APPLY (Integrate into workflows/ventures)
```

