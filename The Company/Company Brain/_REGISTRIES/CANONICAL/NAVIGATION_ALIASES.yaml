## REGISTRY MAINTENANCE

**When to update:**

1. New document added to Company Brain root
2. New major domain created
3. Alias changed in frontmatter
4. Navigation path updated

**Who can update:** CP-027 (Infrastructure Control Plane)

**Process:**
1. Update this file
2. Run: `grep -r "^aliases:" . > /tmp/aliases-scan.txt`
3. Verify STARTHERE.md links to this registry
4. Commit with message: `docs: update navigation aliases (YYYY-MM-DD)`

