## PATTERN GUIDE

### Domain Folders (0-50)

- Primary: `[[NN-DOMAIN-NAME/README|DOMAIN_DISPLAY]]`
- Pattern: `[[00-CONSTITUTION/README|CONSTITUTION]]`

### Infrastructure Folders (_*)

- Primary: `[[_FOLDER/README|FOLDER_DISPLAY]]`
- Pattern: `[[_ONTOLOGY/README|_ONTOLOGY]]`

### Root-Level .md Files

- Primary: `[[FILENAME]]` (no extension)
- Pattern: `[[STARTHERE]]`, `[[REALITY]]`, `[[EVIDENCE]]`

### Nested Documents

- Primary: `[[FOLDER/FILE|DISPLAY]]`
- Pattern: `[[08-KNOWLEDGE-GRAPH/README|Knowledge Graph]]`

