## HOW TO USE THIS REGISTRY

### For Wiki Linking in Documents

Use primary name with pipe notation:

```markdown
[[STARTHERE]]
[[00_RESPECT/RESPECT|RESPECT]]
[[FILE_FORMAT_REGISTRY]]
[[23-VENTURES/LT-005|LT-005 (HealthRoute Medical Courier)]]
```

### For Cross-References

Include in STARTHERE spine:

```markdown
[[STARTHERE]] | [[REALITY]] | [[EVIDENCE]] | [[AGENTS]] | [[ARCHITECTURE]]
```

### For Discovery

If you know the topic but not the file:
1. Check this registry
2. Use the primary name or any alias
3. All resolve to the same document

