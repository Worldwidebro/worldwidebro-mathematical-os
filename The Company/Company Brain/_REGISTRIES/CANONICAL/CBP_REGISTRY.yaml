# CBP_REGISTRY.yaml — 500 Control Base Points (Bases)
#
# Authority: CP-001 (Sovereign Operator)
# Updated: 2026-09-25
# Status: DEPLOYED
#
# Structure: 50 Domains × 10 Bases per domain = 500 control points
# Each Base represents a controlled domain of truth in the Company Brain
# Bases organize knowledge, entities, workflows, metrics, and decisions
#
# Alignment:
#   - 22-stage cognitive pipeline (observation → income)
#   - 9 cognitive fabrics (reality, information, knowledge, cognition, discovery, decision, agent, execution, learning)
#   - 50 numbered domains (00-CONSTITUTION through 50-MASTER-CONTROL)
#   - L1/L2/L3 agent autonomy levels
#
# Graph structure:
#   CONTROL BASE (B001-B500)
#     ├─ Entities (ventures, people, agents, repos)
#     ├─ Workflows (tasks, processes, automation)
#     ├─ Metrics (KPIs, OKRs, measurements)
#     └─ Decisions (approvals, evidence, actions)
#        └─ Events (payments, commits, calls, deployments)
#           └─ Evidence (audit trail, documentation)
#              └─ Income (attributed revenue, outcomes)

