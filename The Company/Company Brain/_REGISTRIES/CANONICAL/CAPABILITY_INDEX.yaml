---
name: CAPABILITY_INDEX
version: "1.0"
description: Search + discovery index for 300+ capabilities — find by gap, sector, maturity, owner
authority: CP-027 (Infrastructure & Orchestration)
status: ACTIVE
created: 2026-09-25
updated: 2026-09-25
base_id: B027

# CAPABILITY DISCOVERY & GAP ANALYSIS INDEX
# Enables: "What capabilities do we have?" / "What capabilities are missing?" / "Which sectors need X?"

index_structure:
  total_capabilities: 300
  owned_capabilities: 180
  external_capabilities: 120
  indexed_attributes:
    - capability_id
    - capability_name
    - maturity_level
    - status
    - sector_coverage
    - ownership_type
    - gaps_per_sector

# CAPABILITIES BY MATURITY

maturity_levels:
  nascent:
    count: 45
    description: "Early-stage, limited adoption"
    sectors: "2-3 per capability"
    wiki_link: "[[Nascent Capability]]"
    base_link: "[[B027|Control Base B027]]"
    examples:
      - "CAP-250: Hybrid Search (NEW, needs tuning)"
      - "CAP-260: Agent Context Assembly (NEW, being tested)"

  emerging:
    count: 75
    description: "Growing adoption, proving value"
    sectors: "3-5 per capability"
    wiki_link: "[[Emerging Capability]]"
    base_link: "[[B027|Control Base B027]]"
    examples:
      - "CAP-015: Hybrid Search (improving)"
      - "CAP-028: Agent Context (widening use)"

  mature:
    count: 120
    description: "Stable, widely adopted, well-documented"
    sectors: "5+ per capability"
    wiki_link: "[[Mature Capability]]"
    base_link: "[[B027|Control Base B027]]"
    examples:
      - "CAP-001: Entity Resolution (core)"
      - "CAP-005: Relationship Mapping (core)"

  legacy:
    count: 40
    description: "Functional but declining use"
    sectors: "3-4 per capability"
    wiki_link: "[[Legacy Capability]]"
    base_link: "[[B027|Control Base B027]]"
    examples:
      - "CAP-100: Old Search (deprecated)"

# CAPABILITIES BY SECTOR COVERAGE

sector_coverage:
  SEC-001:
    count: 45
    capabilities: ["CAP-001", "CAP-005", "CAP-010", ...]
    gaps: ["CAP-250 (Hybrid Search)", "CAP-260 (Agent Context)"]
    wiki_link: "[[SEC-001]]"

  SEC-009:
    count: 60
    capabilities: ["CAP-001", "CAP-015", "CAP-020", ...]
    gaps: ["CAP-070 (Real-time Tracking)", "CAP-080 (Predictive Routing)"]
    wiki_link: "[[SEC-009]]"

# DISCOVERY QUERIES

discovery_paths:
  find_capability_by_id:
    query: "capabilities_registry WHERE capability_id = 'CAP-XXX'"
    returns: "Complete capability definition (name, status, maturity, sectors, owner)"
    base_link: "[[B027|Control Base B027]]"

  find_capabilities_in_sector:
    query: "capabilities_registry WHERE sector_coverage CONTAINS 'SEC-XXX'"
    returns: "All capabilities covering a sector"
    example: "SEC-009 → 60 capabilities available"
    base_link: "[[B027|Control Base B027]]"

  find_gaps_in_sector:
    query: "capabilities_registry WHERE gaps_per_sector CONTAINS 'SEC-XXX'"
    returns: "Capabilities NOT available in sector"
    example: "SEC-009 gaps → CAP-070 (Real-time Tracking), CAP-080 (Predictive Routing)"
    base_link: "[[B027|Control Base B027]]"

  find_capabilities_by_maturity:
    query: "capabilities_registry WHERE maturity_level = 'mature'"
    returns: "All capabilities at specified maturity (nascent/emerging/mature/legacy)"
    base_link: "[[B027|Control Base B027]]"

  find_owner_of_capability:
    query: "capabilities_registry WHERE capability_id = 'CAP-XXX'"
    returns: "Who owns this capability? (internal team or external partner)"
    base_link: "[[B027|Control Base B027]]"

  find_capabilities_by_status:
    query: "capabilities_registry WHERE status IN ['READY', 'ADOPTING', 'MATURE']"
    returns: "Capabilities available for new ventures"
    base_link: "[[B027|Control Base B027]]"

# GAP ANALYSIS

gap_analysis:
  method: "Compare venture requirements vs. available capabilities"
  algorithm: |
    1. Get venture's required_capabilities list
    2. Cross-reference against CAPABILITY_REGISTRY
    3. Flag missing capabilities as "gaps"
    4. Prioritize by: (gap_count / required_count) descending
    5. Recommend: build/buy/partner for top gaps

  example: |
    Venture: VEN-005 (LT-005 Courier)
    Required: CAP-001, CAP-015, CAP-070, CAP-080
    Available: CAP-001 ✅, CAP-015 ✅
    Gaps: CAP-070 ❌ (Real-time Tracking), CAP-080 ❌ (Predictive Routing)
    Gap Ratio: 50% (2 of 4 required)
    Recommendation: BUY or PARTNER for tracking/routing

# OWNERSHIP MODEL

ownership_types:
  owned_internal:
    count: 180
    description: "Built by Worldwidebro teams"
    maintenance: "Internal responsibility"
    wiki_link: "[[Internal Capability]]"
    base_link: "[[B027|Control Base B027]]"

  owned_external:
    count: 120
    description: "Acquired from external partners (GitHub stars 31M+)"
    maintenance: "Upstream dependency, monitor for updates"
    wiki_link: "[[External Capability]]"
    base_link: "[[B027|Control Base B027]]"

# WIKI LINKS

wiki_links:
  - "[[Capability]]"
  - "[[Capability Registry]]"
  - "[[Capability Index]]"
  - "[[Gap Analysis]]"
  - "[[Maturity Model]]"
  - "[[Sector Coverage]]"

# INDEXING METADATA

index_maintenance:
  freshness: "Monthly (synced from CAPABILITY_REGISTRY.yaml via CI)"
  last_indexed: 2026-09-25
  index_size: ~100KB
  query_performance: "< 50ms for any query"
  owner: "CP-027"

# MASTER CONTROL REFERENCE

base_link: "[[B027|Control Base B027]]"

---

## Quick Lookup

| I want to... | Use this query |
|---|---|
| Find a capability | find_capability_by_id |
| See what we have in a sector | find_capabilities_in_sector |
| Find gaps in a sector | find_gaps_in_sector |
| See mature capabilities | find_capabilities_by_maturity |
| Know who owns a capability | find_owner_of_capability |
| Find ready-to-use capabilities | find_capabilities_by_status |

