## Permission Matrix Summary

| Tool | L3 Agents | L2 Agents | L1 Agents | Notes |
|------|-----------|-----------|-----------|-------|
| SendGrid | - | Cold Email Writer, Email Strategist, Customer Success | - | Review before send |
| Stripe | Accounts Payable Agent (<$10K) | Invoice Tracker | Closer | Autonomy gated by amount |
| Neo4j | Agent Dispatch Router | - | - | Read-only for agents |
| ClickUp | Operations Manager | Project Manager, Deal Strategist | - | Async task creation |
| Make.com | - | Automation Governance Architect | Operations Manager | Design vs Deploy gated |
| GitHub | - | DevOps Automator, Backend Architect | - | PRs not merged autonomously |
| OmniRoute | Agent Dispatch Router | - | - | Master routing engine |

---

## Rate Limit & Budget Alerts

**Daily Alerts:**
- SendGrid: Alert at 80 emails (default 100/day)
- Stripe: Alert at $40K spent (default $50K/month)
- Make.com: Alert at 120 operations (default 150/min)

**Monthly Budget Enforcement:**
- Stripe: $50,000/month hard limit
- Make.com: $1,000/month hard limit
- Supabase: $300/month soft limit (warn at $240)
- Web Search: $50/month soft limit

