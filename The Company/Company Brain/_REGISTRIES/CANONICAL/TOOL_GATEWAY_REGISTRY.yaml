# TOOL_GATEWAY_REGISTRY.yaml

**Purpose:** Control access, rate limits, and costs for all 20+ MCPs used by agents.

**Structure:**
- tool_id: unique identifier
- name: human-readable name
- endpoint: API/service endpoint
- auth_type: how to authenticate (api_key, oauth, jwt, bolt)
- rate_limit: max calls per time period
- cost_per_call: cost in USD (or "free")
- monthly_budget: spending limit per month
- permissions: which agents can use + autonomy level

---

