# What's Missing: The 61 Remote Repos
missing_repos_analysis:
  total_deployed_ventures: 69
  with_local_repos: 8
  deployed_from_remote_github: 61

  resolution_strategy: |
    To map the 61 remote repos:
    1. Query GitHub Worldwidebro org for all repos
    2. Cross-reference Vercel deployment URLs with repo names
    3. Match based on naming patterns (ec-001, fin-037, comm-001, etc.)
    4. Clone high-priority repos (Tier-1 + COMM-001-005)
    5. Update this registry with complete mapping

  known_patterns:
    - Venture ID appears in repo name: "ops-staff-001-staffing" → OPS-001
    - Vercel site name matches repo name (mostly)
    - Exception: COMM ventures (51 repos for 51 Vercel sites, pattern unclear)

# Data Quality Issues Found
