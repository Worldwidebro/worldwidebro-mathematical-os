# Repo → Vercel → Venture Mapping
# Authority: Live ecosystem audit (2026-09-09)
# Purpose: Trace every Vercel deployment to source repo and venture

metadata:
  version: "1.0"
  created_at: "2026-09-09"
  total_deployments: 96
  deployments_with_repos_local: 8
  deployments_with_repos_remote: 61
  deployments_with_unknown_repos: 27
  authority: "Ecosystem Reality Check v1"

summary:
  critical_finding: |
    96 Vercel deployments exist across 69 unique ventures.
    Only 8 have source repos cloned locally (/repos folder).
    61 are deployed from GitHub repos not yet cloned.
    27 speculative deployments have no repo assignment (templates/boilerplate).

    This explains the disconnection: code exists on GitHub but isn't referenced
    in local registries. Repos are being discovered from Vercel URLs, not from
    a curated source-of-truth registry.

