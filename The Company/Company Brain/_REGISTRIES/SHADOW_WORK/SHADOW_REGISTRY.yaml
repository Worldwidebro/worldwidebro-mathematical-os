operating_responses:
  - id: "OPR-001"
    name: "Mandatory Red-Team Review"
    cadence: "Pre-Decision"
    description: "Dedicated adversarial challenge of major strategic or architectural proposals."
  - id: "OPR-002"
    name: "Pre-Mortem Analysis"
    cadence: "Pre-Execution"
    description: "Assuming project has failed 12 months in the future; identifying root causes upfront."
  - id: "OPR-003"
    name: "Post-Mortem Reality Audit"
    cadence: "Post-Incident"
    description: "Blameless evaluation of failure root causes and corrective system adjustments."
  - id: "OPR-004"
    name: "Decision Journaling Protocol"
    cadence: "Per-Major-Decision"
    description: "Logging decision rationale, predicted outcome, confidence score, and review date."
  - id: "OPR-005"
    name: "Explicit Kill Criteria"
    cadence: "Pre-Commitment"
    description: "Defining specific quantitative triggers that automatically terminate an initiative."
  - id: "OPR-006"
    name: "Stop-Doing List"
    cadence: "Weekly"
    description: "Explicit enumeration of activities, repos, and tasks forbidden from receiving attention."
  - id: "OPR-007"
    name: "Delegation & Authority Matrix"
    cadence: "Monthly"
    description: "Explicit boundary mapping of who has unilateral sign-off authority per domain."
  - id: "OPR-008"
    name: "Single-Threaded Ownership Matrix"
    cadence: "Quarterly"
    description: "Every key result owned by exactly one individual; shared ownership strictly forbidden."
  - id: "OPR-009"
    name: "Weekly Cadence Review"
    cadence: "Weekly (Friday 17:00)"
    description: "Ruthless review of economic progress vs. activity theater over previous 7 days."
  - id: "OPR-010"
    name: "Monthly Strategic Realignment"
    cadence: "Monthly"
    description: "Evaluating macro evidence against core business models and capital allocations."
  - id: "OPR-011"
    name: "Capital Allocation Committee"
    cadence: "Monthly"
    description: "Formal audit of compute, payroll, and marketing spend against expected return."
  - id: "OPR-012"
    name: "Customer Feedback Interviews"
    cadence: "Weekly (Min 3 Calls)"
    description: "Direct, unfiltered dialogue with paying users and active prospects."
  - id: "OPR-013"
    name: "Sales Pipeline Velocity Review"
    cadence: "Weekly"
    description: "Tracking movement of qualified deals from initial contact to cash collected."
  - id: "OPR-014"
    name: "Unit Economics Audit"
    cadence: "Monthly"
    description: "Calculating contribution margin, CAC, and LTV per active venture."
  - id: "OPR-015"
    name: "Live Risk Register"
    cadence: "Monthly"
    description: "Documenting top 10 existential risks with explicit mitigation owners."
  - id: "OPR-016"
    name: "Assumption Register"
    cadence: "Continuous"
    description: "Tracking critical business hypotheses and their active falsification status."
  - id: "OPR-017"
    name: "Evidence-Based Decision Gate"
    cadence: "Continuous"
    description: "Rejecting any feature or investment lacking verifiable external proof of demand."
  - id: "OPR-018"
    name: "Theory of Constraints Analysis"
    cadence: "Monthly"
    description: "Locating the single master bottleneck in the company and focusing all resources there."
  - id: "OPR-019"
    name: "Brutal Priority Ranking (Top 3)"
    cadence: "Daily / Weekly"
    description: "Enforcing that only 3 outcomes matter; all other items strictly deprioritized."
  - id: "OPR-020"
    name: "Opportunity-Cost Calculation"
    cadence: "Pre-Commitment"
    description: "Mandating explicit statement of what is sacrificed before starting any new venture."
  - id: "OPR-021"
    name: "Scenario Stress Testing"
    cadence: "Quarterly"
    description: "Simulating loss of top customer, key engineer, or 50% revenue shock."
  - id: "OPR-022"
    name: "Cognitive Load Shedding"
    cadence: "Weekly"
    description: "Auditing active projects and force-shedding low-leverage commitments."
  - id: "OPR-023"
    name: "Succession & Bus-Factor Drill"
    cadence: "Semi-Annual"
    description: "Simulating founder absence for 30 days to identify hidden single points of failure."
  - id: "OPR-024"
    name: "Founder Dependency Audit"
    cadence: "Monthly"
    description: "Cataloging all tasks only the founder can do and systematically transferring them."
  - id: "OPR-025"
    name: "Complexity Pruning Audit"
    cadence: "Monthly (End of Month)"
    description: "Mandatory deletion of 20% of dead code, stale repos, and uncalled background services."
