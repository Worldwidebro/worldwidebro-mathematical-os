    quantization: "q4_k_m"
    vram_required: "8.5GB"
    loads: true
    fits_with_context: false
    practical_context_length: "8k"
    max_concurrent_requests: 1
    compatibility_score: 0.75
    notes: "Loads but tight on memory. Reduced context, single request."

  macbook_air_m_x_qwen2_5_32b:
    hardware_id: "HW-MACBOOK-AIR-M-001"
    model_id: "MDL-QWEN25-32B"
    loads: false
    compatibility_score: 0.10
    notes: "DOES NOT FIT. Use Exo to offload to Mac Studio."

  mac_studio_m4_x_glm_5_3_flash_open:
