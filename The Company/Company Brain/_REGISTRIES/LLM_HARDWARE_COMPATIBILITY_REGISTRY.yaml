    model_id: "MDL-CODEGEEX4-9B"
    runtime: "ollama"
    quantization: "q4_k_m"
    vram_required: "5.5GB"
    loads: true
    fits_with_context: true
    practical_context_length: "16k"
    max_concurrent_requests: 1
    compatibility_score: 0.88
    notes: "Fits in 16GB MacBook Air unified memory. Leaves 8GB+ for OS and development workflows."

