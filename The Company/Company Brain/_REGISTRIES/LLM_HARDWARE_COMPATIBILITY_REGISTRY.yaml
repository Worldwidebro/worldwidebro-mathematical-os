# ============================================================
# RECOMMENDATIONS
# ============================================================

recommendations:

  mac_studio_best_choice:
    model: "qwen2.5-coder:14b"
    rationale: "45 tok/s, 0.90 quality, minimal memory pressure"
    alternative: "qwen2.5:32b for deep reasoning (32 tok/s, 0.94 quality)"
    avoid: "qwen2.5:72b (exceeds memory)"

  macbook_air_best_choice:
    model: "qwen2.5-coder:14b with reduced context"
    rationale: "Fits on 16GB, acceptable performance, single request"
    fallback: "Use Exo to offload 32B+ models to Mac Studio"

# ============================================================
# DECISION ENGINE RULES
# ============================================================

decision_engine_rules:

  routing_logic:
    - rule: "Coding task, Mac Studio available → qwen2.5-coder:14b"
      quality: 0.95
      speed: 850
      unit: "tok/s prefill"

    - rule: "Deep reasoning → qwen2.5:32b"
      quality: 0.96
      speed: 680
      unit: "tok/s prefill"

    - rule: "Large reasoning (72B) → Exo distributed"
      quality: 0.98
      speed: 200
      unit: "tok/s prefill"

    - rule: "Embeddings → nomic-embed-text"
      throughput: 12000
      unit: "embeddings/sec"

  fallback_chain:
    primary: "qwen2.5-coder:14b local"
    secondary: "qwen2.5:32b local"
    tertiary: "Exo distributed (peer device)"
    quaternary: "Cloud (Anthropic/OpenAI)"

