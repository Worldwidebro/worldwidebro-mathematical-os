# ============================================================
# COMPATIBILITY MATRIX
# ============================================================

compatibility_matrix:

  mac_studio_m4_x_qwen2_5_coder_14b:
    hardware_id: "HW-MAC-STUDIO-M4-001"
    model_id: "MDL-QWEN25-CODER-14B"
    runtime: "ollama"
    quantization: "q4_k_m"
    vram_required: "8.5GB"
    loads: true
    fits_with_context: true
    practical_context_length: "16k"
    max_concurrent_requests: 2
    compatibility_score: 0.95
    notes: "Excellent fit. Can run with full context."

  mac_studio_m4_x_qwen2_5_32b:
    hardware_id: "HW-MAC-STUDIO-M4-001"
    model_id: "MDL-QWEN25-32B"
    runtime: "ollama"
    quantization: "q4_k_m"
    vram_required: "19GB"
    loads: true
    fits_with_context: true
    practical_context_length: "20k"
    max_concurrent_requests: 1
    compatibility_score: 0.90
    notes: "Good fit. Can run with reduced context."

  mac_studio_m4_x_qwen2_5_72b:
    hardware_id: "HW-MAC-STUDIO-M4-001"
    model_id: "MDL-QWEN25-72B"
    runtime: "ollama"
    quantization: "q4_k_m"
    vram_required: "43GB"
    loads: false
    compatibility_score: 0.30
    notes: "DOES NOT FIT. Use Exo distributed or AirLLM."

  macbook_air_m_x_qwen2_5_coder_14b:
    hardware_id: "HW-MACBOOK-AIR-M-001"
    model_id: "MDL-QWEN25-CODER-14B"
