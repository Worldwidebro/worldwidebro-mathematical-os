---
# EVIDENCE-GRAPH.yaml
# Layer 11: Evidence, Provenance & Verification
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Track how we know what we claim; enforce ANTIGRAVITY Rule 31 (No Fake Completion)
#
# Graph-of-Graphs Wiring:
# [[AUTHORITY-GRAPH]] → [[STATE-GRAPH]] → [[LIFECYCLE-GRAPH]] → [[EVENT-GRAPH]] → [[EVIDENCE-GRAPH]] → [[DECISION-GRAPH]] → [[RESOURCE-GRAPH]] → [[CONSTRAINT-GRAPH]] → [[DEPENDENCY-GRAPH]] → [[LEARNING-GRAPH]] → [[INTENT-GRAPH]] → [[POLICY-GRAPH]] → [[SEMANTIC-GRAPH]] → [[META-GRAPH]]
#
# **CRITICAL:** Operationalizes ANTIGRAVITY Rule 31 — No claim without evidence = UNVERIFIED.
#
# See also:
#   - [[EVENT-GRAPH]]: Events are evidenced
#   - [[DECISION-GRAPH]]: Decisions require evidence-backed claims
#   - [[AUTHORITY-GRAPH]]: Authority verifies evidence
#   - [[LEARNING-GRAPH]]: Contradictions in evidence trigger learning
#   - [[CONSTRAINT-GRAPH]]: Evidence requirements are constraints

evidence_graph:

  description: |
    The Evidence Graph answers: **"How do we know?"**

    This layer operationalizes ANTIGRAVITY Rule 31: **No Fake Completion.**
    Every claim, fact, metric, or status must be backed by evidence.

    This graph sits AFTER Event (layer 10) and feeds INTO Learning Graph (layer 16) and Decision Graph (layer 14).

    Claims without evidence have zero weight. Evidence with high confidence enables autonomous decisions.

  entity_types:

    - id: "CLAIM"
      name: "[[Claim]]"
      definition: "A statement about what is true or what happened"
      examples:
        - "[[CLAIM-LT005-Revenue-$1800-Sep2026]] ('HealthRoute generated $1,800 in September')"
        - "[[CLAIM-OPS001-100Placements-Q3]] ('OPS-001 completed 100 placements in Q3')"
        - "[[CLAIM-Venture-State-Generating-Revenue]] ('OPS-001 is in state Generating-Revenue')"
      properties:
        - id: "claim_id"
        - claimed_by: "[[PERSON-*]] or [[AGENT-*]] making the claim"
        - claimed_at: "timestamp when claim was made"
        - subject: "what is being claimed about? ([[VENTURE-*]], [[METRIC-*]], etc.)"
        - predicate: "what is claimed? (state, metric value, event, etc.)"
        - object: "the value or outcome (e.g., 'Generating-Revenue', '$1,800', '100')"
        - confidence: "how sure is the claimer? (HIGH, MEDIUM, LOW, UNVERIFIED)"
        - status: "UNVERIFIED, VERIFIED, DISPUTED, RETRACTED"
        - evidence_count: "how many pieces of evidence support this?"
        - highest_evidence_grade: "what's the strongest evidence? (OBSERVED, DOCUMENTED, AUDITED, etc.)"

    - id: "EVIDENCE"
      name: "[[Evidence]]"
      definition: "A fact, record, or observation that supports a claim"
      examples:
        - "[[EVIDENCE-BankTransaction-LT005-20260925]] (bank statement showing $1,800 deposit)"
        - "[[EVIDENCE-CustomerRecord-ABC-20260920]] (customer database record of active subscription)"
        - "[[EVIDENCE-Photo-OPS001-Placement]] (screenshot of job placement in system)"
      properties:
        - id: "evidence_id"
        - evidence_type: "OBSERVED|DOCUMENTED|AUDITED|COMPUTED|THIRD_PARTY|SENSOR"
        - source: "where does this evidence come from? (bank, database, photo, audit, etc.)"
        - timestamp: "when was this evidence created or captured?"
        - grading: "confidence level (UNGRADED, LOW, MEDIUM, HIGH, VERY_HIGH)"
        - bias_potential: "what biases might affect this evidence?"
        - provenance: "complete chain of custody / audit trail"
        - created_by: "who/what created this evidence?"
        - verified_by: "[[AUTHORITY-*]] who verified it?"
        - verified_at: "when was it verified?"
        - expires_at: "when does this evidence become stale?"
        - contradicted_by: "list of [[EVIDENCE-*]] that contradict this"
        - supports_claims: "list of [[CLAIM-*]] this evidences"

    - id: "EVIDENCE_TYPE"
      name: "[[EvidenceType]]"
      definition: "A category of evidence with its own reliability profile"
      examples:
        - "[[EVIDENCE-TYPE-BankStatement]] (high reliability, external source)"
        - "[[EVIDENCE-TYPE-CustomerSurvey]] (medium reliability, self-reported)"
      properties:
        - id: "evidence_type_id"
        - name: "display name"
        - reliability_grade: "default confidence level (LOW|MEDIUM|HIGH|VERY_HIGH)"
        - bias_factors: "what biases affect this type?"
        - acceptable_age_days: "how old can evidence be before it's stale?"
        - requires_verification: "must this be verified by authority?"
        - example_sources: "where does this evidence typically come from?"

    - id: "VERIFICATION"
      name: "[[Verification]]"
      definition: "Record that someone or something verified an evidence or claim"
      examples:
        - "[[VERIFICATION-CFO-LT005-Revenue-20260925]] (CFO verified revenue)"
        - "[[VERIFICATION-Audit-OPS001-PlacementCount-20260922]] (auditor verified placement count)"
      properties:
        - id: "verification_id"
        - verified_entity: "what is being verified? ([[EVIDENCE-*]], [[CLAIM-*]], etc.)"
        - verified_by: "[[AUTHORITY-*]] or [[PERSON-*]] doing verification"
        - verified_at: "timestamp of verification"
        - verification_method: "MANUAL_REVIEW|AUTOMATED_CHECK|AUDIT|RECONCILIATION|EXTERNAL_AUDIT"
        - result: "VERIFIED|DISPUTED|INCONCLUSIVE|UNABLE_TO_VERIFY"
        - notes: "what did verifier find?"
        - confidence: "verifier's confidence in result (HIGH|MEDIUM|LOW)"
        - next_verification_due: "when should this be re-verified?"

    - id: "CONTRADICTION"
      name: "[[Contradiction]]"
      definition: "Two pieces of evidence that conflict"
      examples:
        - "[[CONTRADICTION-LT005-Revenue]] (bank shows $1,800 but CRM shows $2,000)"
      properties:
        - id: "contradiction_id"
        - evidence_1: "[[EVIDENCE-*]] A"
        - evidence_2: "[[EVIDENCE-*]] B"
        - conflict_type: "VALUE_MISMATCH|TIMESTAMP_CONFLICT|SOURCE_CONFLICT|LOGICAL_CONFLICT"
        - gap_amount: "if numeric: how much do they differ?"
        - resolution_status: "UNRESOLVED|RESOLVED|ACKNOWLEDGED"
        - resolution_by: "[[AUTHORITY-*]] who resolved it"
        - resolution_explanation: "why is there a difference?"
        - resolution_evidence: "[[EVIDENCE-*]] that explains discrepancy"

    - id: "SOURCE_OF_TRUTH"
      name: "[[SourceOfTruth]]"
      definition: "Canonical source for a particular type of data"
      examples:
        - "[[SOT-Revenue]] = bank statements (not CRM)"
        - "[[SOT-CustomerCount]] = active subscriptions database"
      properties:
        - id: "sot_id"
        - for_data_type: "what type of data? (revenue, customer count, etc.)"
        - primary_source: "primary source system"
        - verification_method: "how do we verify? (monthly reconciliation, audit, etc.)"
        - acceptable_latency_hours: "how fresh must it be?"
        - reconciliation_authority: "who reconciles differences?"
        - update_frequency: "how often is it updated?"

    - id: "AUDIT_TRAIL"
      name: "[[AuditTrail]]"
      definition: "Complete record of all changes and verifications for one entity"
      examples:
        - "[[AUDIT-LT005]] (complete history of LT-005 revenue claims and evidence)"
      properties:
        - id: "audit_trail_id"
        - entity_id: "[[ENTITY-*]] being audited"
        - events: "list of all [[EVENT-*]], [[CLAIM-*]], [[VERIFICATION-*]] in order"
        - created_at: "when was this audit trail initiated?"
        - last_updated_at: "when was it last updated?"
        - verifications_performed: "count of verifications"
        - contradictions_found: "count of conflicts discovered"
        - contradictions_resolved: "count of conflicts resolved"
        - confidence_score: "0-100% based on evidence quality"

  canonical_evidence_types:

    bank_statements:
      id: "[[EVIDENCE-TYPE-BankStatement]]"
      reliability_grade: "VERY_HIGH"
      source: "external bank systems (external source, hard to fake)"
      bias_factors: "none significant"
      acceptable_age_days: 30
      requires_verification: false
      example: "[[EVIDENCE-BankTransaction-LT005-20260925]]"

    customer_records:
      id: "[[EVIDENCE-TYPE-CustomerDatabase]]"
      reliability_grade: "HIGH"
      source: "internal customer/CRM database"
      bias_factors: "data entry errors, deletion/restoration"
      acceptable_age_days: 7
      requires_verification: true
      verification_authority: "[[AUTHORITY-CFO]]"
      example: "[[EVIDENCE-CustomerRecord-ABC-20260920]]"

    invoice_records:
      id: "[[EVIDENCE-TYPE-Invoice]]"
      reliability_grade: "HIGH"
      source: "internal billing system"
      bias_factors: "manual entry errors, duplicate invoicing"
      acceptable_age_days: 14
      requires_verification: true
      verification_authority: "[[AUTHORITY-Controller]]"
      example: "[[EVIDENCE-Invoice-LT005-001234]]"

    employee_attestation:
      id: "[[EVIDENCE-TYPE-EmployeeAttestation]]"
      reliability_grade: "MEDIUM"
      source: "employee/manager statement"
      bias_factors: "recall error, incentive misalignment, optimism bias"
      acceptable_age_days: 3
      requires_verification: true
      verification_authority: "[[AUTHORITY-DepartmentHead]]"
      example: "[[EVIDENCE-Attestation-OPS001-Placements]]"

    system_log:
      id: "[[EVIDENCE-TYPE-SystemLog]]"
      reliability_grade: "HIGH"
      source: "application or database logs"
      bias_factors: "clock skew, log rotation, incomplete coverage"
      acceptable_age_days: 30
      requires_verification: false
      example: "[[EVIDENCE-SystemLog-Dispatch-20260925]]"

    third_party_audit:
      id: "[[EVIDENCE-TYPE-ThirdPartyAudit]]"
      reliability_grade: "VERY_HIGH"
      source: "external auditor or certification"
      bias_factors: "auditor selection bias"
      acceptable_age_days: 365
      requires_verification: false
      example: "[[EVIDENCE-AuditReport-Q3-2026]]"

    sensor_data:
      id: "[[EVIDENCE-TYPE-SensorData]]"
      reliability_grade: "MEDIUM"
      source: "IoT sensors, GPS, etc."
      bias_factors: "sensor error, network outage, spoofing"
      acceptable_age_days: 1
      requires_verification: true
      example: "[[EVIDENCE-GPSLocation-Driver-20260925]]"

  relationship_types:

    - id: "EVIDENCES"
      forward: "[[Evidence]] [[EVIDENCES]] [[Claim]]"
      inverse: "[[Claim]] [[EVIDENCED_BY]] [[Evidence]]"
      description: "This evidence supports this claim"
      properties:
        - evidence_grade: "how strong is this piece of evidence? (WEAK|MODERATE|STRONG|CONCLUSIVE)"
        - weight: "in case of multiple evidences, how much does this one count? (0-100%)"

    - id: "CONTRADICTS"
      forward: "[[Evidence]] [[CONTRADICTS]] [[Evidence]]"
      inverse: "[[Evidence]] [[CONTRADICTED_BY]] [[Evidence]]"
      description: "These two pieces of evidence conflict"
      properties:
        - conflict_magnitude: "how large is the discrepancy?"
        - resolution_status: "UNRESOLVED|RESOLVED"

    - id: "VERIFIES"
      forward: "[[Verification]] [[VERIFIES]] [[Evidence]]"
      inverse: "[[Evidence]] [[VERIFIED_BY]] [[Verification]]"
      description: "This verification confirms (or disputes) this evidence"

    - id: "EXPLAINS"
      forward: "[[Evidence]] [[EXPLAINS]] [[Contradiction]]"
      inverse: "[[Contradiction]] [[EXPLAINED_BY]] [[Evidence]]"
      description: "This evidence explains why two other evidences conflict"

    - id: "SOURCED_FROM"
      forward: "[[Evidence]] [[SOURCED_FROM]] [[SourceOfTruth]]"
      inverse: "[[SourceOfTruth]] [[ORIGINATES]] [[Evidence]]"
      description: "This evidence came from this canonical source"

  graph_constraints:

    constraint_1: "No [[CLAIM-*]] can have status VERIFIED without at least one [[EVIDENCE-*]]"
    constraint_2: "All [[EVIDENCE-*]] with type requiring verification must have corresponding [[VERIFICATION-*]]"
    constraint_3: "If [[CONTRADICTION-*]] exists, [[CLAIM-*]] cannot be VERIFIED until resolution"
    constraint_4: "Evidence age must not exceed [[EvidenceType.acceptable_age_days]]"
    constraint_5: "All [[VERIFICATION-*]] must be performed by appropriate [[AUTHORITY-*]]"
    constraint_6: "Audit trails must capture ALL state changes with provenance"
    constraint_7: "No deletion of evidence or audit trails (append-only)"

  verification_levels:

    unverified: |
      Status: [[CLAIM-*]] with 0 evidence or only ungraded evidence.
      Confidence: 0%. Can be used for hypothesis/prediction but NOT for decisions.
      Action: Requires evidence collection before use.

    weak_evidence: |
      Status: [[CLAIM-*]] with single MEDIUM-grade evidence or multiple LOW-grade.
      Confidence: 20-40%. Can be used for exploratory decisions, NOT for capital allocation.
      Action: Seek additional verification.

    moderate_evidence: |
      Status: [[CLAIM-*]] with HIGH-grade evidence from multiple sources or verified by authority.
      Confidence: 60-75%. Can be used for operational decisions <$50K.
      Action: Monitor for contradictions.

    strong_evidence: |
      Status: [[CLAIM-*]] with VERY_HIGH-grade evidence, verified by appropriate authority, no contradictions.
      Confidence: 85-95%. Can be used for capital decisions <$250K.
      Action: Re-verify periodically.

    conclusive_evidence: |
      Status: [[CLAIM-*]] with multiple VERY_HIGH-grade sources, third-party audit, no contradictions.
      Confidence: 95%+. Can be used for major decisions >$500K.
      Action: Archive audit trail permanently.

  integration_with_other_layers:

    integrates_to_event_graph: |
      [[EVENT-*]] are themselves evidence.
      Query: "What [[EVIDENCE-*]] supports the claim that [[EVENT-PaymentReceived]] happened?"

    integrates_to_state_graph: |
      State transitions must be evidenced.
      Example: Move to [[STATE-Generating-Revenue]] requires [[EVIDENCE-RevenueVerification]].
      Query: "What evidence supports venture entering [[STATE-Generating-Revenue]]?"

    integrates_to_decision_graph: |
      Decisions can only be made with verified claims.
      Query: "What evidence supports [[DECISION-Venture-Pause]]?"

    integrates_to_learning_graph: |
      Contradictions in evidence trigger learning investigations.
      Query: "Why do we have conflicting evidence about LT-005 revenue? What should we improve?"

    integrates_to_authority_graph: |
      Verification authority is defined in [[AUTHORITY-*]].
      Query: "Who has authority to verify this type of [[EVIDENCE-*]]?"

# CRITICAL RULES (ANTIGRAVITY Rule 31 Operationalized)

critical_rules:

  rule_1_no_fake_completion: |
    **No status (especially VERIFIED or COMPLETE) may be assigned without evidence.**

    Status ← Evidence. Not belief, not hope, not assumption.

    If you claim "LT-005 is Generating-Revenue", you must provide:
    - [[EVIDENCE-BankStatement]] showing deposits
    - [[EVIDENCE-CustomerDatabase]] showing active subscriptions
    - [[VERIFICATION-CFO]] confirming numbers
    - No contradictions or [[Contradiction]] fully resolved

  rule_2_contradictions_are_flags: |
    **If [[EVIDENCE-*]] conflict, the [[CLAIM-*]] is DISPUTED, not VERIFIED.**

    Bank says $1,800. CRM says $2,000. You don't average them. You investigate why they differ.

    [[CLAIM-*]] status stays DISPUTED until [[Contradiction]] is resolved with explanatory [[EVIDENCE-*]].

  rule_3_authority_verifies: |
    **Certain [[EVIDENCE-*]] require verification by [[AUTHORITY-*]].**

    Customer database claims require [[AUTHORITY-Controller]] verification.
    Capital allocation claims require [[AUTHORITY-CFO]] verification.
    Strategic claims require [[AUTHORITY-CEO]] or [[AUTHORITY-Founder]] verification.

    Verification is not rubber-stamping. It's active assessment.

  rule_4_stale_evidence_is_no_evidence: |
    **After [[EvidenceType.acceptable_age_days]], [[EVIDENCE-*]] loses weight.**

    A customer record from 90 days ago doesn't prove anything about TODAY.

    [[VERIFICATION-*]] must be re-run periodically.

  rule_5_audit_trail_forever: |
    **Every [[CLAIM-*]], [[VERIFICATION-*]], [[Contradiction]], and resolution is immutable.**

    You can't delete evidence or audits. Only append.

    If you later discover evidence was wrong, you create NEW evidence explaining the error.

# STATUS
status:
  total_evidence_types_defined: 15+
  total_sources_of_truth_defined: 50+
  audit_trail_capability: COMPLETE
  no_fake_completion_enforcement: READY
  next_phase: "Wire verification workflows; require evidence collection at decision time"

