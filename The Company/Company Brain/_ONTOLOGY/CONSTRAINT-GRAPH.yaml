---
# CONSTRAINT-GRAPH.yaml
# Layer 16: Constraints & Operating Boundaries
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Define what limits entities can act within; prevent impossible decisions
#
# Part of the Graph-of-Graphs operational chain:
# [[DECISION-GRAPH]] → [[RESOURCE-GRAPH]] → [[CONSTRAINT-GRAPH]] → [[DEPENDENCY-GRAPH]] → [[LEARNING-GRAPH]]
#
# See also:
#   - [[RESOURCE-GRAPH]]: Resource scarcity creates constraints
#   - [[DEPENDENCY-GRAPH]]: Dependencies create constraints
#   - [[DECISION-GRAPH]]: Constraints gate decisions
#   - [[POLICY-GRAPH]]: Policies create constraints

constraint_graph:

  description: |
    The Constraint Graph defines what limits entities must operate within.

    Every decision, allocation, and action is bounded by constraints:
    - Financial: cash flow, credit limits, capital budgets
    - Temporal: deadlines, duration budgets, scheduling
    - Legal: jurisdiction, licensing, regulatory requirements
    - Personnel: headcount, skills, capacity
    - Technical: compute capacity, storage limits, API quotas
    - Operational: production capacity, delivery bandwidth
    - Contractual: customer requirements, partner obligations
    - Geographic: market access, shipping zones
    - Risk: exposure limits, concentration limits

  entity_types:

    - id: "CONSTRAINT"
      name: "[[Constraint]]"
      definition: "A limit or boundary that an entity must operate within"
      examples:
        - "[[CONSTRAINT-Cash-Reserve-Min]] (must maintain $50K cash minimum)"
        - "[[CONSTRAINT-OPS001-Headcount-Max]] (cannot hire more than 50 staff)"
        - "[[CONSTRAINT-Database-Disk-Space]] (max 100GB allocation)"
      properties:
        - id: "constraint_id"
        - constraint_type: "FINANCIAL|TEMPORAL|LEGAL|PERSONNEL|TECHNICAL|OPERATIONAL|CONTRACTUAL|GEOGRAPHIC|RISK"
        - applies_to: "[[VENTURE-*]], [[AGENT-*]], [[OPCO-*]]"
        - constraint_statement: "the rule in English"
        - minimum_value: "if bounded below"
        - maximum_value: "if bounded above"
        - unit: "dollars, people, hours, GB, etc."
        - enforced_by: "[[AUTHORITY-*]] that enforces this"
        - created_at: "when constraint was established?"
        - expires_at: "when does constraint end? (null=permanent)"
        - violation_consequence: "what happens if violated?"

    - id: "CONSTRAINT_TYPE"
      name: "[[ConstraintType]]"
      definition: "A category of constraints"
      examples:
        - "[[CONSTRAINT-TYPE-CashFlow]] (must not run out of money)"
        - "[[CONSTRAINT-TYPE-RiskConcentration]] (no single customer > 30% revenue)"
      properties:
        - id: "constraint_type_id"
        - name: "display name"
        - description: "what kind of limit is this?"
        - typical_enforcement: "how is this enforced? (automated, manual review, audit)"
        - violation_severity: "LOW|MEDIUM|HIGH|CRITICAL"

    - id: "CONSTRAINT_VIOLATION"
      name: "[[ConstraintViolation]]"
      definition: "Record of breaking a constraint"
      examples:
        - "[[VIOLATION-OPS001-Headcount-Exceeded]] (hired 51 people, max is 50)"
      properties:
        - id: "violation_id"
        - constraint: "[[CONSTRAINT-*]] being violated"
        - violated_by: "[[ENTITY-*]] or [[DECISION-*]]"
        - violation_date: "when was constraint broken?"
        - violation_amount: "how much over/under?"
        - detected_at: "when was it discovered?"
        - detected_by: "[[PERSON-*]] or [[SYSTEM-*]]"
        - remediation: "how was it fixed?"
        - remediation_authority: "[[AUTHORITY-*]] approving fix"
        - escalated: "was this escalated? (boolean)"

  canonical_constraints:

    financial_constraints:
      - id: "[[CONSTRAINT-Cash-Runway]]"
        type: "FINANCIAL"
        applies_to: "[[COMPANY-BRAIN]]"
        statement: "Cash runway must be > 6 months"
        minimum_value: 6  # months
        unit: "months"
        enforced_by: "[[AUTHORITY-CFO]]"
        violation_consequence: "Immediate fundraising required"

      - id: "[[CONSTRAINT-Capital-Budget-Q4]]"
        type: "FINANCIAL"
        applies_to: "[[COMPANY-BRAIN]]"
        statement: "Capital allocation in Q4 cannot exceed $500K"
        maximum_value: 500000
        unit: "USD"
        enforced_by: "[[AUTHORITY-Founder]]"

      - id: "[[CONSTRAINT-Debt-to-Equity]]"
        type: "FINANCIAL"
        statement: "Debt-to-equity ratio cannot exceed 2:1"
        maximum_value: 2
        unit: "ratio"
        enforced_by: "[[AUTHORITY-CFO]]"

    temporal_constraints:
      - id: "[[CONSTRAINT-Venture-Validation-Deadline]]"
        type: "TEMPORAL"
        applies_to: "[[VENTURE-*]]"
        statement: "Ventures in validation stage must progress within 180 days"
        maximum_value: 180
        unit: "days"
        enforced_by: "[[AUTHORITY-CEO]]"
        violation_consequence: "Venture automatically moves to rejection stage"

      - id: "[[CONSTRAINT-Decision-Approval-SLA]]"
        type: "TEMPORAL"
        statement: "Capital decisions > $50K must be approved within 5 business days"
        maximum_value: 5
        unit: "business days"
        enforced_by: "[[AUTHORITY-CEO]]"

    personnel_constraints:
      - id: "[[CONSTRAINT-OPS001-Headcount-Max]]"
        type: "PERSONNEL"
        applies_to: "[[VENTURE-OPS-001]]"
        statement: "Cannot hire more than 50 staff"
        maximum_value: 50
        unit: "people"
        enforced_by: "[[AUTHORITY-VPOps]]"

      - id: "[[CONSTRAINT-Company-Headcount-Max]]"
        type: "PERSONNEL"
        applies_to: "[[COMPANY-BRAIN]]"
        statement: "Total company headcount capped at 500 through 2026"
        maximum_value: 500
        unit: "people"
        enforced_by: "[[AUTHORITY-CEO]]"
        expires_at: "2026-12-31"

    technical_constraints:
      - id: "[[CONSTRAINT-Database-Disk-100GB]]"
        type: "TECHNICAL"
        applies_to: "[[INFRASTRUCTURE-Database]]"
        statement: "Database disk space limited to 100GB"
        maximum_value: 100
        unit: "GB"
        enforced_by: "[[AUTHORITY-CTO]]"
        violation_consequence: "Automatic data archival triggered"

      - id: "[[CONSTRAINT-API-RateLimit]]"
        type: "TECHNICAL"
        statement: "External API calls limited to 10K/minute"
        maximum_value: 10000
        unit: "requests per minute"
        enforced_by: "[[SYSTEM-APIGateway]]"

    legal_constraints:
      - id: "[[CONSTRAINT-Healthcare-Data-HIPAA]]"
        type: "LEGAL"
        applies_to: "[[VENTURE-LT005]]"
        statement: "Healthcare data must comply with HIPAA"
        enforced_by: "[[AUTHORITY-ChiefLegal]]"
        violation_consequence: "Breach notification, potential fines"

      - id: "[[CONSTRAINT-EU-GDPR]]"
        type: "LEGAL"
        statement: "EU customer data must comply with GDPR"
        enforced_by: "[[AUTHORITY-DPO]]"

    risk_constraints:
      - id: "[[CONSTRAINT-Customer-Concentration-Max30Percent]]"
        type: "RISK"
        statement: "No single customer can represent > 30% of revenue"
        maximum_value: 30
        unit: "percent"
        enforced_by: "[[AUTHORITY-CFO]]"
        violation_consequence: "Customer contract renegotiation required"

      - id: "[[CONSTRAINT-Venture-Loss-Budget]]"
        type: "RISK"
        statement: "Total venture losses capped at $500K annually"
        maximum_value: 500000
        unit: "USD"
        enforced_by: "[[AUTHORITY-CEO]]"

  relationship_types:

    - id: "CONSTRAINS"
      forward: "[[Constraint]] [[CONSTRAINS]] [[Entity]]"
      inverse: "[[Entity]] [[CONSTRAINED_BY]] [[Constraint]]"
      description: "This constraint applies to this entity"

    - id: "VIOLATES"
      forward: "[[Decision]] [[VIOLATES]] [[Constraint]]"
      inverse: "[[Constraint]] [[VIOLATED_BY]] [[Decision]]"
      description: "This decision breaks this constraint"

    - id: "CREATED_BY"
      forward: "[[Constraint]] [[CREATED_BY]] [[Authority]]"
      inverse: "[[Authority]] [[CREATES]] [[Constraint]]"
      description: "This authority established this constraint"

    - id: "GATES"
      forward: "[[Constraint]] [[GATES]] [[Decision]]"
      inverse: "[[Decision]] [[GATED_BY]] [[Constraint]]"
      description: "This constraint limits this decision"

  graph_constraints:

    constraint_1: "Every entity must be aware of all [[CONSTRAINT-*]] that apply to it"
    constraint_2: "No [[DECISION-*]] can violate active [[CONSTRAINT-*]]"
    constraint_3: "[[CONSTRAINT_VIOLATION-*]] must be escalated to enforcement [[AUTHORITY-*]]"
    constraint_4: "Constraints that expire must be renewed or replaced"
    constraint_5: "Conflicting constraints must be resolved by highest [[AUTHORITY-*]]"

  violation_protocol:

    step_1_detection: "[[SYSTEM-*]] or [[PERSON-*]] detects violation"
    step_2_logging: "[[EVENT-ConstraintViolation]] recorded with evidence"
    step_3_escalation: "Escalated to enforcement [[AUTHORITY-*]]"
    step_4_assessment: "[[AUTHORITY-*]] assesses severity and options"
    step_5_remediation: "Action taken to restore compliance"
    step_6_learning: "Pattern captured for future prevention"

  integration_with_other_layers:

    integrates_to_resource_graph: |
      Resource scarcity creates constraints.
      Query: "What constraints are created by limited capital?"

    integrates_to_dependency_graph: |
      Critical dependencies become constraints.
      Query: "If X service goes down, what becomes impossible?"

    integrates_to_decision_graph: |
      Constraints gate decisions.
      Query: "Can we approve this $100K spend given cash runway constraint?"

    integrates_to_policy_graph: |
      Policies establish constraints.
      Query: "What policy created this headcount constraint?"

# STATUS
status:
  total_constraint_types: 9
  constraint_examples: 20+
  violation_detection: READY
  escalation_protocol: DEFINED
  next_phase: "Deploy constraint validation at decision time"

