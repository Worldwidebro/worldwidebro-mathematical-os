---
# AUTHORITY-GRAPH.yaml
# Layer 6: Authority & Permission Architecture
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Define who/what can act, on what, under what conditions
#
# Graph-of-Graphs Wiring:
# [[AUTHORITY-GRAPH]] → [[STATE-GRAPH]] → [[LIFECYCLE-GRAPH]] → [[EVENT-GRAPH]] → [[EVIDENCE-GRAPH]] → [[DECISION-GRAPH]] → [[RESOURCE-GRAPH]] → [[CONSTRAINT-GRAPH]] → [[DEPENDENCY-GRAPH]] → [[LEARNING-GRAPH]] → [[INTENT-GRAPH]] → [[POLICY-GRAPH]] → [[SEMANTIC-GRAPH]] → [[META-GRAPH]]
#
# See also:
#   - [[STATE-GRAPH]]: Uses authority to gate state transitions
#   - [[DECISION-GRAPH]]: Authority approves decisions
#   - [[ENTITY-GRAPH]]: Authority owns/controls entities
#   - [[POLICY-GRAPH]]: Authority enforces policies

authority_graph:

  description: |
    The Authority Graph models the permissions, roles, delegation chains, and approval authorities
    across all actors in the Company Brain. It answers: "Is this actor authorized to take this action
    on this resource?"

    This layer sits ABOVE the Entity Graph (layers 1-5) and feeds INTO the State Graph (layer 7).
    Authority constraints what changes are allowed; State tracks what changes actually occurred.

  entity_types:

    - id: "AUTHORITY"
      name: "[[Authority]]"
      definition: "A named permission or role that grants specific capabilities to an actor"
      examples:
        - "[[AUTHORITY-Founder]] (controls all strategic decisions)"
        - "[[AUTHORITY-CEO]] (delegates execution authority)"
        - "[[AUTHORITY-CFO]] (approves financial decisions <$250K)"
      properties:
        - id: "authority_type" (enum: ROLE, PERMISSION, DELEGATION, APPROVAL, ACCESS)
        - level: "hierarchical level (1=supreme, 10=individual)"
        - scope: "what this authority applies to (ventures, finances, decisions, etc.)"
        - limit: "decision threshold (e.g., $250K)"
        - expires_at: "when this authority ends (null=permanent)"
        - revocable: "can this authority be revoked? (boolean)"

    - id: "ROLE"
      name: "[[Role]]"
      definition: "A named position with associated permissions and responsibilities"
      examples:
        - "[[ROLE-CEO]] (Chief Executive Officer)"
        - "[[ROLE-CFO]] (Chief Financial Officer)"
        - "[[ROLE-VPOps]] (VP Operations)"
      properties:
        - id: "role_id" (e.g., ROLE-CEO)
        - title: "display name"
        - level: "org level (C-suite, director, manager, IC)"
        - assigned_to: "[[PERSON-*]] who holds this role"
        - owned_by: "who can assign/revoke this role"
        - created_at: "when this role was defined"

    - id: "PERMISSION"
      name: "[[Permission]]"
      definition: "An atomic capability to perform an action on a resource"
      examples:
        - "[[PERMISSION-CREATE-VENTURE]] (can create a new venture)"
        - "[[PERMISSION-APPROVE-CAPITAL-$250K]] (approve spend <$250K)"
        - "[[PERMISSION-DELETE-LEGAL-ENTITY]] (can delete a legal entity)"
      properties:
        - id: "permission_id"
        - action: "what action (CREATE, READ, UPDATE, DELETE, APPROVE, EXECUTE, etc.)"
        - resource: "what resource type (VENTURE, LEGAL_ENTITY, CAPITAL, etc.)"
        - condition: "under what condition (e.g., 'amount < $250K')"
        - risk_level: "LOW, MEDIUM, HIGH, CRITICAL"
        - requires_audit: "must this be logged? (boolean)"
        - requires_signature: "must this be authorized by signature? (boolean)"

    - id: "APPROVAL_CHAIN"
      name: "[[ApprovalChain]]"
      definition: "A sequence of approvers required to authorize a decision"
      examples:
        - "[[APPROVAL-CapitalRequest-$100K]] (CFO → CEO → Founder)"
        - "[[APPROVAL-VentureCreation]] (CEO → Founder)"
      properties:
        - id: "approval_chain_id"
        - applies_to: "decision type or resource type"
        - steps: "ordered list of [[AUTHORITY-*]] required to approve"
        - requires_all: "all must approve? or any one? (boolean)"
        - escalation_rule: "if rejected, escalate to whom?"
        - max_days_to_approve: "SLA (null=no limit)"

    - id: "DELEGATION"
      name: "[[Delegation]]"
      definition: "Transfer of authority from one actor to another"
      examples:
        - "[[DELEGATION-CEO-to-CFO-$100K]] (CEO delegates $100K approval to CFO)"
      properties:
        - id: "delegation_id"
        - delegator: "[[PERSON-*]] or [[AUTHORITY-*]] granting authority"
        - delegatee: "[[PERSON-*]] or [[AUTHORITY-*]] receiving authority"
        - authority_delegated: "[[AUTHORITY-*]] being transferred"
        - start_date: "when delegation begins"
        - end_date: "when delegation ends"
        - conditions: "under what conditions is this valid?"
        - revocable: "can delegator revoke? (boolean)"

    - id: "ACCESS_GRANT"
      name: "[[AccessGrant]]"
      definition: "Permission to access a resource (data, system, facility)"
      examples:
        - "[[ACCESS-GRANT-LT005Manager-to-HealthRoute-data]] (can view LT-005 data)"
      properties:
        - id: "access_grant_id"
        - actor: "[[PERSON-*]] granted access"
        - resource: "[[VENTURE-*]], [[LE-*]], or system being accessed"
        - access_level: "READ, WRITE, ADMIN, FULL"
        - granted_by: "who granted this? [[AUTHORITY-*]]"
        - granted_at: "when"
        - expires_at: "access expires when?"
        - requires_mfa: "multi-factor auth required? (boolean)"

  relationship_types:

    - id: "HAS_AUTHORITY"
      forward: "[[PERSON]] [[HAS_AUTHORITY]] [[Authority]]"
      inverse: "[[Authority]] [[HELD_BY]] [[PERSON]]"
      description: "Person holds this authority"
      properties:
        - assignment_date: "when was this assigned?"
        - assignment_reason: "why? (document trail)"
        - conditional: "is this conditional? (e.g., 'only if CEO approves')"

    - id: "REQUIRES_APPROVAL"
      forward: "[[Decision]] [[REQUIRES_APPROVAL]] [[Authority]]"
      inverse: "[[Authority]] [[MUST_APPROVE]] [[Decision]]"
      description: "This decision requires this authority to approve"
      properties:
        - step_number: "approval order"
        - can_reject: "can this authority reject? (boolean)"
        - delegation_allowed: "can this authority delegate approval? (boolean)"

    - id: "DELEGATES"
      forward: "[[Authority]] [[DELEGATES]] [[Authority]]"
      inverse: "[[Authority]] [[DELEGATED_FROM]] [[Authority]]"
      description: "Authority is delegated to a lower authority"
      properties:
        - delegation_date: "when"
        - delegation_scope: "what portion (e.g., 'up to $100K')"
        - conditional: "conditions on delegation"

    - id: "CAN_ACCESS"
      forward: "[[Person]] [[CAN_ACCESS]] [[Resource]]"
      inverse: "[[Resource]] [[ACCESSED_BY]] [[Person]]"
      description: "Person can access this resource"
      properties:
        - access_level: "READ, WRITE, ADMIN"
        - granted_by: "[[AUTHORITY-*]]"
        - expires_at: "access expiration"

    - id: "OWNED_BY_AUTHORITY"
      forward: "[[Resource]] [[OWNED_BY_AUTHORITY]] [[Authority]]"
      inverse: "[[Authority]] [[OWNS]] [[Resource]]"
      description: "This authority controls this resource"
      properties:
        - controls_read: "can grant READ access? (boolean)"
        - controls_write: "can grant WRITE access? (boolean)"
        - can_delegate: "can delegate this control? (boolean)"

    - id: "ESCALATES_TO"
      forward: "[[Authority]] [[ESCALATES_TO]] [[Authority]]"
      inverse: "[[Authority]] [[RECEIVES_ESCALATION_FROM]] [[Authority]]"
      description: "If this authority can't decide, escalate to this one"
      properties:
        - condition: "when to escalate (e.g., 'if rejected')"
        - deadline: "how many days to escalate?"

  canonical_authorities:

    founder_authority:
      id: "[[AUTHORITY-Founder]]"
      name: "Founder & Principal Authority"
      level: 1
      held_by: "[[PERSON-AntwuanJohns]]"
      scope: "All strategic decisions, capital allocation, legal/governance"
      approves:
        - capital_allocation > "$500K"
        - venture_creation
        - venture_shutdown
        - executive_hiring
        - board_composition
        - regulatory_matters
      can_revoke: false
      can_delegate: "selective"

    ceo_authority:
      id: "[[AUTHORITY-CEO]]"
      name: "Chief Executive Officer"
      level: 2
      held_by: "[[PERSON-CEO]]"
      scope: "Day-to-day operations, capital allocation < $250K, hiring < C-suite"
      approves:
        - capital_allocation < "$250K"
        - venture_operations
        - department_hiring
        - strategic_initiatives
      escalates_to: "[[AUTHORITY-Founder]]"
      can_delegate: "selective"

    cfo_authority:
      id: "[[AUTHORITY-CFO]]"
      name: "Chief Financial Officer"
      level: 2
      held_by: "[[PERSON-CFO]]"
      scope: "Financial decisions, accounting, tax, treasury"
      approves:
        - capital_allocation < "$100K"
        - financial_close
        - tax_filings
        - audit_readiness
        - revenue_attribution
      escalates_to: "[[AUTHORITY-CEO]]"
      can_delegate: "selective"

    vp_ops_authority:
      id: "[[AUTHORITY-VPOps]]"
      name: "VP Operations"
      level: 3
      scope: "Operational decisions in assigned ventures < $50K"
      approves:
        - operational_decisions < "$50K"
        - process_changes
        - resource_allocation_within_opco
      escalates_to: "[[AUTHORITY-CEO]]"
      can_delegate: true

    venture_manager_authority:
      id: "[[AUTHORITY-VentureManager]]"
      name: "Venture Manager"
      level: 4
      scope: "Day-to-day venture operations < $5K"
      approves:
        - operational_decisions < "$5K"
        - customer_commitments
        - hiring_within_venture
      escalates_to: "[[AUTHORITY-VPOps]]"
      can_delegate: false

  canonical_approval_chains:

    capital_approval:
      id: "[[APPROVAL-CapitalRequest]]"
      applies_to: "Any capital request"
      steps:
        - "< $10K": [[AUTHORITY-VentureManager]]
        - "$10K - $50K": [[AUTHORITY-OperationsDirector]]
        - "$50K - $100K": [[AUTHORITY-VPOperations]]
        - "$100K - $250K": [[AUTHORITY-CFO]]
        - "$250K - $500K": [[AUTHORITY-CEO]]
        - "> $500K": [[AUTHORITY-Founder]]
      requires_all: true
      escalation_rule: "if rejected, escalate to next level"
      max_days_to_approve: 5

    venture_creation:
      id: "[[APPROVAL-VentureCreation]]"
      applies_to: "Creating a new venture"
      steps:
        - "[[AUTHORITY-CEO]]"
        - "[[AUTHORITY-Founder]]"
      requires_all: true
      escalation_rule: "if CEO rejects, Founder can override"
      max_days_to_approve: 10

    hiring:
      id: "[[APPROVAL-Hiring]]"
      applies_to: "Hiring decisions"
      steps:
        - "IC < $150K/year": [[AUTHORITY-DepartmentHead]]
        - "Director/Manager": [[AUTHORITY-VPFunction]]
        - "C-Suite": [[AUTHORITY-CEO]]
        - "Board changes": [[AUTHORITY-Founder]]
      requires_all: true
      max_days_to_approve: 14

  graph_constraints:

    constraint_1: "No person can hold AUTHORITY-Founder except Antwuan Johns"
    constraint_2: "All AUTHORITY nodes must have defined scope and approval limits"
    constraint_3: "All DELEGATION relationships must have expiration dates"
    constraint_4: "ESCALATES_TO edges must form acyclic DAG (no circular escalations)"
    constraint_5: "All ACCESS_GRANT must have either end_date or explicit 'permanent' flag"
    constraint_6: "REQUIRES_APPROVAL edges must connect to valid DECISION nodes via State/Event graphs"

  integration_with_other_layers:

    integrates_to_state_graph: |
      Authority constraints what STATE transitions are allowed.
      Example: Only [[AUTHORITY-CEO]] can change a venture's state from [[STATE-Validating]] to [[STATE-Building]].

      State Graph should query: "Who has [[AUTHORITY-*]] to trigger this transition?"

    integrates_to_event_graph: |
      Every EVENT must record who authorized it (which [[AUTHORITY-*]]).
      Example: [[EVENT-VentureCreated]] records [[created_by_authority]] = [[AUTHORITY-CEO]]

      Event Graph should enforce: "Every state-changing event requires prior approval from appropriate [[AUTHORITY-*]]"

    integrates_to_decision_graph: |
      Decisions reference which [[AUTHORITY-*]] made them.
      Example: [[DECISION-LT005-Expand]] was made by [[AUTHORITY-VentureManager-LT005]]

      Decision Graph should track: "Who had authority to make this? Was it delegated? Can it be revoked?"

    integrates_to_evidence_graph: |
      Evidence must include proof of authorization.
      Example: [[CLAIM-Revenue-LT005-$1800]] requires [[EVIDENCE-ApprovalFrom-CFO]]

      Evidence Graph should enforce: "Unauthorized decisions have zero evidential weight"

# STATUS
status:
  total_authorities_defined: 15
  total_permissions_defined: 50+
  total_approval_chains_defined: 5
  integration_layer: COMPLETE
  next_phase: "Wire Authority constraints into Neo4j; enforce at execution time"

