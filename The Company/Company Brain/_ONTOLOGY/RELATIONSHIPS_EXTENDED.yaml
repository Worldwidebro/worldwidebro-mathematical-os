  - ontology: "RELATIONSHIPS_EXTENDED connects to COGNITION_FLOW.yaml"
    mechanism: "Relationship stages map to pipeline stages (OBSERVATION → EVOLUTION)"
    validation: "Verify relationships align with 22-stage flow"

  - ontology: "RELATIONSHIPS_EXTENDED connects to FABRICS.yaml"
    mechanism: "Relationships classified by fabric (REALITY, INFORMATION, KNOWLEDGE, COGNITION, DISCOVERY, DECISION, AGENT, EXECUTION, LEARNING)"
    validation: "Cross-check relationships against 9-fabric scope"

  - ontology: "RELATIONSHIPS_EXTENDED connects to PERSONAL_FINANCIAL_GRAPH.yaml"
    mechanism: "Personal financial relationships enable Personal Freedom Cash calculation"
    validation: "Verify money separation (company vs personal) is maintained"

  - ontology: "RELATIONSHIPS_EXTENDED connects to CAPITAL_RESTRICTIONS_GRAPH.yaml"
    mechanism: "Capital flow relationships must respect source restrictions"
    validation: "Verify authorization chains and use-of-funds compliance"

  - ontology: "RELATIONSHIPS_EXTENDED connects to FUNDING_KNOWLEDGE_GRAPH.yaml"
    mechanism: "Funding match relationships must check eligibility criteria"
    validation: "Cross-validate NAICS, stage, sector, geography matches"

  - ontology: "RELATIONSHIPS_EXTENDED connects to MARKETING_CAMPAIGN_OS.yaml"
    mechanism: "Campaign relationships connect venture → audience → channel → message → outcome"
    validation: "Verify campaign completeness and tracking capability"

  - ontology: "RELATIONSHIPS_EXTENDED connects to 20-GRAPH_ARCHITECTURE.yaml"
    mechanism: "Graph integration relationships enable unified queries across domains"
    validation: "Verify all 20 graphs maintain consistent entity references"

