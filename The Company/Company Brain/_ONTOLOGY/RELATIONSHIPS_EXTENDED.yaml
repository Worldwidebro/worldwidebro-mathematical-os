# Relationship Properties
# All relationships carry these optional properties:
# - confidence: [0.0-1.0] for probabilistic relationships
# - timestamp: ISO 8601 creation/verification date
# - evidence_id: reference to supporting evidence
# - context: free-text contextual notes
# - verified_by: who verified this relationship
# - criticality: CRITICAL, HIGH, MEDIUM, LOW
# - notes: implementation notes or caveats

relationship_categories_detailed:

  observation:
    description: "Core sensing and signal detection relationships"
    use_case: "Track how entities observe and measure the world"

  cognitive:
    description: "Reasoning, inference, and knowledge relationships"
    use_case: "Map how entities understand, reason about, and derive meaning"

  causality:
    description: "Causal and dependency relationships"
    use_case: "Understand what causes what and what depends on what"

  organizational:
    description: "Organizational structure and hierarchy"
    use_case: "Map organizational relationships, roles, responsibilities"

  operational:
    description: "System operations, tool usage, data flow"
    use_case: "Track how systems execute tasks, use tools, and process data"

  learning:
    description: "Learning, improvement, and evolution"
    use_case: "Understand how entities learn, improve, and update"

  evidence:
    description: "Provenance, validation, and evidence"
    use_case: "Track sources of claims, evidence quality, verification"

  structural:
    description: "Component composition and inheritance"
    use_case: "Understand how systems are composed and structured"

  synergy:
    description: "Value creation through combinations"
    use_case: "Identify synergies, network effects, and combined value"

  financial:
    description: "Financial relationships and value transfer"
    use_case: "Track costs, revenue, investment, and value creation"

  temporal:
    description: "Time-based and sequencing relationships"
    use_case: "Understand temporal dependencies and scheduling"

  governance:
    description: "Rules, permissions, compliance, authority"
    use_case: "Track governance, permissions, accountability"

  personal_financial:
    description: "Personal money flows, ownership, and spendability"
    use_case: "Separate company money from personal money; determine affordability; track obligations vs discretionary cash"
    graph_reference: "PERSONAL_FINANCIAL_GRAPH.yaml"

  capital_flow:
    description: "Company capital generation and authorized transfer to personal"
    use_case: "Track money from revenue → company obligations → authorized compensation/distribution → personal income"
    graph_reference: "CAPITAL_FLOW_GRAPH.yaml"

  funding_match:
    description: "Venture eligibility for specific capital sources"
    use_case: "Match ventures to grants, loans, business credit, equity based on NAICS, stage, sector, geography, capital requirement"
    graph_reference: "FUNDING_KNOWLEDGE_GRAPH.yaml"

  marketing_campaign:
    description: "Marketing campaigns, channels, content, and audience targeting"
    use_case: "Connect ventures → campaigns → channels → content → audience → leads → conversions"
    graph_reference: "MARKETING_CAMPAIGN_OS.yaml"

  outreach_crm:
    description: "Sales and relationship management through full pipeline"
    use_case: "Track prospect → contact → message → reply → meeting → demo → diligence → deal → funding"
    graph_reference: "OUTREACH_ENGINE.yaml"

  venture_readiness:
    description: "Product maturity, demo readiness, funding readiness scoring"
    use_case: "Identify what's missing (repo, prototype, demo, video, customers) that blocks funding/outreach"
    graph_reference: "VENTURE_READINESS_SCORING.yaml"

  graph_integration:
    description: "Cross-references between 20-graph architecture domains"
    use_case: "Connect Identity → Knowledge → Relationship → Operational → Financial layers; enable unified queries"
    graph_reference: "20_GRAPH_ARCHITECTURE.yaml"

  naics_routing:
    description: "NAICS as universal key routing ventures to programs, lenders, investors"
    use_case: "Determine eligibility for grants, loans, credit, investors based on industry classification"
    graph_reference: "NAICS_ROUTING_LOGIC.yaml"

# Quality Standards by Category
quality_standards:

  observation:
    completeness: "Must specify observation modality (detect, measure, sense)"
    directness: "Direct observation relationships only"
    falsifiability: "Observable facts must be testable"

  cognitive:
    confidence_threshold: "Inference relationships require 0.7+ confidence"
    transivity: "Some relationships are transitive (e.g., IMPLIES)"
    explicitness: "Cognitive relationships should be explicit, not inferred"

  causality:
    temporal_ordering: "Causal relations must have clear temporal precedence"
    mechanism: "Direct cause relationships should specify mechanism"
    strength: "Must specify causality strength (direct, contributing, enabling)"

  organizational:
    current_state: "Organizational relationships are current state, not historical"
    formality: "Distinguish formal (roles) from informal (collaboration)"
    authority: "Authority relationships must specify scope/limits"

  operational:
    observability: "Operational relationships must be observable/measurable"
    latency: "Should specify typical latency/timing when relevant"
    frequency: "Capture how often relationship is exercised"

  learning:
    verification: "Learning relationships should be verified before recording"
    generalizability: "Lessons should specify applicability scope"
    retention: "Should specify how long learning is retained"

  evidence:
    sourcing: "All evidence relationships must cite original source"
    confidence: "Evidence relationships must include confidence score"
    recency: "Should track when evidence was last verified"

  structural:
    completeness: "All components must be explicitly contained"
    hierarchy: "Inheritance hierarchies should be acyclic"
    interfaces: "Interfaces must be well-defined and versioned"

  synergy:
    measurability: "Synergies should have quantifiable metrics"
    independence: "Synergies should be independent of component order"
    sustainability: "Should specify how synergy is maintained over time"

  financial:
    precision: "Financial relationships must include currency and precision"
    timing: "Timing of financial flows should be specified"
    accounting: "Should map to accounting standards when applicable"

  temporal:
    precision: "Temporal relationships must specify timezone for timestamps"
    ranges: "Durations should be specified with clear boundaries"
    precision_units: "Should specify precision (day/hour/minute/second)"

  governance:
    authority: "Governance relationships must cite authoritative source"
    scope: "Scope of governance rules should be explicit"
    enforcement: "Should specify how governance is enforced"

  personal_financial:
    separation: "Must maintain hard boundary between company and personal money"
    authorization: "Personal spending requires legitimate authorization mechanism (salary, distribution, reimbursement)"
    documentation: "All personal financial relationships must be documentable"
    tax_treatment: "Must specify tax implications (income, deduction, distribution)"
    reserve_protection: "Emergency reserves should be protected from discretionary relationships"

  capital_flow:
    authorization: "All transfers must follow authorized paths (compensation, distribution, reimbursement)"
    restrictions: "Must respect capital use restrictions from funding agreements"
    documentation: "All capital flows must be recorded and auditable"
    timing: "Must specify when cash becomes available vs. obligated"
    approval_chain: "Complex transfers should specify approval authority"

  funding_match:
    eligibility_verification: "Eligibility relationships must cite specific program/lender requirements"
    agreement_reference: "Must reference funding agreement terms and conditions"
    amount_range: "Check size must be within lender/investor specified range"
    stage_match: "Must verify venture stage matches funding program stage"
    sector_alignment: "Sector match must be confirmed against investor/lender thesis"

  marketing_campaign:
    audience_clarity: "Campaign must clearly specify target audience"
    channel_appropriateness: "Channel selection must align with audience media habits"
    message_consistency: "Message should be consistent across campaign materials"
    success_metrics: "Campaign must define measurable success criteria"
    tracking: "All campaign elements must be trackable and attributable"

  outreach_crm:
    contact_accuracy: "Contact information must be current and verified"
    interaction_history: "All interactions must be logged with timestamp and outcome"
    next_action_clarity: "Must specify clear next action and responsible party"
    follow_up_timing: "Follow-up sequences must have defined timing"
    deal_stage_accuracy: "Must accurately reflect current stage in sales pipeline"

  venture_readiness:
    blocking_issue_clarity: "Blocking issues must be specific and measurable"
    readiness_score_justification: "Scores must be based on specific criteria"
    demo_completeness: "Demo readiness must specify what's missing"
    funding_package_status: "Must track status of required funding materials"
    update_frequency: "Readiness assessment should be updated when blockers change"

  graph_integration:
    cross_reference_validity: "All cross-references must point to existing entities"
    consistency: "Relationships must be consistent across referencing graphs"
    bidirectionality: "If A references B, B should reference A where appropriate"
    query_support: "Integration must support unified queries across graphs"
    versioning: "Must track which graph version is referenced"

  naics_routing:
    naics_verification: "NAICS code must be current and verified"
    program_eligibility: "Eligibility must be confirmed against current program requirements"
    lender_alignment: "Lender acceptance of NAICS category must be verified"
    investor_sector_match: "Must check investor sector exclusions/focuses"
    documentation: "Routing decisions must be documented with reasoning"

