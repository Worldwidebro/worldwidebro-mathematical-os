---
# DECISION-GRAPH.yaml
# Layer 14: Decisions & Choice Architecture
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Model every decision, its options, criteria, authority, and outcomes

decision_graph:

  description: |
    The Decision Graph captures **every meaningful choice** made in the company.

    From strategic ("Expand to UK market?") to operational ("Ship feature X or Y?") to tactical ("Approve $25K spend?").

    This layer sits AFTER Evidence (layer 11) and synthesizes Authority, State, Lifecycle, Event, and Evidence.
    Every decision query answers:
    - What choice was made?
    - By whom (authority)?
    - Based on what options?
    - Against what criteria?
    - Using what evidence?
    - What was the outcome?
    - What did we learn?

  entity_types:

    - id: "DECISION"
      name: "[[Decision]]"
      definition: "A documented choice between two or more options"
      examples:
        - "[[DECISION-OPS001-ScaleOrPause]] (scale OPS-001 operations or pause?)"
        - "[[DECISION-LT005-HealthcareExpand]] (expand to healthcare logistics?)"
        - "[[DECISION-CFOApprov-$50K-Venture]] (approve $50K capital request for venture?)"
      properties:
        - id: "decision_id"
        - decision_type: "STRATEGIC|OPERATIONAL|TACTICAL|FINANCIAL|GOVERNANCE"
        - title: "human-readable title"
        - context: "why was this decision needed?"
        - proposer: "[[PERSON-*]] who raised the question"
        - proposed_at: "when was decision first proposed?"
        - decision_maker: "[[AUTHORITY-*]] who makes the final choice"
        - status: "PROPOSED|REVIEW|APPROVED|REJECTED|EXECUTING|COMPLETE"
        - decision_made_at: "when was choice made?"
        - decision_made_by: "[[PERSON-*]] acting as [[AUTHORITY-*]]"
        - chosen_option: "which option was selected?"
        - rationale: "why this option?"
        - expected_outcome: "what should happen if decision succeeds?"
        - actual_outcome: "what actually happened?"
        - outcome_measured_at: "when was outcome assessed?"
        - learning: "what did we learn?"
        - reversible: "can this decision be undone? (boolean)"
        - reversibility_cost: "cost if we need to reverse? (time, money, etc.)"
        - appeals_allowed: "can decision be appealed? (boolean)"

    - id: "DECISION_OPTION"
      name: "[[Option]]"
      definition: "One of the choices available for a decision"
      examples:
        - "[[OPTION-OPS001-Scale-Aggressive]] (aggressive scaling, $200K investment)"
        - "[[OPTION-OPS001-Pause-Evaluate]] (pause, evaluate market)"
      properties:
        - id: "option_id"
        - decision: "[[DECISION-*]] this is an option for"
        - name: "option name"
        - description: "what does this option involve?"
        - cost: "financial cost to pursue"
        - time_to_execute: "weeks/months to implement"
        - required_resources: "people, capital, infrastructure"
        - risks: "what could go wrong?"
        - upside: "what's the best case?"
        - downside: "what's the worst case?"
        - alignment_with_strategy: "does this fit our strategy?"
        - probability_of_success: "0-100% estimated success rate"
        - expected_value: "if probabilistic: EV = (success_prob × upside) + (failure_prob × downside)"

    - id: "DECISION_CRITERIA"
      name: "[[DecisionCriteria]]"
      definition: "A dimension by which to evaluate options"
      examples:
        - "[[CRITERIA-Revenue-Impact]] (how much revenue does this generate?)"
        - "[[CRITERIA-Time-to-Market]] (how fast can we execute?)"
        - "[[CRITERIA-Risk-Level]] (what's the risk?)"
      properties:
        - id: "criteria_id"
        - decision: "[[DECISION-*]] this criteria applies to"
        - name: "criteria name"
        - description: "what does this criteria measure?"
        - weight: "importance weight (0-100)"
        - measurement_method: "how do we measure each option against this?"
        - scale: "1-5? 1-10? $? months?"
        - is_go_no_go: "is this a dealbreaker criterion? (boolean)"

    - id: "DECISION_EVALUATION"
      name: "[[Evaluation]]"
      definition: "Score for one option against one criteria"
      examples:
        - "[[EVAL-OPS001-Scale-vs-Revenue-Impact]] (aggressive scaling scores 9/10 on revenue)"
      properties:
        - id: "eval_id"
        - option: "[[OPTION-*]] being evaluated"
        - criteria: "[[CRITERIA-*]] being measured against"
        - score: "numeric score (0-10, 1-5, %, $, months, etc.)"
        - rationale: "why this score?"
        - evidence: "[[EVIDENCE-*]] supporting this score"
        - evaluator: "[[PERSON-*]] who performed evaluation"
        - evaluated_at: "when?"
        - confidence: "HIGH|MEDIUM|LOW in this score"

    - id: "DECISION_MATRIX"
      name: "[[DecisionMatrix]]"
      definition: "Full evaluation of all options against all criteria"
      examples:
        - "[[MATRIX-OPS001-Scale-Decision]] (complete options×criteria grid)"
      properties:
        - id: "matrix_id"
        - decision: "[[DECISION-*]] this matrix is for"
        - options: "list of [[OPTION-*]]"
        - criteria: "list of [[CRITERIA-*]]"
        - scores: "complete grid of [[EVALUATION-*]]"
        - recommended_option: "which option scores highest?"
        - recommendation_score: "weighted total score"
        - created_at: "when was matrix built?"
        - created_by: "[[PERSON-*]] who built it?"

    - id: "APPROVAL_RECORD"
      name: "[[ApprovalRecord]]"
      definition: "Record that decision was approved by required authority"
      examples:
        - "[[APPROVAL-OPS001-Scale-by-CEO]] (CEO approved scaling decision)"
      properties:
        - id: "approval_id"
        - decision: "[[DECISION-*]] being approved"
        - approved_by: "[[PERSON-*]] performing approval"
        - approval_authority: "[[AUTHORITY-*]] being exercised"
        - approved_at: "timestamp"
        - approval_method: "VERBAL|EMAIL|DIGITAL_SIGNATURE|BOARD_VOTE"
        - approval_conditions: "any conditions on approval?"
        - can_be_overridden: "can higher authority override? (boolean)"
        - override_deadline: "how long until final?"

    - id: "DECISION_OUTCOME"
      name: "[[Outcome]]"
      definition: "What actually happened after a decision was made"
      examples:
        - "[[OUTCOME-OPS001-Scale-Success]] (scaling achieved 25% MoM growth)"
      properties:
        - id: "outcome_id"
        - decision: "[[DECISION-*]] this outcome resulted from"
        - execution_start: "when did implementation start?"
        - execution_end: "when did it finish?"
        - status: "SUCCESS|PARTIAL|FAILED"
        - goal: "what was the goal?"
        - result: "what actually happened?"
        - variance: "how much did result differ from expectation?"
        - timeline_variance: "how much longer/shorter than planned?"
        - cost_variance: "how much over/under budget?"
        - root_cause_if_failed: "if failed, why?"
        - learning: "what should we do differently next time?"
        - evidence: "[[EVIDENCE-*]] proving this outcome"

  canonical_decision_types:

    strategic_decisions:
      type: "STRATEGIC"
      examples:
        - "Market expansion decisions"
        - "Acquisition/divestiture"
        - "Major technology platform changes"
        - "Organization restructuring"
      authority_required: "[[AUTHORITY-CEO]] or [[AUTHORITY-Founder]]"
      approval_deadline_days: 14
      reversibility: "DIFFICULT"

    financial_decisions:
      type: "FINANCIAL"
      examples:
        - "Capital allocation >$50K"
        - "Debt decisions"
        - "Dividend or distribution"
        - "Major expense approval"
      authority_required: "[[AUTHORITY-CFO]]"
      approval_deadline_days: 5
      reversibility: "MODERATE"

    operational_decisions:
      type: "OPERATIONAL"
      examples:
        - "Venture scaling"
        - "Product feature prioritization"
        - "Process improvements"
        - "Team reorganization"
      authority_required: "[[AUTHORITY-CEO]] or [[AUTHORITY-VPOps]]"
      approval_deadline_days: 3
      reversibility: "EASY_TO_MODERATE"

    tactical_decisions:
      type: "TACTICAL"
      examples:
        - "Daily task prioritization"
        - "Customer escalation handling"
        - "Campaign optimization"
        - "Resource allocation <$5K"
      authority_required: "[[AUTHORITY-Manager]] or [[AUTHORITY-Individual]]"
      approval_deadline_days: 1
      reversibility: "EASY"

  relationship_types:

    - id: "HAS_OPTION"
      forward: "[[Decision]] [[HAS_OPTION]] [[Option]]"
      inverse: "[[Option]] [[IS_OPTION_FOR]] [[Decision]]"
      description: "This decision has this option as a choice"

    - id: "EVALUATED_AGAINST"
      forward: "[[Option]] [[EVALUATED_AGAINST]] [[Criteria]]"
      inverse: "[[Criteria]] [[EVALUATES]] [[Option]]"
      description: "Option was scored using this criteria"

    - id: "CHOSE"
      forward: "[[Authority]] [[CHOSE]] [[Option]]"
      inverse: "[[Option]] [[CHOSEN_BY]] [[Authority]]"
      description: "This authority selected this option"

    - id: "APPROVED_BY"
      forward: "[[Decision]] [[APPROVED_BY]] [[ApprovalRecord]]"
      inverse: "[[ApprovalRecord]] [[APPROVES]] [[Decision]]"
      description: "Decision was approved"

    - id: "RESULTED_IN"
      forward: "[[Decision]] [[RESULTED_IN]] [[Outcome]]"
      inverse: "[[Outcome]] [[RESULTED_FROM]] [[Decision]]"
      description: "This outcome followed this decision"

    - id: "EVIDENCED_BY"
      forward: "[[Decision]] [[EVIDENCED_BY]] [[Evidence]]"
      inverse: "[[Evidence]] [[EVIDENCES]] [[Decision]]"
      description: "This evidence supported the decision"

  canonical_decision_criteria:

    financial_criteria:
      - id: "[[CRITERIA-Revenue-Impact]]"
        weight: 30
        scale: "% increase in ARR"
        go_no_go: false

      - id: "[[CRITERIA-Cost-of-Execution]]"
        weight: 20
        scale: "$ thousands"
        go_no_go: false

      - id: "[[CRITERIA-Time-to-Value]]"
        weight: 15
        scale: "months"
        go_no_go: false

      - id: "[[CRITERIA-ROI]]"
        weight: 25
        scale: "return multiple"
        go_no_go: false

    strategic_criteria:
      - id: "[[CRITERIA-Strategy-Alignment]]"
        weight: 40
        scale: "1-5"
        go_no_go: true  # dealbreaker

      - id: "[[CRITERIA-Market-Position]]"
        weight: 30
        scale: "1-5"
        go_no_go: false

      - id: "[[CRITERIA-Competitive-Response]]"
        weight: 30
        scale: "1-5"
        go_no_go: false

    operational_criteria:
      - id: "[[CRITERIA-Team-Capacity]]"
        weight: 25
        scale: "1-5"
        go_no_go: true  # dealbreaker

      - id: "[[CRITERIA-Technical-Feasibility]]"
        weight: 25
        scale: "1-5"
        go_no_go: true  # dealbreaker

      - id: "[[CRITERIA-Customer-Impact]]"
        weight: 30
        scale: "1-5"
        go_no_go: false

      - id: "[[CRITERIA-Risk-Level]]"
        weight: 20
        scale: "1-5 (5=highest risk)"
        go_no_go: false

  decision_workflow:

    step_1_propose:
      name: "Propose Decision"
      actor: "Any [[PERSON-*]]"
      deliverable: "Decision statement + context"
      status: "[[STATE-Proposed]]"

    step_2_research:
      name: "Research Options & Evidence"
      actor: "Proposer + stakeholders"
      deliverable: "Options defined, evidence gathered"
      status: "[[STATE-Review]]"

    step_3_build_matrix:
      name: "Build Decision Matrix"
      actor: "Cross-functional team"
      deliverable: "[[DECISION_MATRIX-*]]"
      status: "[[STATE-Review]]"

    step_4_recommend:
      name: "Recommend Option"
      actor: "Proposer"
      deliverable: "Recommendation + rationale"
      status: "[[STATE-Review]]"

    step_5_approve:
      name: "Get Approval"
      actor: "Appropriate [[AUTHORITY-*]]"
      deliverable: "[[APPROVAL_RECORD-*]]"
      status: "[[STATE-Approved]]"

    step_6_execute:
      name: "Execute Chosen Option"
      actor: "Responsible team"
      deliverable: "Implementation progress"
      status: "[[STATE-Executing]]"

    step_7_measure:
      name: "Measure Outcome"
      actor: "Responsible team + authority"
      deliverable: "[[OUTCOME-*]]"
      status: "[[STATE-Complete]]"

    step_8_learn:
      name: "Capture Learning"
      actor: "Team + decision maker"
      deliverable: "Lessons → [[LEARNING_GRAPH]]"
      status: "[[STATE-Archived]]"

  query_patterns:

    pattern_1: "Show decision history for [[VENTURE-LT005]]"
      query: |
        MATCH (venture:Venture {id: "LT005"})
               -[:SUBJECT_OF]->(decision:Decision)
        RETURN decision ORDER BY decision.proposed_at DESC

    pattern_2: "What decisions has [[AUTHORITY-CEO]] made?"
      query: |
        MATCH (authority:Authority {name: "CEO"})
               -[:MADE]->(decision:Decision)
        WHERE decision.status = "APPROVED"
        RETURN decision ORDER BY decision.approved_at DESC

    pattern_3: "Options evaluation for [[DECISION-OPS001-Scale]]"
      query: |
        MATCH (decision:Decision {id: "DECISION-OPS001-Scale"})
               -[:HAS_OPTION]->(option:Option)
               -[:EVALUATED_AGAINST]->(criteria:Criteria)
               -[:HAS_EVALUATION]->(eval:Evaluation)
        RETURN option.name, criteria.name, eval.score

    pattern_4: "What happened after we chose [[OPTION-OPS001-Scale-Aggressive]]?"
      query: |
        MATCH (option:Option {id: "OPTION-OPS001-Scale-Aggressive"})
               <-[:CHOSE]-(decision:Decision)
               -[:RESULTED_IN]->(outcome:Outcome)
        RETURN outcome.status, outcome.result, outcome.learning

    pattern_5: "Decisions that were reversed"
      query: |
        MATCH (decision:Decision)
               -[:RESULTED_IN]->(outcome:Outcome)
        WHERE outcome.status = "FAILED"
          AND decision.reversible = true
        RETURN decision, outcome

  integration_with_other_layers:

    integrates_to_authority_graph: |
      Decisions are gated by [[AUTHORITY-*]] approval.
      Query: "Who must approve [[DECISION-Type-*]]?"

    integrates_to_state_graph: |
      Decisions trigger state transitions.
      Query: "What decision moved this venture to [[STATE-Dormant]]?"

    integrates_to_lifecycle_graph: |
      Gate decisions determine stage progression.
      Query: "What criteria determined [[GATE-Validation-to-Building]] passage?"

    integrates_to_event_graph: |
      Decisions are recorded as [[EVENT-DecisionApproved]], [[EVENT-DecisionExecuted]], etc.
      Query: "Timeline of decisions affecting venture?"

    integrates_to_evidence_graph: |
      Decisions require evidence of supporting facts.
      Query: "What evidence did we cite in [[DECISION-LT005-Expand]]?"

    integrates_to_learning_graph: |
      Outcomes feed learning.
      Query: "What did we learn from [[DECISION-OPS001-Scale]]? What changed next time?"

  graph_constraints:

    constraint_1: "Every [[DECISION-*]] must have at least 2 [[OPTION-*]]"
    constraint_2: "All [[OPTION-*]] must be evaluated against all [[CRITERIA-*]]"
    constraint_3: "Go/no-go criteria must result in PASS for option to be viable"
    constraint_4: "Decision cannot be APPROVED until all required [[AUTHORITY-*]] approve"
    constraint_5: "Decision cannot be COMPLETE until [[OUTCOME-*]] is measured"
    constraint_6: "All decisions > $50K must be recorded and auditable"
    constraint_7: "Strategic decisions require explicit [[EVIDENCE-*]] citations"

# STATUS
status:
  total_decision_types_defined: 4
  total_criteria_types_defined: 20+
  total_decision_workflows_defined: 1
  decision_recording_capability: COMPLETE
  next_phase: "Populate historical decisions; wire real-time decision capture"

