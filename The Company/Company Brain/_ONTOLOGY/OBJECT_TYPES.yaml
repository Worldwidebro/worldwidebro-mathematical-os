---
# Validation Rules

**All entities must have:**
- `type` — one of the types above
- `ref_id` — TYPE-000001 format matching the prefix
- `name` — human-readable name
- `domain` — which of the 50 domains it belongs to

**Type constraints:**
- Organizational types (ORG, VEN, OPC, DIV, TEA, ROL, PER): belong to domain 01-IDENTITY or 23-VENTURES
- Work types (CAP, SKL, AGT, MOD, TOL, MCP, WFL, LOP, JOB, TSK): belong to 14-CAPABILITIES or 15-SKILLS
- Execution types (DEC, APR, EXC, OUT, LES, MTR, KPI, SLI, SLO, ERR, ALT): belong to 20-DECISIONS or 43-OUTCOMES
- Knowledge types (DOC, GDE, PRC, POL, STD, TPL, EXL, CST, PAT, ART): belong to 09-KNOWLEDGE or 47-DOCUMENTS
- Data types (SCH, TBL, FLD, REC, ENT, REL, TYP, ENM, CNS): belong to 04-DATA or 08-KNOWLEDGE-GRAPH
- Governance types (AUT, PRM, RIK, THR, MIT, CMP, AUD, CTL): belong to 21-POLICY or 32-SECURITY
- Infrastructure types (SYS, SVC, SRV, CNT, NET, STR, CCH, QUE, GWY, EPN): belong to 49-SYSTEM
- Integration types (API, WBH, PRO, FMT, ADP, CON, TRN, RTR): belong to 18-TOOLS
- Operational types (PCS, SPR, STG, GTE, RUL, TRG, SCD, EVT, HND, MON): belong to 22-EXECUTION or 29-OPERATIONS
- Control points (CBP): special — mapped to all 50 domains and 20 layers

**Updated:** 2026-09-01
