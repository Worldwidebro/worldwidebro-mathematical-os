---
# DEPENDENCY-GRAPH.yaml
# Layer 17: Dependencies & Critical Paths
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Model what depends on what; identify bottlenecks and single points of failure
#
# Part of the Graph-of-Graphs operational chain:
# [[RESOURCE-GRAPH]] → [[CONSTRAINT-GRAPH]] → [[DEPENDENCY-GRAPH]] → [[LEARNING-GRAPH]]
#
# See also:
#   - [[CONSTRAINT-GRAPH]]: Dependencies create constraints
#   - [[RESOURCE-GRAPH]]: Resource dependencies
#   - [[LEARNING-GRAPH]]: Broken dependencies teach lessons
#   - [[RISK-GRAPH]]: Dependency failures are risks

dependency_graph:

  description: |
    The Dependency Graph answers: "What breaks if X dies?"

    Every venture, agent, system, and resource has dependencies:
    - Code dependencies (library A requires library B)
    - Service dependencies (API depends on database)
    - Team dependencies (project needs skill X)
    - Financial dependencies (venture needs capital to operate)
    - Temporal dependencies (task B cannot start until task A completes)
    - Data dependencies (report depends on source data being available)

    Critical path analysis identifies what must not fail.

  entity_types:

    - id: "DEPENDENCY"
      name: "[[Dependency]]"
      definition: "One entity requires another to function"
      examples:
        - "[[DEP-LT005-requires-Database]] (HealthRoute requires database)"
        - "[[DEP-OPS001-requires-VPOps-Approval]] (OPS-001 requires VP Ops approval)"
        - "[[DEP-CON001-requires-Architect]] (requires architecture lead)"
      properties:
        - id: "dependency_id"
        - dependent: "[[ENTITY-*]] that requires something"
        - dependency_type: "what kind of dependency?"
        - depended_upon: "[[ENTITY-*]], [[RESOURCE-*]], or [[PERSON-*]]"
        - is_hard_dependency: "must have? or nice-to-have? (boolean)"
        - is_blocking: "does this block progress? (boolean)"
        - fallback_exists: "is there a fallback? (boolean)"
        - fallback: "what's the workaround?"
        - failure_impact: "HIGH|MEDIUM|LOW — impact if broken"
        - recovery_time_hours: "how long to recover if it fails?"

    - id: "CRITICAL_PATH"
      name: "[[CriticalPath]]"
      definition: "Sequence of dependent tasks that determines project timeline"
      examples:
        - "[[CPATH-LT005-Launch]] (identify → validate → build → sell → revenue)"
      properties:
        - id: "critical_path_id"
        - for_entity: "[[VENTURE-*]] or [[PROJECT-*]]"
        - steps: "ordered list of dependent tasks"
        - total_duration_days: "how long does full path take?"
        - slack_budget_days: "how much can each step slip without delaying end?"
        - bottleneck_step: "which step(s) have zero slack?"

    - id: "BOTTLENECK"
      name: "[[Bottleneck]]"
      definition: "A dependency that severely limits throughput"
      examples:
        - "[[BOTTLENECK-LT005-DriverCapacity]] (can't deliver more than 50 deliveries/day)"
        - "[[BOTTLENECK-OPS001-Founder-Approval]] (all deals > $50K need founder sign-off)"
      properties:
        - id: "bottleneck_id"
        - bottleneck_entity: "[[ENTITY-*]] that is the constraint"
        - limits: "what does it limit?"
        - current_capacity: "current throughput (e.g., 50 deliveries/day)"
        - desired_capacity: "target throughput"
        - expansion_cost: "cost to increase capacity?"
        - expansion_time_weeks: "how long to expand?"
        - single_point_of_failure: "is this a SPOF? (boolean)"

    - id: "SINGLE_POINT_OF_FAILURE"
      name: "[[SinglePointOfFailure]]"
      definition: "A dependency whose failure causes complete system failure"
      examples:
        - "[[SPOF-Database]] (if database goes down, entire system down)"
        - "[[SPOF-Founder-Decision-Authority]] (no strategic decision without founder)"
      properties:
        - id: "spof_id"
        - critical_entity: "[[ENTITY-*]] that is the SPOF"
        - causes_failure_of: "what fails if this dies?"
        - mitigation_status: "UNMITIGATED|PARTIALLY_MITIGATED|FULLY_MITIGATED"
        - mitigation: "what's in place? (redundancy, backup, etc.)"
        - mitigation_cost: "cost to fully eliminate?"
        - risk_level: "CRITICAL|HIGH|MEDIUM|LOW"

  canonical_dependencies:

    venture_dependencies:
      - id: "[[DEP-LT005-Database-Required]]"
        dependent: "[[VENTURE-LT005]]"
        depended_upon: "[[INFRASTRUCTURE-Database]]"
        is_hard_dependency: true
        is_blocking: true
        failure_impact: "HIGH"
        fallback_exists: false

      - id: "[[DEP-OPS001-VPOps-Approval]]"
        dependent: "[[VENTURE-OPS-001]]"
        depended_upon: "[[PERSON-VPOps]]"
        is_hard_dependency: true
        is_blocking: true  # all OpCo decisions need VP Ops
        failure_impact: "HIGH"
        fallback_exists: true
        fallback: "CEO can override"

      - id: "[[DEP-LT005-Driver-Network]]"
        dependent: "[[VENTURE-LT-005]]"
        depended_upon: "[[RESOURCE-Driver-Network-200]]"
        is_hard_dependency: true
        failure_impact: "CRITICAL"
        recovery_time_hours: 168  # 1 week to rebuild driver network

    system_dependencies:
      - id: "[[DEP-API-Database-Availability]]"
        dependent: "[[SYSTEM-API-Gateway]]"
        depended_upon: "[[INFRASTRUCTURE-PostgreSQL]]"
        is_hard_dependency: true
        is_blocking: true
        failure_impact: "CRITICAL"
        fallback_exists: true
        fallback: "Read-replica failover"
        single_point_of_failure: true

      - id: "[[DEP-Dashboard-Qdrant-Vector-DB]]"
        dependent: "[[DASHBOARD-Analytics]]"
        depended_upon: "[[INFRASTRUCTURE-Qdrant]]"
        is_hard_dependency: false  # dashboard works but slower
        is_blocking: false
        failure_impact: "MEDIUM"
        fallback_exists: true
        fallback: "Switch to PostgreSQL full-text search"

  relationship_types:

    - id: "REQUIRES"
      forward: "[[Entity]] [[REQUIRES]] [[Dependency]]"
      inverse: "[[Dependency]] [[REQUIRED_BY]] [[Entity]]"
      description: "This entity depends on this"

    - id: "BLOCKS"
      forward: "[[Dependency]] [[BLOCKS]] [[Milestone]]"
      inverse: "[[Milestone]] [[BLOCKED_BY]] [[Dependency]]"
      description: "If this dependency fails, this milestone cannot be achieved"

    - id: "HAS_FALLBACK"
      forward: "[[Dependency]] [[HAS_FALLBACK]] [[Alternative]]"
      inverse: "[[Alternative]] [[FALLBACK_FOR]] [[Dependency]]"
      description: "If primary dependency fails, use this alternative"

    - id: "CREATES_BOTTLENECK"
      forward: "[[Entity]] [[CREATES_BOTTLENECK]] [[Bottleneck]]"
      inverse: "[[Bottleneck]] [[CAUSED_BY]] [[Entity]]"
      description: "This entity is a bottleneck"

  critical_path_analysis:

    venture_critical_paths:
      - id: "[[CPATH-LT005-Launch]]"
        for_entity: "[[VENTURE-LT-005]]"
        steps:
          - "[[MILESTONE-Customer-Discovery]] (2 weeks)"
          - "[[MILESTONE-MVP-Build]] (4 weeks)"
          - "[[MILESTONE-Pilot-Launch]] (2 weeks)"
          - "[[MILESTONE-Revenue-Verification]] (1 week)"
        total_duration_days: 63
        bottleneck_step: "[[MILESTONE-MVP-Build]]"  # highest risk, longest duration
        slack_budget_days: "Discovery: 1 week, Launch: 3 days, Verification: 5 days"

      - id: "[[CPATH-OPS001-Scale]]"
        for_entity: "[[VENTURE-OPS-001]]"
        steps:
          - "[[MILESTONE-Market-Validation]] (1 week)"
          - "[[MILESTONE-Process-Standardization]] (2 weeks)"
          - "[[MILESTONE-Hiring-and-Training]] (3 weeks)"
          - "[[MILESTONE-Revenue-at-Scale]] (ongoing)"
        total_duration_days: 42
        bottleneck_step: "[[MILESTONE-Hiring-and-Training]]"

  single_points_of_failure:

    critical_spofs:
      - id: "[[SPOF-Database]]"
        critical_entity: "[[INFRASTRUCTURE-PostgreSQL]]"
        causes_failure_of: "All API operations"
        mitigation_status: "PARTIALLY_MITIGATED"
        mitigation: "Read replicas, automated failover, RTO < 5 minutes"
        risk_level: "CRITICAL"

      - id: "[[SPOF-Founder-Capital-Approval]]"
        critical_entity: "[[PERSON-AntwuanJohns]]"
        causes_failure_of: "Any capital allocation > $500K"
        mitigation_status: "UNMITIGATED"
        mitigation: "None (by design)"
        risk_level: "HIGH"
        mitigation_cost: 0  # no cost to mitigate — founder is irreplaceable

      - id: "[[SPOF-VPOps-Knowledge]]"
        critical_entity: "[[PERSON-VPOps]]"
        causes_failure_of: "All operational decisions"
        mitigation_status: "PARTIALLY_MITIGATED"
        mitigation: "Cross-training 2 deputies, ops playbook documentation"
        risk_level: "HIGH"
        mitigation_cost: 50000  # cost to train replacements

  bottleneck_analysis:

    identified_bottlenecks:
      - id: "[[BOTTLENECK-LT005-Driver-Capacity]]"
        bottleneck_entity: "[[RESOURCE-Driver-Network]]"
        limits: "Delivery volume"
        current_capacity: 50  # deliveries/day
        desired_capacity: 150
        expansion_cost: 75000  # cost to expand network 3x
        expansion_time_weeks: 8

      - id: "[[BOTTLENECK-OPS001-Sales-Conversion]]"
        bottleneck_entity: "[[SALES-CONVERSION-PROCESS]]"
        limits: "Deal closure rate"
        current_capacity: 25  # percent of leads converted
        desired_capacity: 40
        expansion_cost: 150000  # better sales process, training
        expansion_time_weeks: 12

  graph_constraints:

    constraint_1: "Every [[VENTURE-*]] must identify its [[CRITICAL_PATH-*]]"
    constraint_2: "Every [[SPOF-*]] must have documented [[MITIGATION-*]]"
    constraint_3: "If [[DEPENDENCY-*]] is hard and blocking, [[FALLBACK-*]] must exist"
    constraint_4: "[[BOTTLENECK-*]] analysis must inform prioritization"
    constraint_5: "Recovery time must be documented for all [[SPOF-*]]"

  integration_with_other_layers:

    integrates_to_constraint_graph: |
      Critical dependencies become constraints.
      Query: "What constraints are created by our SPOFs?"

    integrates_to_resource_graph: |
      Resource dependencies affect allocation.
      Query: "Which resources are bottlenecks?"

    integrates_to_learning_graph: |
      Dependency failures teach lessons.
      Query: "What did we learn from past outages?"

    integrates_to_risk_graph: |
      SPOFs are major risks.
      Query: "What's our risk exposure from critical dependencies?"

# STATUS
status:
  venture_critical_paths_mapped: 10+
  identified_bottlenecks: 15+
  single_points_of_failure_documented: 8+
  mitigation_planning: ACTIVE
  next_phase: "Deploy dependency monitoring and SPOF redundancy"

