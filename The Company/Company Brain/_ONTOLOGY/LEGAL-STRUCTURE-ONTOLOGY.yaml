---
# LEGAL-STRUCTURE-ONTOLOGY.yaml
# 200-Node Legal Structure Type Hierarchy (Bracketed & Graph-Ready)
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Purpose: Define canonical legal entity types for all instances

legal_structure_ontology:

  # ROOT: All legal structures descend from this
  root:
    id: "LEGAL-STRUCTURE-ROOT"
    name: "[[Legal_Structure]]"
    entity_class: "ROOT"
    description: "Universe of all legal structures, entities, fiduciary arrangements, and governance vehicles"
    jurisdiction: "Universal"
    status: "CANONICAL"

  # TIER 1: Major Categories
  category_person:
    id: "CAT-001"
    name: "[[Person]]"
    entity_class: "ACTOR"
    parent: [[Legal_Structure]]
    description: "Individual persons (not legal entities)"
    children:
      - [[Individual]]
      - [[Trustee]]
      - [[Executor]]
      - [[General_Partner]]
      - [[Limited_Partner]]
      - [[Managing_Member]]

  category_legal_entity:
    id: "CAT-002"
    name: "[[Legal_Entity]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Formally incorporated or registered legal entities"
    children:
      - [[Corporation]]
      - [[LLC]]
      - [[Partnership]]
      - [[Cooperative]]
      - [[Nonprofit]]

  category_trust:
    id: "CAT-003"
    name: "[[Trust]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Fiduciary arrangements with trustee, grantor, beneficiaries"
    children:
      - [[Revocable_Living_Trust]]
      - [[Irrevocable_Trust]]
      - [[Charitable_Trust]]
      - [[Special_Needs_Trust]]

  category_estate:
    id: "CAT-004"
    name: "[[Estate]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Probate estates and testamentary arrangements"
    children:
      - [[Probate_Estate]]
      - [[Estate_Holding_Entity]]

  category_spv:
    id: "CAT-005"
    name: "[[Special_Purpose_Vehicle]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Structural vehicles (NOT standalone legal forms, but arrangements)"
    children:
      - [[Single_Purpose_Entity]]
      - [[Project_Company]]
      - [[Acquisition_SPV]]
      - [[Financing_SPV]]

  category_fund:
    id: "CAT-006"
    name: "[[Fund]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Investment funds and pooled vehicles"
    children:
      - [[Private_Equity_Fund]]
      - [[Venture_Capital_Fund]]
      - [[Hedge_Fund]]
      - [[Real_Estate_Fund]]

  category_holding:
    id: "CAT-007"
    name: "[[Holding_Company]]"
    entity_class: "CATEGORY"
    parent: [[Legal_Structure]]
    description: "Holding and parent companies (control vehicles)"
