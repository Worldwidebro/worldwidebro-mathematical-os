        liability: "Limited"

      - id: "002"
        name: "[[S_Corporation]]"
        jurisdiction: "US"
        tax_classification: "S-Corp (1120-S)"
        default_ownership: "Limited shareholders (100 max)"
        liability: "Limited"

      - id: "003"
        name: "[[Close_Corporation]]"
        jurisdiction: "Jurisdiction-specific"
        tax_classification: "C-Corp variant"
        default_ownership: "Limited shareholders"
        liability: "Limited"

      - id: "004"
        name: "[[Professional_Corporation]]"
        jurisdiction: "State-regulated"
        description: "For licensed professionals (doctors, lawyers, accountants)"
        liability: "Limited (with professional liability)"

      - id: "005"
        name: "[[Nonprofit_Corporation]]"
        jurisdiction: "State (501c3 at federal)"
        tax_classification: "501c3"
        default_ownership: "Members/Directors (no shareholders)"
        liability: "Limited"

      - id: "006"
        name: "[[Public_Benefit_Corporation]]"
        jurisdiction: "State-specific"
