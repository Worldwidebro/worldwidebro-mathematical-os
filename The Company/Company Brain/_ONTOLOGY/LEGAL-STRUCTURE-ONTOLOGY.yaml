      - id: "017"
        name: "[[Spousal_Lifetime_Access_Trust]]"
        acronym: "SLAT"
        beneficiary: "Spouse (during spouse's life)"
        use_case: "Estate tax planning for married couples"

      - id: "018"
        name: "[[Generation_Skipping_Trust]]"
        beneficiary: "Grandchildren and beyond"
