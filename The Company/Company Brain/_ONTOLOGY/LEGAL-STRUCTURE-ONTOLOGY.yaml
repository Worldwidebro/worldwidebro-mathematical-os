      - id: "012"
        name: "[[Irrevocable_Trust]]"
        key_feature: "Cannot be revoked/modified after funding"
        tax_status: "Separate taxpayer (potentially)"
        use_case: "Estate tax reduction, asset protection"

      - id: "015"
        name: "[[Intentionally_Defective_Grantor_Trust]]"
