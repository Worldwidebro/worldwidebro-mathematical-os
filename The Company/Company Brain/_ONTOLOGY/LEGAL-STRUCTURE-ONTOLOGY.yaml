      - [[Parent_Company]]
      - [[Family_Holding_Company]]
      - [[Asset_Holding_Company]]
      - [[Intellectual_Property_Holding_Company]]

  category_property_vehicle:
    id: "CAT-008"
    name: "[[Property_Vehicle]]"
