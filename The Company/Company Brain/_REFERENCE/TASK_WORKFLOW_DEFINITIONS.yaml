---
# TASK_WORKFLOW_DEFINITIONS.yaml — Phase 3 Task Workflows
# Authority: CP-001 (Sovereign Operator)
# Generated: 2026-09-25
# Phase: 3 (Oct 8-14)
# Status: SPECIFICATION (ready for implementation)

# Workflow Architecture:
# TRIGGER → [TASK CLASSIFIER] → [HANDLER DISPATCH] → [AGENT EXECUTOR] → [ERROR RECOVERY] → [OUTCOME]

task_workflow_templates:

  # ==================================================
  # REVENUE-CRITICAL TASK WORKFLOWS
  # ==================================================

  "sales_opportunity_creation":
    task_type: "create_opportunity"
    domain: "25-SALES"
    base_id: "B251"
    priority: "CRITICAL"
    handler_agent: "Sales Pipeline Agent"

    workflow_steps:
      - step: 1
        name: "Capture opportunity"
        action: "receive lead data"
        actor: "Sales Pipeline Agent"

      - step: 2
        name: "Score lead"
        action: "call lead_scoring_agent"
        actor: "Lead Scoring Agent"
        sla_seconds: 300

      - step: 3
        name: "Route to sales rep"
        action: "assign based on territory + capacity"
        actor: "Sales Pipeline Agent"
        sla_seconds: 120

      - step: 4
        name: "Create deal record"
        action: "save to CRM + attribute to agent"
        actor: "Sales Pipeline Agent"
        sla_seconds: 60

      - step: 5
        name: "Notify stakeholders"
        action: "send alert to manager"
        actor: "Sales Pipeline Agent"
        sla_seconds: 30

    escalation_path:
      - threshold: "if_score < 0.4"
        action: "disqualify automatically"
        approver: "Sales Pipeline Agent"

      - threshold: "if_score 0.4-0.7"
        action: "route to junior rep"
        approver: "Sales Manager"

      - threshold: "if_score > 0.7"
        action: "route to senior rep"
        approver: "Sales Manager"

      - threshold: "if_failed_to_score"
        action: "manual review"
        approver: "Sales Manager"
        timeout_seconds: 1800

    error_recovery:
      - error: "CRM_connection_failed"
        recovery: "retry 3x with exponential backoff"
        max_attempts: 3
        fallback: "queue for manual processing"

      - error: "lead_scoring_timeout"
        recovery: "use cached model scores"
        fallback: "route to manual review"

      - error: "all_reps_at_capacity"
        recovery: "queue and wait for capacity"
        timeout_seconds: 3600

    success_metrics:
      - metric: "time_to_opportunity_creation"
        target: "< 5 minutes"

      - metric: "lead_scoring_accuracy"
        target: "> 85% correlation with sales outcome"

      - metric: "routing_success_rate"
        target: "> 95% (reps accept assignment)"

  "customer_delivery_dispatch":
    task_type: "dispatch_delivery"
    domain: "58-LOGISTICS"
    base_id: "B581"  # Extended for LT-005
    priority: "CRITICAL"
    handler_agent: "Dispatch Agent"

    workflow_steps:
      - step: 1
        name: "Receive delivery request"
        action: "capture order from customer"
        actor: "Dispatch Agent"

      - step: 2
        name: "Validate address"
        action: "geocode + verify deliverability"
        actor: "Dispatch Agent"
        sla_seconds: 120

      - step: 3
        name: "Assign driver"
        action: "match to nearest available driver"
        actor: "Dispatch Agent"
        sla_seconds: 300

      - step: 4
        name: "Create shipment"
        action: "generate tracking #, notify customer"
        actor: "Dispatch Agent"
        sla_seconds: 60

      - step: 5
        name: "Track delivery"
        action: "monitor GPS, update status"
        actor: "Dispatch Agent"
        sla_seconds: 10  # Real-time

    escalation_path:
      - threshold: "if_invalid_address"
        action: "contact customer for correction"
        approver: "Customer Service Agent"
        timeout_seconds: 600

      - threshold: "if_no_driver_available"
        action: "offer delayed delivery or alternative"
        approver: "Operations Manager"
        timeout_seconds: 1800

      - threshold: "if_delivery_fails"
        action: "retry next available window"
        approver: "Operations Manager"
        max_attempts: 3

    error_recovery:
      - error: "GPS_tracking_failed"
        recovery: "use last known position"
        fallback: "phone call to driver"

      - error: "customer_unreachable"
        recovery: "retry 3x over 2 hours"
        fallback: "leave notice + reschedule"

      - error: "driver_accident"
        action: "immediate escalation"
        approver: "Logistics Manager"
        sla_seconds: 60

    success_metrics:
      - metric: "on_time_delivery_rate"
        target: "> 95%"

      - metric: "customer_satisfaction"
        target: "> 4.5/5 stars"

      - metric: "delivery_cost_per_unit"
        target: "< $12"

  "financial_reconciliation":
    task_type: "reconcile_payments"
    domain: "24-FINANCE"
    base_id: "B241"
    priority: "HIGH"
    handler_agent: "Financial Planning Agent"

    workflow_steps:
      - step: 1
        name: "Gather payment records"
        action: "collect from all sources"
        actor: "Financial Planning Agent"
        sla_seconds: 3600

      - step: 2
        name: "Match transactions"
        action: "reconcile venture revenue"
        actor: "Financial Planning Agent"
        sla_seconds: 1800

      - step: 3
        name: "Flag discrepancies"
        action: "identify mismatches"
        actor: "Financial Planning Agent"
        sla_seconds: 900

      - step: 4
        name: "Investigate variance"
        action: "root cause analysis"
        actor: "Financial Planning Agent"
        sla_seconds: 3600

      - step: 5
        name: "Generate report"
        action: "document findings"
        actor: "Financial Planning Agent"
        sla_seconds: 600

    escalation_path:
      - threshold: "if_discrepancy_small"
        action: "auto-reconcile if < $100"
        approver: "Financial Planning Agent"

      - threshold: "if_discrepancy_medium"
        action: "manual review required"
        approver: "Controller"
        timeout_seconds: 7200

      - threshold: "if_discrepancy_large"
        action: "executive escalation"
        approver: "CFO"
        timeout_seconds: 3600

    success_metrics:
      - metric: "reconciliation_completeness"
        target: "> 99.5%"

      - metric: "discrepancy_resolution_time"
        target: "< 24 hours"

  # ==================================================
  # OPERATIONAL TASK WORKFLOWS
  # ==================================================

  "staffing_placement_follow_up":
    task_type: "follow_up_placement"
    domain: "29-OPERATIONS"
    base_id: "B291"
    priority: "MEDIUM"
    handler_agent: "Staffing Pipeline Agent"
    sla_seconds: 3600

    success_criteria:
      - "Contact placed staff within 24h of placement"
      - "Confirm satisfaction with role"
      - "Collect feedback from employer"
      - "Document outcome"

  "call_quality_monitoring":
    task_type: "monitor_call_quality"
    domain: "29-OPERATIONS"
    base_id: "B291"
    priority: "MEDIUM"
    handler_agent: "Call Routing Agent"

    workflow_steps:
      - step: 1
        name: "Record call quality metrics"
        action: "capture duration, satisfaction, hold time"
        actor: "Call Routing Agent"
        sla_seconds: 10

      - step: 2
        name: "Score call quality"
        action: "apply rubric (1-5 stars)"
        actor: "Call Routing Agent"
        sla_seconds: 120

      - step: 3
        name: "Flag low-quality calls"
        action: "if score < 3, escalate"
        actor: "Call Routing Agent"
        sla_seconds: 60

      - step: 4
        name: "Provide feedback"
        action: "coaching to rep"
        actor: "Call Routing Agent"
        sla_seconds: 3600

    success_metrics:
      - metric: "average_call_quality"
        target: "> 4.0 stars"

      - metric: "customer_satisfaction"
        target: "> 90%"

# ==================================================
# TASK WORKFLOW EXECUTION ENGINE
# ==================================================

execution_engine:

  dispatcher:
    type: "rule_based"
    match_on: ["domain", "task_type", "priority"]
    routing_priority: ["critical_path", "revenue_task", "sla_remaining"]

  handler_selection:
    rule_1: "If primary_agent available → dispatch to primary"
    rule_2: "Else if secondary_agent available → dispatch to secondary"
    rule_3: "Else queue and wait (SLA timeout = escalation trigger)"

  timeout_handling:
    soft_timeout: "Alert responsible party"
    hard_timeout: "Escalate to next level in approval_chain"
    critical_timeout: "Page on-call executive"

  error_handling:
    strategy: "fail_safe"
    default: "escalate to human"
    retry_logic: "exponential backoff (1s, 2s, 4s, 8s, max 3 retries)"

# ==================================================
# MONITORING & OBSERVABILITY
# ==================================================

observability:

  per_workflow_metrics:
    - metric: "execution_count"
      frequency: "real-time"

    - metric: "success_rate"
      frequency: "real-time"

    - metric: "average_execution_time"
      frequency: "per minute"

    - metric: "p95_execution_time"
      frequency: "per minute"

    - metric: "error_count"
      frequency: "real-time"

    - metric: "escalation_count"
      frequency: "real-time"

  dashboards:
    - name: "Task Workflow Health"
      metrics: ["execution_count", "success_rate", "error_count"]
      frequency: "1-minute refresh"

    - name: "SLA Compliance"
      metrics: ["tasks_meeting_sla", "tasks_at_risk", "tasks_breached"]
      frequency: "real-time"

    - name: "Agent Workload"
      metrics: ["tasks_in_progress", "queue_depth", "utilization"]
      frequency: "30-second refresh"

