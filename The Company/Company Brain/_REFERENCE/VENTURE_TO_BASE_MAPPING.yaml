  # ==================================================
  # VENTURE CLASSIFICATION SCHEMA
  # ==================================================
  # (For remaining 783 ventures to be mapped)
  #
  # Base Assignment Rules:
  # 1. Match venture sector to domain
  # 2. Classify by revenue model
  # 3. Assign to primary domain agent
  # 4. Link to base (B###)
  # 5. Set autonomy level (L1/L2/L3)
  #
  # Revenue Model Types:
  # - transactional: $ per transaction/delivery/call
  # - subscription: $ per month/year
  # - project: $ per project completion
  # - percentage: % of deal/revenue
  # - hybrid: combination of above
  #
  # Launch Status:
  # - ACTIVE: Live, revenue-generating
  # - BUILDING: Under development
  # - ASSESSMENT: Evaluating go/no-go
  # - PLANNED: Scheduled for development
  # - ON_HOLD: Paused
  # - ARCHIVED: Completed/retired

venture_classification_rules:

  # Sector → Base Mapping (50 base domains)
  sector_to_base_domain:
    "Operations": "29-OPERATIONS"
    "Logistics": "58-LOGISTICS"
    "Construction": "51-CONSTRUCTION"
    "Financial": "54-FINANCIAL"
    "Manufacturing": "51-CONSTRUCTION"
    "Healthcare": "09-KNOWLEDGE"  # Extended knowledge domain
    "Technology": "49-SYSTEM"
    "Retail": "25-SALES"
    "E-Commerce": "26-MARKETING"
    "Education": "44-LEARNING"
    "Real Estate": "54-FINANCIAL"
    "Insurance": "32-SECURITY"
    "Media": "26-MARKETING"
    "Telecommunications": "49-SYSTEM"
    "Energy": "35-ASSETS"
    "Transportation": "58-LOGISTICS"
    "Hospitality": "27-CUSTOMERS"
    "Entertainment": "43-OUTCOMES"
    "Travel": "58-LOGISTICS"
    "Finance": "24-FINANCE"

  # Autonomy Level Assignment Rules
  autonomy_assignment:
    ACTIVE_revenue: "L3"  # Autonomous for live revenue
    ACTIVE_operational: "L2"  # Assisted for operational
    BUILDING: "L2"  # Assisted while building
    ASSESSMENT: "L1"  # Report-only during assessment
    PLANNED: "L1"
    ON_HOLD: "L1"
    ARCHIVED: "L1"

  # Agent Assignment Rules
  agent_assignment:
    "Operations": ["Operations Manager Agent", "Staffing Pipeline Agent"]
    "Logistics": ["Logistics Operations Agent", "Dispatch Agent"]
    "Construction": ["Construction Project Manager", "Project Scheduler"]
    "Financial": ["Financial Planning Agent", "Deal Coach Agent"]
    "Healthcare": ["Knowledge Synthesizer Agent", "Patient Coordinator"]
    "Sales": ["Sales Pipeline Agent", "Lead Scoring Agent"]
    "Marketing": ["Campaign Manager Agent", "Content Coordinator"]
    "Customer Success": ["Customer Success Agent", "Health Scorer"]

# ==================================================
# REVENUE ATTRIBUTION PIPELINE
# ==================================================

revenue_attribution:

  pipeline:
    step_1: "Capture transaction/event in venture system"
    step_2: "Extract: venture_id, agent_id, timestamp, amount"
    step_3: "Lookup: venture_id → base_id (this mapping)"
    step_4: "Lookup: base_id → domain (from CBP_REGISTRY)"
    step_5: "Lookup: domain → opco_id (from org structure)"
    step_6: "Record: venture_id, agent_id, base_id, opco_id, $amount"
    step_7: "Aggregate: daily → weekly → monthly → annual"
    step_8: "Dashboard: real-time revenue by venture/base/agent"

  attribution_schema:
    transaction_id: "unique_transaction_uuid"
    venture_id: "OPS-001 | LT-005 | ..."
    base_id: "B291 | B581 | ..."
    domain: "29-OPERATIONS | 58-LOGISTICS | ..."
    opco_id: "from org structure"
    agent_id: "agent_uuid or null"
    timestamp: "ISO8601"
    amount_usd: "decimal"
    revenue_type: "primary | commission | bonus"
    status: "recorded | verified | paid"

  backfill_logic: |
    If agent_id missing:
      Use base_id → primary_agent from AGENT_DISPATCH_ROUTING.yaml
    If base_id missing:
      Use venture_id → base_id (this mapping)
    If venture_id missing:
      Revenue unattributable (flag for investigation)

