# VEX Dashboard — Tab Specifications (Quick Reference)

# Format: One spec per tab, covering: purpose, data source, key metrics, UI pattern, API endpoint

---
agents:
  title: AI Agent Operations
  tier: Agents
  purpose: View agent workload organized by operational module
  data_source: OmniRoute + Neo4j
  api_endpoint: /api/agents-modules
  key_metrics:
    - Total Agents (count)
    - Tasks Running (count)
    - Success Rate (%)
    - Avg Capacity (%)
  ui_pattern: Module cards with expandable agent lists
  status: ✅ LIVE (Sep 18)

dashboard:
  title: Portfolio Overview
  tier: Overview
  purpose: High-level KPIs for 789 ventures
  data_source: Supabase + Neo4j
  api_endpoint: /api/dashboard/metrics
  key_metrics:
    - Revenue (monthly)
    - Ventures (active count)
    - Growth Rate (%)
    - Avg Health Score (%)
  ui_pattern: 4 KPI cards + drill-down list
  status: ✅ LIVE (Sep 18)

organization:
  title: Sector Organization
  tier: Structure
  purpose: Map 35 sectors + opcos
  data_source: Neo4j
  api_endpoint: /api/sectors/taxonomy
  key_metrics:
    - Total Sectors (35)
    - Ventures per Sector
    - Revenue Share
  ui_pattern: Hierarchical tree or table
  status: ✅ LIVE (Sep 18)

orgchart:
  title: Leadership Pyramid
  tier: Structure
  purpose: Headcount pyramid (exec → IC)
  data_source: Supabase
  api_endpoint: /api/org/hierarchy
  key_metrics:
    - Executive (4)
    - VPs (36)
    - Managers (68)
    - ICs (78)
  ui_pattern: Pyramid + sector table
  status: ✅ LIVE (Sep 18)

financial:
