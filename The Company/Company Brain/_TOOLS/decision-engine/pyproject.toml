[project]
name = "company-brain-decision-engine"
version = "0.1.0"
description = "High-speed typed decision and reflex layer for Company Brain and GBrain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pytest>=8.1.0",
]

[project.scripts]
decide = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
