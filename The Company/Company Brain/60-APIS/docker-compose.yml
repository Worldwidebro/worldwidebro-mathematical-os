version: '3.8'

services:
  graph-api:
    build:
      context: ..
      dockerfile: 60-APIS/Dockerfile
    container_name: company-brain-graph-api
    ports:
      - "8000:8000"
    environment:
      GRAPH_API_KEY: ${GRAPH_API_KEY:-changeme}
      NEO4J_URI: bolt://100.87.214.70:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      QDRANT_URL: http://100.87.214.70:6333
      QDRANT_COLLECTION: ventures
      PYTHONUNBUFFERED: "1"
    networks:
      - company-brain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  company-brain:
    driver: bridge
