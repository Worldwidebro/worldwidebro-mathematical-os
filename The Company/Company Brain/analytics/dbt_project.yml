
# Name your project! Project names should be lowercase and use underscores as separators
# See documentation: https://docs.getdbt.com/docs/build/projects

name: 'worldwidebro_analytics'
version: '1.0.0'
config-version: 2

# This sets the `raw-paths` config in profiles.yml if applicable. Otherwise, `docs-paths` goes here.
# `source-paths` goes in `dbt_project.yml`. Future versions of dbt may restructure this.
# See https://docs.getdbt.com/docs/configure-your-repo
profile: 'worldwidebro_analytics'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
models:
  worldwidebro_analytics:
    staging:
      materialized: incremental
      unique_id: id
      on_schema_change: fail
    marts:
      materialized: table

vars:
  dbt_date_column: dbt_date_field

require-dbt-version: [">=1.5.0", "<2.0.0"]
