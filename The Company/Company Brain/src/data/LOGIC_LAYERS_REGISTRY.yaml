logic_layers:
  LOGIC-001:
    id: "LOGIC-001"
    name: "Cold Outreach"
    description: "Initial contact with prospects via email, phone, or social media"
    category: "outreach"
    capabilities:
      - write-emails
      - personalize
      - track-opens
      - handle-unsubscribes
      - find-contact-info
    example_tasks:
      - "Send cold email to startup founders"
      - "Reach out to prospects on LinkedIn"
      - "Generate personalized outreach sequences"

  LOGIC-002:
    id: "LOGIC-002"
    name: "Email Sequencing"
