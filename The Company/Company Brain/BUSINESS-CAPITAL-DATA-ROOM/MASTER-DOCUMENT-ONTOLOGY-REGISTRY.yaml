version: "1.0"
name: "Master Document Ontology Registry"
created_date: "2026-09-08"
authority: "CP-027 (Infrastructure Control Plane) + CP-032 (Business Operations)"
purpose: "Unified document taxonomy for 789 ventures across 35 sectors and 6 deal types"
status: "Production"

