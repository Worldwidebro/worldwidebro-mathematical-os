      Certificate_of_Incorporation:
        id: "DOC-CORP-001"
        description: "Primary formation document establishing legal entity"
        jurisdictions: [Federal, State]
        deal_types: [all]
        sector_relevance: [all]
        required_fields: [business_name, state_of_formation, authorized_shares, principal_place_of_business]
        template_available: true
        critical_path: true
        regulatory_bodies: []

      Articles_of_Incorporation:
        id: "DOC-CORP-002"
        description: "Detailed governance rules and operating provisions"
        jurisdictions: [State]
        deal_types: [all]
        sector_relevance: [all]
        required_fields: [bylaws, board_structure, shareholder_rights, dividend_policy]
        template_available: true
        critical_path: true

      Operating_Agreement:
        id: "DOC-CORP-003"
