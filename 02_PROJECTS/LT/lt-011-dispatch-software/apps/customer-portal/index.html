<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DispatchOS — Client Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Outfit:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg: #06090f;
      --panel: #0c1420;
      --border: #1b2a3d;
      --tx-primary: #e8eef6;
      --tx-secondary: #a9b8cc;
      --accent-blue: #5aa7f0;
      --accent-green: #3ddc97;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--tx-primary);
      font-family: 'Outfit', sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
    }

    .btn-action {
      background-color: var(--accent-blue);
      color: var(--bg);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      cursor: pointer;
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
    }

    .panel {
      background-color: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
    }

    /* Shipment Tracking card */
    .shipment-card {
      border: 1px solid var(--border);
      background-color: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-badge {
      background-color: rgba(90, 167, 240, 0.15);
      color: var(--accent-blue);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    /* Invoices List */
    .invoice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Customer Portal</h1>
      <button class="btn-action" onclick="alert('Order request form overlay active.')">Request Shipment</button>
    </header>

    <div class="grid">
      <!-- Active Shipments -->
      <div class="panel">
        <h2>My Active Cargo Orders</h2>
        
        <div class="shipment-card">
          <div>
            <h3 style="font-size: 15px; margin-bottom: 4px;">Load #LOAD-10482</h3>
            <p style="font-size: 13px; color: var(--tx-secondary);">Charlotte, NC ➔ Atlanta, GA</p>
          </div>
          <div>
            <span class="status-badge">IN TRANSIT</span>
            <p style="font-size: 12px; color: var(--tx-secondary); margin-top: 4px; text-align: right;">ETA: 2:45 PM</p>
          </div>
        </div>

        <div class="shipment-card">
          <div>
            <h3 style="font-size: 15px; margin-bottom: 4px;">Load #LOAD-10481</h3>
            <p style="font-size: 13px; color: var(--tx-secondary);">Raleigh, NC ➔ Orlando, FL</p>
          </div>
          <div>
            <span class="status-badge" style="background-color: rgba(61, 220, 151, 0.15); color: var(--accent-green);">DELIVERED</span>
            <p style="font-size: 12px; color: var(--tx-secondary); margin-top: 4px; text-align: right;">Completed</p>
          </div>
        </div>
      </div>

      <!-- Invoices and Documents -->
      <div class="panel">
        <h2>Recent Billing</h2>
        
        <div class="invoice-item">
          <div>
            <p style="font-size: 14px; font-weight: 500;">Invoice INV-98821</p>
            <span style="font-size: 12px; color: var(--tx-secondary);">Due Aug 12</span>
          </div>
          <strong style="color: var(--tx-primary)">$1,250.00</strong>
        </div>

        <div class="invoice-item">
          <div>
            <p style="font-size: 14px; font-weight: 500;">Invoice INV-98820</p>
            <span style="font-size: 12px; color: var(--tx-secondary);">Paid Aug 01</span>
          </div>
          <strong style="color: var(--accent-green)">$3,400.00</strong>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
