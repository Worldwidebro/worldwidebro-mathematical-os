const F={q:'',gender:'',cat:'',prio:''};
function isShoe(r){return /Footwear/i.test(r.category)}
function render(){
 const tb=document.getElementById('tb');tb.innerHTML='';let n=0;
 data.forEach(r=>{
   if(exclShoes&&isShoe(r))return;
   if(F.gender&&r.gender!==F.gender)return;
   if(F.cat&&!r.category.includes(F.cat))return;
   if(F.prio&&r.priority!==F.prio)return;
   if(F.q){const s=(r.garment_type+' '+r.category+' '+r.colorways+' '+r.sku_id).toLowerCase();if(!s.includes(F.q.toLowerCase()))return;}
   n++;
   const tr=document.createElement('tr');
   tr.innerHTML=`<td><code>${r.sku_id}</code></td><td><b>${r.garment_type}</b></td>
   <td>${r.category}</td><td class="gender-${r.gender.replace(/[^A-Za-z]/g,'')}">${r.gender}</td>
   <td class="cw">${r.colorways.replace(/\|/g,' · ')}</td>
   <td><span class="pill ${r.priority}">${r.priority}</span></td>
   <td class="cw">img ${r.source_images}</td>`;
   tb.appendChild(tr);
 });
 document.getElementById('shown').textContent=n;
}
function setEx(v){exclShoes=v;document.getElementById('exbtn').textContent=v?'Shoes: excluded':'Shoes: shown';render();}
document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('q').oninput=e=>{F.q=e.target.value;render()};
 document.getElementById('fg').onchange=e=>{F.gender=e.target.value;render()};
 document.getElementById('fc').onchange=e=>{F.cat=e.target.value;render()};
 document.getElementById('fp').onchange=e=>{F.prio=e.target.value;render()};
 render();
});</script></body></html>
