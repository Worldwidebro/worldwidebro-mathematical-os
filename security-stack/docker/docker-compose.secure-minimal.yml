# Illustrative “minimal exposure” pattern — many OpenClaw setups REQUIRE outbound network.
# Use only if you deliberately proxy LLM/tool traffic via a hardened sidecar or unix socket.
# network_mode: none breaks typical API clients unless you redesign connectivity.

services:
  openclaw:
    image: openclaw/openclaw:latest
    container_name: openclaw-airgap-example
    restart: "no"
    cap_drop:
      - ALL
    # cap_add: []  # If the process can bind privileged port without caps, leave empty
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64M
    volumes:
      - openclaw_data:/data:rw
    # Access via docker exec or a deliberate unix-socket bind you add to the image.

volumes:
  openclaw_data:
