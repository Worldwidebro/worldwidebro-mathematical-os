# T01 — Foundation: PostgreSQL + Redis + OpenBao
# SafeLine CE is NOT a single image here. Deploy via ../scripts/bootstrap-safeline.sh
# and ../safeline/compose.yaml (vendor-maintained).

services:
  postgres:
    image: postgres:16-alpine
    container_name: security-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openbao}
      POSTGRES_USER: ${DB_USER:-openbao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host ports: reachable only on Docker network (openbao → postgres). Admin: docker compose exec postgres psql …
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openbao} -d ${POSTGRES_DB:-openbao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - security_network

  redis:
    image: redis:7-alpine
    container_name: safeline-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    # No host ports: internal-only. To debug: docker compose exec redis redis-cli …
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - security_network

  openbao:
    image: openbao/openbao:2.5
    container_name: openbao
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      SKIP_SETCAP: "1"
      BAO_ADDR: http://127.0.0.1:8200
      # Never set BAO_DEV_* or dev root tokens in production. Use scripts/openbao_production.sh flow.
    volumes:
      - ../config/openbao/config.hcl:/vault/config/config.hcl:ro
      - openbao_data:/vault/data
      - openbao_logs:/vault/logs
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
    command: server -config=/vault/config/config.hcl
    healthcheck:
      test: ["CMD-SHELL", "bao status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - security_network

volumes:
  postgres_data:
  redis_data:
  openbao_data:
  openbao_logs:

networks:
  security_network:
    name: security_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
