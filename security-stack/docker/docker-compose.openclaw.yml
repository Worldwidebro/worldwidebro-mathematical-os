# T07 — Example OpenClaw sandbox compose (adjust image, paths, and seccomp to your deployment).
# `deploy.resources` is ignored by non-Swarm compose; use mem_limit/cpus below.

services:
  openclaw-sandbox:
    image: openclaw/openclaw:latest
    container_name: openclaw-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop:
      - ALL
    # Do NOT add DAC_OVERRIDE (permission bypass). NET_BIND_SERVICE only if required to bind :3000.
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100M
      - /run:rw,noexec,nosuid,size=10M
    security_opt:
      - no-new-privileges:true
    # Optional: add an audited seccomp profile; Docker’s default applies if omitted.
    # security_opt:
    #   - seccomp:../config/seccomp/openclaw-strict.json
    mem_limit: 2g
    cpus: 2.0
    volumes:
      - openclaw_data:/app/data:rw
      - ../config/openclaw:/app/config:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      NODE_ENV: production
      OPENCLAW_CONFIG: /app/config/config.yaml
      BAO_ADDR: http://host.docker.internal:8200
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - security_network

volumes:
  openclaw_data:
    driver: local

networks:
  security_network:
    external: true
    name: security_network
