# T16 — Minimal Loki stack (extend with Promtail / Alloy / Grafana as needed)

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    user: "0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

volumes:
  loki_data:

networks:
  monitoring:
    name: monitoring
    driver: bridge
