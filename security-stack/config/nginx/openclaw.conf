# T03 — Site config (TLS 1.3). Requires http_snippets/01-openclaw-rate-limit.conf in http {}.
# Replace openclaw.example.com and certificate paths.

upstream openclaw_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream safeline_mgt {
    # SafeLine management UI (default MGT_PORT 9443 → container 1443); adjust if differ.
    server 127.0.0.1:9443 max_fails=3 fail_timeout=30s;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openclaw.example.com;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    ssl_certificate     /etc/letsencrypt/live/openclaw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/openclaw.example.com/chain.pem;

    location / {
        limit_req zone=openclaw_limit burst=20 nodelay;

        proxy_pass http://openclaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Optional: reverse-proxy SafeLine console (lock down with mTLS or VPN in production).
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name safeline.example.com;

    ssl_protocols TLSv1.3;
    ssl_certificate     /etc/letsencrypt/live/safeline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safeline.example.com/privkey.pem;

    location / {
        proxy_pass https://safeline_mgt;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name openclaw.example.com;
    return 301 https://$host$request_uri;
}
