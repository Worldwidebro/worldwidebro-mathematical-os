# T10 — AgentWard-style guardrails (loaded by agentward_plugin.py).

version: "2.0"

injection_patterns:
  - "(?i)ignore.*(previous|all|above).*(instructions|rules|commands)"
  - "(?i)pretend.*you.*are.*(system|admin|root)"
  - "(?i)forget.*(rules|constraints|boundaries)"
  - "(?i)you.*must.*obey.*me.*(instead|ignore)"
  - "(?i)system.*prompt.*override"
  - "\\|\\|.*\\|\\|"
  - "\\$\\{[^}]+\\}"

override_phrases:
  - "ignore previous instructions"
  - "disregard your rules"
  - "override safety protocols"
  - "bypass guardrails"
  - "developer mode"
  - "jailbreak"

blocked_encodings:
  - "base64"
  - "hex"
  - "unicode_escape"

poisoning_patterns:
  - "(?i)you.*will.*now.*(behave|act).*differently"
  - "(?i)update.*memory.*delete.*everything"
  - "(?i)previous.*memory.*corrupt"
  - "(?i)<!--.*-->.*injection"

trusted_sources:
  - "system"
  - "authenticated_user"
  - "admin_api"

blocked_hashes:
  - "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

detection:
  risk_threshold: 0.7
  log_all_attempts: true
  notify_on_critical: true
