<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu22.04</config-profile>
    <notify_time>30</notify_time>
    <time-reconnect>1800</time-reconnect>
    <crypto_method>aes</crypto_method>
  </client>

  <syscheck>
    <frequency>43200</frequency>
    <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin,/opt/openclaw</directories>
    <directories check_all="yes" realtime="yes" restrict=".env$|.key$|.pem$|.yaml$">/opt/openclaw</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <auto_ignore frequency="10" timeout="3600">yes</auto_ignore>
  </syscheck>

  <localfile>
    <location>/var/log/auth.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <localfile>
    <location>/var/log/openclaw/security.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_unixaudit>yes</check_unixaudit>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <interval>43200</interval>
    <skip_nfs>yes</skip_nfs>
  </sca>
</ossec_config>
