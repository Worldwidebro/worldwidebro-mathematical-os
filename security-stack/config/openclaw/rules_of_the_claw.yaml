# T09 — Policy rules (enforce in your agent runtime / tool wrapper).

version: "2.0"

rules:
  tier1:
    - name: "block_credential_exfil"
      pattern: "(?i)(cat|type|less|more).*(\\.env|\\.pem|\\.key|credentials|secrets)"
      action: "BLOCK"
      response: "CREDENTIAL_EXFIL_ATTEMPT"
    - name: "block_data_exfiltration_curl"
      pattern: "(?i)curl.*-d.*@"
      action: "BLOCK"
      response: "DATA_EXFIL_BLOCKED"
    - name: "block_data_exfiltration_nc"
      pattern: "(?i)(nc|ncat|netcat).*>"
      action: "BLOCK"
    - name: "block_base64_encoding"
      pattern: "(?i)(base64|xxd|openssl\\s+enc).*[A-Za-z0-9+/=]{40,}"
      action: "BLOCK"
      response: "ENCODED_EXFIL"
    - name: "block_reverse_shell"
      pattern: "(?i)(bash\\s+-i\\s+>&\\s+/dev/tcp/|nc\\s+-e\\s+/bin/sh|python\\s+-c\\s+['\"]import\\s+socket)"
      action: "BLOCK"
      response: "REVERSE_SHELL_ATTEMPT"
    - name: "block_awk_sed_grep_env"
      pattern: "(?i)(awk|sed|grep|perl)\\b[^\\n]*\\.env\\b"
      action: "BLOCK"
    - name: "block_lang_runtime_inline"
      pattern: "(?i)\\b(python|python3|php|ruby|node|perl)\\b[^\\n]*\\s(-c|-e)\\b"
      action: "BLOCK"
    - name: "block_openssl_decode"
      pattern: "(?i)openssl\\s+.*enc\\s+.*-d"
      action: "BLOCK"

  tier2:
    - name: "warn_file_read_unusual_path"
      pattern: "(?i)(cat|head|tail).*/(etc|var|opt)/"
      action: "WARN"
      flag_suspicious: true
    - name: "warn_download_dangerous"
      pattern: "(?i)(wget|curl).*\\.(sh|py|rb|pl|exe|msi)\\b"
      action: "WARN"
      flag_suspicious: true
    - name: "warn_network_scan"
      pattern: "(?i)(nmap|masscan|zmap)"
      action: "WARN"
      flag_suspicious: true
    - name: "warn_git_history_patch"
      pattern: "(?i)git\\s+log\\b[^\\n]*-p"
      action: "WARN"
      flag_suspicious: true

  tier3:
    - name: "sandbox_any_shell_command"
      pattern: "^(bash|sh|zsh|dash|fish)\\b"
      action: "SANDBOX"
    - name: "sandbox_curl_external"
      pattern: "(?i)curl\\s+https?://"
      action: "SANDBOX"

  tier4:
    - name: "audit_all_commands"
      pattern: ".*"
      action: "AUDIT"
      log_level: "info"

settings:
  block_override_attempts: true
  override_phrases:
    - "ignore previous instructions"
    - "forget your rules"
    - "disable safety"
    - "override security"
  max_command_length: 2000
  timeout_seconds: 30

response_messages:
  BLOCK: "Security policy violation. Command blocked. Incident logged."
  WARN: "Warning: This action is suspicious and has been logged."
  SANDBOX: "Action isolated to sandbox environment."
  CREDENTIAL_EXFIL_ATTEMPT: "Security alert: Credential exfiltration attempt detected. Session terminated."
  REVERSE_SHELL_ATTEMPT: "Critical: Reverse shell attempt blocked. Environment locked."
