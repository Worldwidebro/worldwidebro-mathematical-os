# T08 — OpenClaw security-oriented template (adapt to your OpenClaw version / schema).

version: "1.0"

server:
  host: "127.0.0.1"
  port: 3000
  tls:
    enabled: false
  rate_limit:
    window_ms: 60000
    max_requests: 100

security:
  disabled_tools:
    - "system_shell"
    - "file_delete"
    - "network_scan"
    - "process_kill"
  approval_required:
    - "file_write_anywhere"
    - "docker_exec"
    - "env_var_modify"
  rules_path: "/app/config/rules_of_the_claw.yaml"
  sandbox:
    enabled: true
    docker_socket: false
    allowed_paths:
      - "/app/data/allowed"
    blocked_commands:
      - "curl"
      - "wget"
      - "nc"
      - "ncat"
      - "base64"
      - "xxd"
      - "perl"
      - "python -c"
      - "ruby -e"

authentication:
  mode: "openbao"
  openbao:
    addr: "http://127.0.0.1:8200"
    role_id: "${OPENBAO_ROLE_ID}"
    secret_id: "${OPENBAO_SECRET_ID}"
    kv_path: "secret/data/openclaw"
  session:
    ttl: 3600
    refresh: true

memory:
  type: "vector"
  vector_store:
    path: "/app/data/memory.db"
    encryption: "aes-256-gcm"
    encryption_key: "${MEMORY_ENCRYPTION_KEY}"
  guardrails:
    validate_before_write: true
    max_context_size: 10000
    block_sensitive_patterns:
      - "API_KEY.*=.*[A-Za-z0-9]{32}"
      - "(?i)password\\s*[:=]\\s*.*"
      - "(?i)secret\\s*[:=]\\s*.*"

logging:
  level: "info"
  security_log: "/var/log/openclaw/security.log"
  audit_log: "/var/log/openclaw/audit.log"
  format: "json"
